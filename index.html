<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анонимнет — Анонимный Мессенджер</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0B0E14;
      --bg-sidebar: #121721;
      --bg-card: rgba(22, 28, 40, 0.7);
      --bg-chat-bubble-user: #6366F1;
      --bg-chat-bubble-other: #1E2638;
      --accent: #6366F1;
      --accent-hover: #4F46E5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text-primary: #F3F4F6;
      --text-secondary: #9CA3AF;
      --border-color: rgba(255, 255, 255, 0.08);
      --online-color: #10B981;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Главный контейнер приложения */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      background: var(--bg-main);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      overflow: hidden;
      position: relative;
    }

    /* Боковая панель (Список чатов) */
    .sidebar {
      width: 340px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #6366F1, #A855F7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #FFFFFF, #9CA3AF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.2s;
    }

    .user-profile-badge:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--bg-chat-bubble-other);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      position: relative;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: var(--online-color);
      border-radius: 50%;
      position: absolute;
      bottom: 2px;
      right: 2px;
      border: 2px solid var(--bg-sidebar);
    }

    .user-info {
      flex: 1;
      overflow: hidden;
    }

    .user-name {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-id {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* Поиск */
    .search-box {
      padding: 15px 20px;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      outline: none;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Список чатов */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 4px;
    }

    .chat-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .chat-item.active {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .chat-item-details {
      flex: 1;
      overflow: hidden;
    }

    .chat-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .chat-item-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .chat-item-time {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .chat-item-last-msg {
      font-size: 0.85rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Область переписки */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
      position: relative;
    }

    .chat-header {
      padding: 16px 24px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .active-chat-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .active-chat-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .active-chat-subtitle {
      font-size: 0.8rem;
      color: var(--online-color);
    }

    .back-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 20px;
      cursor: pointer;
      margin-right: 10px;
    }

    /* Сообщения */
    .messages-container {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 65%;
    }

    .message-wrapper.incoming {
      align-self: flex-start;
    }

    .message-wrapper.outgoing {
      align-self: flex-end;
    }

    .message-sender {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
      margin-left: 4px;
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      position: relative;
      word-wrap: break-word;
    }

    .incoming .message-bubble {
      background: var(--bg-chat-bubble-other);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .outgoing .message-bubble {
      background: var(--bg-chat-bubble-user);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .message-time {
      font-size: 0.7rem;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }

    /* Форма ввода */
    .input-area {
      padding: 16px 24px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .message-input {
      flex: 1;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      color: var(--text-primary);
      outline: none;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .message-input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .send-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    /* Модальное окно профиля */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    /* Мобильная адаптивность */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        position: absolute;
        height: 100%;
      }

      .app-container.chat-active .sidebar {
        transform: translateX(-100%);
      }

      .chat-area {
        width: 100%;
        position: absolute;
        height: 100%;
        transform: translateX(100%);
        transition: transform 0.3s ease;
      }

      .app-container.chat-active .chat-area {
        transform: translateX(0);
      }

      .back-btn {
        display: block;
      }
    }
  </style>
</head>
<body>

  <div class="app-container" id="app">
    <!-- Боковое меню -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-logo">A</div>
          <div class="brand-title">Анонимнет</div>
        </div>
      </div>

      <!-- Ваш профиль -->
      <div class="user-profile-badge" id="profileBadge">
        <div class="avatar" id="myAvatar">🥷
          <div class="status-dot"></div>
        </div>
        <div class="user-info">
          <div class="user-name" id="myName">Аноним_7842</div>
          <div class="user-id" id="myId">ID: anon-7842</div>
        </div>
      </div>

      <!-- Поиск -->
      <div class="search-box">
        <input type="text" class="search-input" placeholder="Поиск комнат и сообщений..." id="searchInput">
      </div>

      <!-- Список чатов -->
      <div class="chat-list" id="chatList"></div>
    </aside>

    <!-- Главная область чата -->
    <main class="chat-area">
      <header class="chat-header">
        <div class="active-chat-info">
          <button class="back-btn" id="backBtn">←</button>
          <div class="avatar" id="activeAvatar">💬</div>
          <div>
            <div class="active-chat-title" id="activeChatTitle">Выберите чат</div>
            <div class="active-chat-subtitle" id="activeChatStatus">Онлайн</div>
          </div>
        </div>
      </header>

      <!-- Сообщения -->
      <div class="messages-container" id="messagesContainer">
        <!-- Сообщения рендерятся динамически -->
      </div>

      <!-- Поле ввода -->
      <div class="input-area">
        <input type="text" class="message-input" id="messageInput" placeholder="Напишите анонимное сообщение..." autocomplete="off">
        <button class="send-btn" id="sendBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </main>
  </div>

  <!-- Модальное окно редактирования профиля -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-card">
      <div class="modal-title">Настройки анонимности</div>
      <div class="form-group">
        <label for="inputName">Псевдоним</label>
        <input type="text" id="inputName" placeholder="Введите ваш псевдоним">
      </div>
      <div class="form-group">
        <label for="inputAvatar">Эмодзи-аватар</label>
        <input type="text" id="inputAvatar" placeholder="🥷" maxlength="2">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeModal">Отмена</button>
        <button class="btn btn-primary" id="saveProfile">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    // Инициализация профиля
    const state = {
      currentUser: {
        name: localStorage.getItem('anon_name') || 'Аноним_' + Math.floor(1000 + Math.random() * 9000),
        avatar: localStorage.getItem('anon_avatar') || '🥷',
        id: 'anon-' + Math.floor(1000 + Math.random() * 9000)
      },
      activeChatId: 1,
      chats: [
        {
          id: 1,
          name: 'Общий Чат',
          avatar: '🌐',
          status: '128 участников онлайн',
          messages: [
            { id: 1, sender: 'Призрак', text: 'Добро пожаловать в Анонимнет! Здесь полная свобода и никаких следов.', time: '14:20', isUser: false },
            { id: 2, sender: 'CyberPunk', text: 'Привет всем! Как вам дизайн?', time: '14:22', isUser: false }
          ]
        },
        {
          id: 2,
          name: 'Зашифрованный Канал',
          avatar: '🔐',
          status: 'Только чтение',
          messages: [
            { id: 1, sender: 'Система', text: 'Все сообщения шифруются на стороне клиента.', time: '12:00', isUser: false }
          ]
        },
        {
          id: 3,
          name: 'Теневой Комната #4',
          avatar: '🕶️',
          status: '4 участника онлайн',
          messages: [
            { id: 1, sender: 'Незнакомец', text: 'Кто тут из Невинномысска?', time: '15:10', isUser: false }
          ]
        }
      ]
    };

    // DOM-элементы
    const app = document.getElementById('app');
    const myNameEl = document.getElementById('myName');
    const myIdEl = document.getElementById('myId');
    const myAvatarEl = document.getElementById('myAvatar');
    const chatListEl = document.getElementById('chatList');
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const activeChatTitle = document.getElementById('activeChatTitle');
    const activeChatStatus = document.getElementById('activeChatStatus');
    const activeAvatar = document.getElementById('activeAvatar');
    const backBtn = document.getElementById('backBtn');
    
    // Элементы модального окна
    const profileBadge = document.getElementById('profileBadge');
    const profileModal = document.getElementById('profileModal');
    const closeModal = document.getElementById('closeModal');
    const saveProfile = document.getElementById('saveProfile');
    const inputName = document.getElementById('inputName');
    const inputAvatar = document.getElementById('inputAvatar');

    // Функция обновления профиля
    function updateProfileUI() {
      myNameEl.textContent = state.currentUser.name;
      myIdEl.textContent = 'ID: ' + state.currentUser.id;
      myAvatarEl.firstChild.textContent = state.currentUser.avatar;
    }

    // Рендер списка чатов
    function renderChatList() {
      chatListEl.innerHTML = '';
      state.chats.forEach(chat => {
        const lastMsg = chat.messages[chat.messages.length - 1];
        const chatItem = document.createElement('div');
        chatItem.className = `chat-item ${chat.id === state.activeChatId ? 'active' : ''}`;
        chatItem.onclick = () => selectChat(chat.id);

        chatItem.innerHTML = `
          <div class="avatar">${chat.avatar}</div>
          <div class="chat-item-details">
            <div class="chat-item-header">
              <span class="chat-item-name">${chat.name}</span>
              <span class="chat-item-time">${lastMsg ? lastMsg.time : ''}</span>
            </div>
            <div class="chat-item-last-msg">${lastMsg ? (lastMsg.isUser ? 'Вы: ' : '') + lastMsg.text : 'Нет сообщений'}</div>
          </div>
        `;
        chatListEl.appendChild(chatItem);
      });
    }

    // Выбор активного чата
    function selectChat(id) {
      state.activeChatId = id;
      app.classList.add('chat-active');
      const activeChat = state.chats.find(c => c.id === id);
      
      activeChatTitle.textContent = activeChat.name;
      activeChatStatus.textContent = activeChat.status;
      activeAvatar.textContent = activeChat.avatar;

      renderMessages();
      renderChatList();
    }

    // Рендер сообщений
    function renderMessages() {
      messagesContainer.innerHTML = '';
      const activeChat = state.chats.find(c => c.id === state.activeChatId);
      
      if (!activeChat) return;

      activeChat.messages.forEach(msg => {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${msg.isUser ? 'outgoing' : 'incoming'}`;

        wrapper.innerHTML = `
          ${!msg.isUser ? `<div class="message-sender">${msg.sender}</div>` : ''}
          <div class="message-bubble">
            <div>${escapeHTML(msg.text)}</div>
            <div class="message-time">${msg.time}</div>
          </div>
        `;
        messagesContainer.appendChild(wrapper);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Отправка сообщения
    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      const activeChat = state.chats.find(c => c.id === state.activeChatId);
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const newMsg = {
        id: Date.now(),
        sender: state.currentUser.name,
        text: text,
        time: timeStr,
        isUser: true
      };

      activeChat.messages.push(newMsg);
      messageInput.value = '';
      
      renderMessages();
      renderChatList();

      // Имитация анонимного автоответа для интерактивности
      if (activeChat.id === 1) {
        setTimeout(() => {
          const autoReply = {
            id: Date.now(),
            sender: 'Аноним_' + Math.floor(1000 + Math.random() * 9000),
            text: 'Интересная мысль! В Анонимнет это точно оценят.',
            time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
            isUser: false
          };
          activeChat.messages.push(autoReply);
          renderMessages();
          renderChatList();
        }, 1500);
      }
    }

    // Вспомогательная функция защиты от XSS
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Обработчики событий
    sendBtn.onclick = sendMessage;
    messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

    backBtn.onclick = () => {
      app.classList.remove('chat-active');
    };

    // Модальное окно профиля
    profileBadge.onclick = () => {
      inputName.value = state.currentUser.name;
      inputAvatar.value = state.currentUser.avatar;
      profileModal.classList.add('active');
    };

    closeModal.onclick = () => {
      profileModal.classList.remove('active');
    };

    saveProfile.onclick = () => {
      const newName = inputName.value.trim();
      const newAvatar = inputAvatar.value.trim();
      
      if (newName) state.currentUser.name = newName;
      if (newAvatar) state.currentUser.avatar = newAvatar;

      localStorage.setItem('anon_name', state.currentUser.name);
      localStorage.setItem('anon_avatar', state.currentUser.avatar);

      updateProfileUI();
      profileModal.classList.remove('active');
    };

    // Старт
    updateProfileUI();
    selectChat(1);
  </script>
</body>
</html>
