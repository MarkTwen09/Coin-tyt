<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NFT Кейсы</title>

  <style>
    /* ===== Переменные и темы ===== */
    :root {
      --bg: #0e1621;
      --card: #17212b;
      --card2: #1f2d3b;
      --tx: #f5f5f5;
      --mut: #7f91a4;
      --ac: #2ea6ff;
      --star: #ffb800;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #e9eef3;
        --card: #fff;
        --card2: #eef2f6;
        --tx: #111;
        --mut: #667;
        --ac: #1a8cd8;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e1621;
      --card: #17212b;
      --card2: #1f2d3b;
      --tx: #f5f5f5;
      --mut: #7f91a4;
      --ac: #2ea6ff;
    }

    /* ===== База ===== */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 560px;
      margin: auto;
      padding: 12px 12px 90px;
      user-select: none;
    }

    /* ===== Шапка ===== */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }
    .bal {
      background: var(--card);
      border-radius: 20px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 20px;
      transition: transform .2s;
    }
    .bal.pop { transform: scale(1.15); }
    h1 { font-size: 18px; margin: 0; }

    /* ===== Табы ===== */
    .tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      max-width: 560px;
      margin: auto;
      background: var(--card);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
      gap: 6px;
      z-index: 5;
    }
    .tabs button {
      flex: 1;
      border: 0;
      background: none;
      color: var(--mut);
      padding: 10px 4px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
    }
    .tabs button.on { background: var(--card2); color: var(--ac); }

    /* ===== Экраны ===== */
    .view { display: none; animation: fade .4s; }
    .view.on { display: block; }
    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    /* ===== Кликер ===== */
    .clk {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 0;
      position: relative;
    }
    .bigstar {
      width: 220px;
      height: 220px;
      border: 0;
      background: none;
      font-size: 170px;
      line-height: 1;
      filter: drop-shadow(0 12px 24px #ffb80080);
      transition: transform .12s;
      animation: float 3s ease-in-out infinite;
      touch-action: manipulation;
    }
    .bigstar:active {
      transform: scale(.88) rotate(-6deg);
      animation: none;
    }
    @keyframes float {
      50% { transform: translateY(-12px) rotate(4deg); }
    }
    .fl {
      position: absolute;
      font-weight: 800;
      font-size: 26px;
      color: var(--star);
      pointer-events: none;
      animation: up .9s forwards;
    }
    @keyframes up {
      to { transform: translateY(-120px); opacity: 0; }
    }
    .hint { color: var(--mut); margin: 6px 0 18px; }
    .up {
      background: var(--card);
      border: 0;
      color: var(--tx);
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      width: 100%;
    }
    .up:disabled { opacity: .45; }

    /* ===== Кейсы ===== */
    .cases { display: grid; gap: 12px; }
    .case {
      background: var(--card);
      border-radius: 22px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: transform .2s;
    }
    .case:active { transform: scale(.97); }
    .cico {
      font-size: 64px;
      filter: drop-shadow(0 8px 10px #0006);
      animation: float 3.5s ease-in-out infinite;
    }
    .case b { font-size: 17px; }
    .case small { display: block; color: var(--mut); margin-top: 4px; }
    .price {
      margin-left: auto;
      background: var(--ac);
      color: #fff;
      border-radius: 16px;
      padding: 8px 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ===== Рулетка ===== */
    .roul {
      position: relative;
      overflow: hidden;
      background: var(--card);
      border-radius: 20px;
      padding: 14px 0;
      margin: 12px 0;
      display: none;
    }
    .roul::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--star);
      box-shadow: 0 0 12px var(--star);
      transform: translateX(-50%);
      z-index: 2;
    }
    .strip { display: flex; gap: 8px; will-change: transform; }
    .it {
      flex: 0 0 96px;
      height: 116px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #fff;
      font-size: 11px;
      text-align: center;
      background: radial-gradient(circle at 50% 30%, var(--c1), var(--c2));
      perspective: 300px;
    }
    .it i {
      font-style: normal;
      font-size: 44px;
      filter: drop-shadow(0 6px 6px #0007);
    }
    .common { --c1: #8aa0b5; --c2: #4c6074; }
    .uncommon { --c1: #6fd18a; --c2: #2c7a46; }
    .rare { --c1: #4fb3ff; --c2: #1c5aa6; }
    .epic { --c1: #c77dff; --c2: #6a1fb0; }
    .legendary { --c1: #ffd24a; --c2: #d1530b; }

    .opens { width: 100%; margin-top: 6px; }
    .btn {
      border: 0;
      background: var(--ac);
      color: #fff;
      border-radius: 16px;
      padding: 14px;
      font-weight: 700;
      font-size: 16px;
      width: 100%;
    }
    .btn:disabled { opacity: .5; }

    /* ===== Инвентарь ===== */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .inv {
      border-radius: 20px;
      padding: 12px;
      text-align: center;
      color: #fff;
      background: radial-gradient(circle at 50% 25%, var(--c1), var(--c2));
      transform-style: preserve-3d;
      transition: transform .15s ease-out;
    }
    .inv i {
      font-style: normal;
      font-size: 66px;
      display: block;
      filter: drop-shadow(0 10px 10px #0008);
      animation: float 4s ease-in-out infinite;
    }
    .inv b { display: block; font-size: 14px; }
    .inv small { opacity: .85; }
    .inv button {
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      padding: 7px 10px;
      background: #0004;
      color: #fff;
      font-weight: 600;
      width: 100%;
    }
    .empty { text-align: center; color: var(--mut); padding: 50px 0; }

    /* ===== Модалка ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: #000c;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9;
      padding: 20px;
    }
    .modal.on { display: flex; }
    .win {
      width: 100%;
      max-width: 320px;
      border-radius: 28px;
      padding: 26px 18px;
      text-align: center;
      color: #fff;
      background: radial-gradient(circle at 50% 30%, var(--c1), var(--c2));
      animation: pop .6s cubic-bezier(.2, 1.6, .4, 1);
      box-shadow: 0 0 70px var(--c1);
      transform-style: preserve-3d;
    }
    @keyframes pop {
      from { transform: scale(.3) rotateY(180deg); opacity: 0; }
    }
    .win i {
      font-style: normal;
      font-size: 120px;
      display: block;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 14px 14px #0008);
    }
    .win h2 { margin: 6px 0 2px; }
    .win p { margin: 0 0 16px; opacity: .9; }
    .win .btn { background: #fff3; }
  </style>
</head>

<body>
  <!-- Шапка -->
  <div class="top">
    <h1>🎁 NFT Кейсы</h1>
    <div class="bal" id="bal">⭐ 0</div>
  </div>

  <!-- Экран 1: Кликер -->
  <section class="view on" id="v0">
    <div class="clk" id="clk">
      <button class="bigstar" id="star">⭐</button>
      <div class="hint">Тапай по звезде — получай Telegram Stars</div>
      <button class="up" id="up"></button>
    </div>
  </section>

  <!-- Экран 2: Кейсы -->
  <section class="view" id="v1">
    <div class="roul" id="roul">
      <div class="strip" id="strip"></div>
    </div>
    <div class="cases" id="cases"></div>
  </section>

  <!-- Экран 3: Инвентарь -->
  <section class="view" id="v2">
    <div id="inv"></div>
  </section>

  <!-- Нижние табы -->
  <div class="tabs">
    <button class="on" data-t="0">⭐ Кликер</button>
    <button data-t="1">📦 Кейсы</button>
    <button data-t="2">🎒 Инвентарь</button>
  </div>

  <!-- Модальное окно -->
  <div class="modal" id="modal">
    <div class="win" id="win"></div>
  </div>

  <script>
    /* ===== Данные предметов (Название, Эмодзи, Редкость, Цена) ===== */
    const G = {
      pepe:   ["Plush Pepe",      "🐸", "legendary", 5000],
      cap:    ["Durov’s Cap",     "🧢", "legendary", 2500],
      heart:  ["Heart Locket",    "💖", "epic",      800],
      ring:   ["Diamond Ring",    "💍", "epic",      500],
      peach:  ["Precious Peach",  "🍑", "epic",      400],
      hat:    ["Top Hat",         "🎩", "rare",      150],
      watch:  ["Swiss Watch",     "⌚", "rare",      120],
      rose:   ["Eternal Rose",    "🌹", "rare",      90],
      cat:    ["Scared Cat",      "🐱", "uncommon",  60],
      bear:   ["Toy Bear",        "🧸", "common",    30],
      potion: ["Love Potion",     "🧪", "common",    20],
      bag:    ["Loot Bag",        "👜", "common",    15]
    };

    /* ===== Настройки кейсов (Название, Иконка, Цена, Описание, Веса выпадения) ===== */
    const C = [
      {
        n: "Стартовый", ico: "📦", p: 50,
        d: "Мишки, зелья и редкие находки",
        w: { bag: 30, potion: 28, bear: 22, cat: 12, rose: 5, watch: 2, ring: 0.8 }
      },
      {
        n: "Золотой", ico: "🎁", p: 250,
        d: "Шляпы, часы и шанс на эпик",
        w: { bear: 20, cat: 22, rose: 22, watch: 16, hat: 12, peach: 5, ring: 3, heart: 1.5, cap: 0.5 }
      },
      {
        n: "Алмазный", ico: "💎", p: 1000,
        d: "Эпики и легендарки",
        w: { hat: 25, watch: 20, peach: 20, ring: 15, heart: 12, cap: 6, pepe: 2 }
      }
    ];

    /* ===== Состояние игры ===== */
    let S = { stars: 60, lvl: 1, inv: [] };
    try {
      const s = localStorage.getItem("nftcases");
      if (s) S = JSON.parse(s);
    } catch (e) {}

    const $ = id => document.getElementById(id);
    let busy = false;

    /* ===== Сохранение ===== */
    const save = () => {
      try {
        localStorage.setItem("nftcases", JSON.stringify(S));
      } catch (e) {}
    };

    /* ===== Обновление интерфейса ===== */
    function ui() {
      const b = $("bal");
      b.textContent = "⭐ " + S.stars;
      b.classList.add("pop");
      setTimeout(() => b.classList.remove("pop"), 150);

      const c = S.lvl * 100;
      $("up").textContent = `⚡ Сила клика ${S.lvl} → ${S.lvl + 1} · ⭐ ${c}`;
      $("up").disabled = S.stars < c;

      document.querySelectorAll(".price").forEach((p, i) => {
        p.style.opacity = S.stars >= C[i].p ? 1 : 0.5;
      });
      save();
    }

    /* ===== Табы ===== */
    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
      if (busy) return;
      document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x == b));
      document.querySelectorAll(".view").forEach((v, i) => v.classList.toggle("on", i == b.dataset.t));
      if (b.dataset.t == 2) inv();
    });

    /* ===== Клик по звезде ===== */
    $("star").onclick = e => {
      S.stars += S.lvl;
      ui();
      const f = document.createElement("div");
      f.className = "fl";
      f.textContent = "+" + S.lvl;
      const r = $("clk").getBoundingClientRect();
      f.style.left = (e.clientX - r.left + (Math.random() * 40 - 20)) + "px";
      f.style.top = (e.clientY - r.top - 30) + "px";
      $("clk").appendChild(f);
      setTimeout(() => f.remove(), 900);
      navigator.vibrate && navigator.vibrate(8);
    };

    /* ===== Прокачка клика ===== */
    $("up").onclick = () => {
      const c = S.lvl * 100;
      if (S.stars >= c) {
        S.stars -= c;
        S.lvl++;
        ui();
      }
    };

    /* ===== Рендер кейсов ===== */
    $("cases").innerHTML = C.map((c, i) =>
      `<div class="case" data-i="${i}">
        <div class="cico">${c.ico}</div>
        <div><b>${c.n}</b><small>${c.d}</small></div>
        <div class="price">⭐ ${c.p}</div>
      </div>`
    ).join("");

    document.querySelectorAll(".case").forEach(el => el.onclick = () => open(+el.dataset.i));

    /* ===== Выбор предмета по весам ===== */
    const pick = w => {
      const k = Object.keys(w);
      let t = k.reduce((a, x) => a + w[x], 0), r = Math.random() * t;
      for (const x of k) {
        if ((r -= w[x]) < 0) return x;
      }
      return k[0];
    };

    const card = k => `<div class="it ${G[k][2]}"><i>${G[k][1]}</i>${G[k][0]}</div>`;

    /* ===== Открытие кейса ===== */
    function open(i) {
      if (busy) return;
      const c = C[i];
      if (S.stars < c.p) {
        const b = $("bal");
        b.style.color = "#f55";
        setTimeout(() => b.style.color = "", 500);
        return;
      }
      busy = true;
      S.stars -= c.p;
      ui();

      const win = pick(c.w), N = 40, W = 35;
      const arr = [];
      for (let j = 0; j < N; j++) arr.push(j == W ? win : pick(c.w));

      const roul = $("roul"), st = $("strip");
      roul.style.display = "block";
      st.style.transition = "none";
      st.style.transform = "translateX(0)";
      st.innerHTML = arr.map(card).join("");

      requestAnimationFrame(() => requestAnimationFrame(() => {
        const cw = roul.clientWidth;
        const off = W * 104 + 48 - cw / 2 + (Math.random() * 60 - 30);
        st.style.transition = "transform 5.5s cubic-bezier(.12,.7,.1,1)";
        st.style.transform = `translateX(${-off}px)`;
      }));

      setTimeout(() => {
        S.inv.push(win);
        ui();
        const g = G[win];
        $("win").className = "win " + g[2];
        $("win").innerHTML = `<i>${g[1]}</i><h2>${g[0]}</h2><p>${g[2].toUpperCase()} · ⭐ ${g[3]}</p><button class="btn" id="ok">Забрать</button>`;
        $("modal").classList.add("on");
        $("ok").onclick = () => {
          $("modal").classList.remove("on");
          roul.style.display = "none";
          busy = false;
        };
      }, 5800);
    }

    /* ===== Инвентарь ===== */
    function inv() {
      const el = $("inv");
      if (!S.inv.length) {
        el.innerHTML = '<div class="empty">Пока пусто.<br>Открой первый кейс 📦</div>';
        return;
      }
      el.innerHTML = '<div class="grid">' + S.inv.map((k, i) =>
        `<div class="inv ${G[k][2]}">
          <i>${G[k][1]}</i>
          <b>${G[k][0]}</b>
          <small>⭐ ${G[k][3]}</small>
          <button data-i="${i}">Продать</button>
        </div>`
      ).join("") + "</div>";

      el.querySelectorAll("button").forEach(b => b.onclick = () => {
        const k = S.inv.splice(+b.dataset.i, 1)[0];
        S.stars += G[k][3];
        ui();
        inv();
      });

      el.querySelectorAll(".inv").forEach(c => {
        c.onpointermove = e => {
          const r = c.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width - 0.5;
          const y = (e.clientY - r.top) / r.height - 0.5;
          c.style.transform = `perspective(500px) rotateY(${x * 24}deg) rotateX(${-y * 24}deg)`;
        };
        c.onpointerleave = () => c.style.transform = "";
      });
    }

    /* ===== Старт ===== */
    ui();
  </script>
</body>
</html>
