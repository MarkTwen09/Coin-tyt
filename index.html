<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus // Protocol Dispatch Engine</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-base: #090a0f;
            --surface: rgba(18, 20, 28, 0.75);
            --surface-hover: rgba(26, 30, 42, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.5);
            --accent: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.04) 0%, transparent 60%);
        }

        header {
            height: 60px;
            border-bottom: 1px solid var(--border);
            background: rgba(9, 10, 15, 0.8);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -0.01em;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            background: var(--accent-gradient);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-family: var(--font-mono);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
        }

        .main-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 380px 1fr 400px;
            gap: 24px;
            padding: 24px 32px;
            max-width: 1700px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1300px) {
            .main-layout { grid-template-columns: 360px 1fr; }
            .right-panel { grid-column: span 2; }
        }

        @media (max-width: 850px) {
            .main-layout { grid-template-columns: 1fr; }
            .right-panel { grid-column: span 1; }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        input[type="text"], select {
            width: 100%;
            background: rgba(15, 17, 23, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 12px 11px 38px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        select { appearance: none; cursor: pointer; padding-left: 38px; }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .services-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
        }

        .service-chip {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .service-chip:hover { background: rgba(255, 255, 255, 0.04); }
        .service-chip.active { background: rgba(99, 102, 241, 0.12); border-color: var(--accent); color: #818cf8; }
        .service-chip input { display: none; }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 2px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
            display: none;
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-value {
            font-family: var(--font-mono);
            font-size: 18px;
            font-weight: 600;
        }

        .metric-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .chart-box {
            width: 100%;
            height: 160px;
            background: rgba(12, 14, 20, 0.5);
            border: 1px solid var(--border);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        canvas { width: 100%; height: 100%; display: block; }

        .terminal {
            background: #06070a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-row {
            display: flex;
            gap: 8px;
            line-height: 1.4;
            word-break: break-all;
        }

        .log-time { color: var(--text-muted); flex-shrink: 0; }
        .log-badge {
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            flex-shrink: 0;
            height: fit-content;
        }

        .bg-success { background: rgba(16, 185, 129, 0.12); color: var(--success); }
        .bg-warning { background: rgba(245, 158, 11, 0.12); color: var(--warning); }
        .bg-danger { background: rgba(239, 68, 68, 0.12); color: var(--danger); }
        .bg-info { background: rgba(99, 102, 241, 0.12); color: #818cf8; }

        .log-msg { color: #d1d5db; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon">
                <i data-lucide="cpu" style="width: 16px; height: 16px; color: #fff;"></i>
            </div>
            <span>NEXUS <span style="color: var(--text-muted); font-weight: 400;">// Protocol Engine</span></span>
        </div>
        <div class="status-pill">
            <div class="status-dot"></div>
            <span id="sysStatusText">Система готова</span>
        </div>
    </header>

    <div class="main-layout">
        <!-- Left Column: Controls -->
        <div class="card">
            <div class="card-header">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="sliders" style="width: 14px; height: 14px;"></i> Параметры сессии
                </span>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>Целевой номер</label>
                    <div class="input-wrapper">
                        <input type="text" id="phoneInput" value="+7 (900) 555-35-35">
                        <i data-lucide="phone"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Интенсивность запросов</label>
                    <div class="input-wrapper">
                        <select id="rateSelect">
                            <option value="3">Низкая (3 req/s - Скрытный режим)</option>
                            <option value="8" selected>Средняя (8 req/s - Стандарт)</option>
                            <option value="15">Высокая (15 req/s - Быстрый шлюз)</option>
                        </select>
                        <i data-lucide="activity"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Пакет итераций</label>
                    <div class="input-wrapper">
                        <select id="limitSelect">
                            <option value="50">50 пакетов</option>
                            <option value="120" selected>120 пакетов</option>
                            <option value="300">300 пакетов</option>
                        </select>
                        <i data-lucide="layers"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Шлюзы маршрутизации</label>
                    <div class="services-box" id="gatewaysGrid"></div>
                </div>

                <div style="margin-top: auto; padding-top: 8px;">
                    <button class="btn btn-primary" id="startBtn" onclick="startSimulation()">
                        <i data-lucide="play" style="width: 16px; height: 16px;"></i> Запустить тест
                    </button>
                    <button class="btn btn-danger" id="stopBtn" onclick="stopSimulation()">
                        <i data-lucide="square" style="width: 16px; height: 16px;"></i> Прервать сессию
                    </button>
                </div>
            </div>
        </div>

        <!-- Center Column: Metrics & Graph -->
        <div class="card">
            <div class="card-header">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="bar-chart-2" style="width: 14px; height: 14px;"></i> Телеметрия очереди
                </span>
                <span id="proxyInfo" style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">IP: Ожидание...</span>
            </div>
            <div class="card-body">
                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-label">Отправлено</span>
                        <span class="metric-value" id="mSent" style="color: #fff;">0</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Доставлено (200)</span>
                        <span class="metric-value" id="mSuccess" style="color: var(--success);">0</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Ошибки / Лимиты</span>
                        <span class="metric-value" id="mErrors" style="color: var(--danger);">0</span>
                    </div>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted);">
                        <span>Прогресс выполнения</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressBar"></div>
                    </div>
                </div>

                <div class="form-group" style="flex: 1;">
                    <label>Пропускная способность (RPS)</label>
                    <div class="chart-box">
                        <canvas id="chartCanvas"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Terminal Logs -->
        <div class="card right-panel">
            <div class="card-header">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="terminal" style="width: 14px; height: 14px;"></i> Консоль шлюзов
                </span>
                <i data-lucide="trash-2" style="width: 14px; height: 14px; cursor: pointer; color: var(--text-muted);" onclick="clearLogs()"></i>
            </div>
            <div class="card-body" style="padding: 12px;">
                <div class="terminal" id="terminal">
                    <div class="log-row">
                        <span class="log-time">00:00:00</span>
                        <span class="log-badge bg-info">INIT</span>
                        <span class="log-msg">Модуль инициализирован. Ожидание запуска задачи.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const gateways = [
            'Auth Hub Core', 'Telegram OAuth', 'SberID Gateway', 'Tinkoff Secure',
            'Yandex Passport', 'Ozon ID Service', 'Wildberries Auth', 'VK Connect API',
            'Avito Security', 'Delivery Club OTP', 'MVideo Verify', 'X5 ID Service'
        ];

        const proxies = [
            '185.22.14.88 (NL)', '45.12.74.12 (DE)', '194.67.21.5 (RU)',
            '91.240.118.2 (SG)', '176.119.4.15 (KZ)', '212.109.19.7 (FR)'
        ];

        const grid = document.getElementById('gatewaysGrid');
        gateways.forEach(gw => {
            const label = document.createElement('label');
            label.className = 'service-chip active';
            label.innerHTML = `
                <input type="checkbox" checked value="${gw}" onchange="this.parentElement.classList.toggle('active', this.checked)">
                <span>${gw}</span>
            `;
            grid.appendChild(label);
        });

        let active = false;
        let timer = null;
        let sent = 0, success = 0, errors = 0, targetTotal = 120;
        const rpsHistory = new Array(30).fill(0);

        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawChart() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            ctx.strokeStyle = 'rgba(255,255,255,0.02)';
            ctx.lineWidth = 1;
            for(let y = 0; y < h; y += 25) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            }

            ctx.beginPath();
            const step = w / (rpsHistory.length - 1);
            ctx.moveTo(0, h);
            for(let i = 0; i < rpsHistory.length; i++) {
                const val = (rpsHistory[i] / 20) * (h - 15);
                const x = i * step;
                const y = h - val;
                if(i === 0) ctx.lineTo(x, y);
                else {
                    const px = (i - 1) * step;
                    const py = h - (rpsHistory[i - 1] / 20) * (h - 15);
                    const cx = (px + x) / 2;
                    ctx.bezierCurveTo(cx, py, cx, y, x, y);
                }
            }
            ctx.lineTo(w, h);
            ctx.closePath();

            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, 'rgba(99, 102, 241, 0.25)');
            grad.addColorStop(1, 'rgba(99, 102, 241, 0)');
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.beginPath();
            for(let i = 0; i < rpsHistory.length; i++) {
                const val = (rpsHistory[i] / 20) * (h - 15);
                const x = i * step;
                const y = h - val;
                if(i === 0) ctx.moveTo(x, y);
                else {
                    const px = (i - 1) * step;
                    const py = h - (rpsHistory[i - 1] / 20) * (h - 15);
                    const cx = (px + x) / 2;
                    ctx.bezierCurveTo(cx, py, cx, y, x, y);
                }
            }
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function log(msg, type = 'info') {
            const term = document.getElementById('terminal');
            const row = document.createElement('div');
            row.className = 'log-row';
            const time = new Date().toLocaleTimeString();

            let badgeClass = 'bg-info', badgeText = 'INFO';
            if(type === 'success') { badgeClass = 'bg-success'; badgeText = '200 OK'; }
            if(type === 'warn') { badgeClass = 'bg-warning'; badgeText = 'LIMIT'; }
            if(type === 'error') { badgeClass = 'bg-error bg-danger'; badgeText = 'BLOCKED'; }

            row.innerHTML = `
                <span class="log-time">${time}</span>
                <span class="log-badge ${badgeClass}">${badgeText}</span>
                <span class="log-msg">${msg}</span>
            `;
            term.appendChild(row);
            term.scrollTop = term.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('terminal').innerHTML = '';
        }

        function startSimulation() {
            const phone = document.getElementById('phoneInput').value.trim();
            if(!phone) { alert('Введите целевой номер!'); return; }

            const activeGateways = Array.from(document.querySelectorAll('.services-chip input:checked')).map(e => e.value);
            if(activeGateways.length === 0) { alert('Выберите хотя бы один шлюз!'); return; }

            active = true;
            sent = 0; success = 0; errors = 0;
            targetTotal = parseInt(document.getElementById('limitSelect').value);
            const speed = parseInt(document.getElementById('rateSelect').value);

            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';
            document.getElementById('sysStatusText').innerText = 'Выполнение задачи...';

            log(`Запуск симуляции для ${phone}. Выбрано шлюзов: ${activeGateways.length}`, 'info');

            const intervalMs = Math.floor(1000 / speed);

            timer = setInterval(() => {
                if(!active) return;

                sent++;
                
                // Realism simulation: 50% success, 30% rate limit 429, 20% firewall/cloudflare block or timeout
                const rand = Math.random();
                const gw = activeGateways[Math.floor(Math.random() * activeGateways.length)];
                const currentProxy = proxies[Math.floor(Math.random() * proxies.length)];
                document.getElementById('proxyInfo').innerText = `IP: ${currentProxy}`;

                if(rand < 0.48) {
                    success++;
                    log(`[${gw}] Пакет принят шлюзом [200 OK] через IP ${currentProxy}`, 'success');
                } else if(rand < 0.78) {
                    errors++;
                    log(`[${gw}] Превышен лимит запросов [429 Too Many Requests] - IP в бане`, 'warn');
                } else {
                    errors++;
                    log(`[${gw}] Соединение сброшено WAF / Таймаут шлюза [504 Gateway Timeout]`, 'error');
                }

                document.getElementById('mSent').innerText = sent;
                document.getElementById('mSuccess').innerText = success;
                document.getElementById('mErrors').innerText = errors;

                const pct = Math.min(100, Math.round((sent / targetTotal) * 100));
                document.getElementById('progressBar').style.width = pct + '%';
                document.getElementById('progressText').innerText = pct + '%';

                rpsHistory.shift();
                rpsHistory.push(speed + (Math.random() * 4 - 2));
                drawChart();

                if(sent >= targetTotal) {
                    stopSimulation(true);
                }
            }, intervalMs);
        }

        function stopSimulation(completed = false) {
            active = false;
            if(timer) clearInterval(timer);

            document.getElementById('startBtn').style.display = 'flex';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('sysStatusText').innerText = 'Система готова';
            document.getElementById('proxyInfo').innerText = 'IP: Ожидание...';

            rpsHistory.fill(0);
            drawChart();

            if(completed) {
                log(`Сессия завершена. Успешно доставлено: ${success} из ${sent} (${Math.round((success/sent)*100)}%)`, 'info');
            } else {
                log('Сессия прервана пользователем.', 'warn');
            }
        }
    </script>
</body>
</html>
