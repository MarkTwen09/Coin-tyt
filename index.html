<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Аноним Нет</title>
<style>
/* ============================================================
   АНОНИМ НЕТ — Telegram iOS Style (3D Liquid Glass)
   ============================================================ */
:root {
  /* iOS Telegram Colors */
  --bg-base: #000000;
  --bg-panel: #1c1c1e;
  --bg-panel-hover: #2c2c2e;
  --bg-search: #1c1c1e;
  --bg-nav: rgba(28, 28, 30, 0.75);
  
  --text-main: #ffffff;
  --text-dim: #8e8e93;
  --accent: #0a84ff; /* iOS Blue */
  --accent-gradient: linear-gradient(135deg, #0a84ff, #0066cc);
  
  /* Bubbles */
  --bubble-in: #262628;
  --bubble-out: #0a84ff;
  --bubble-out-gradient: linear-gradient(180deg, #0a84ff, #0077ed);
  
  --doodle: rgba(255, 255, 255, 0.03);
  --border: rgba(255, 255, 255, 0.08);
  
  /* Glassmorphism */
  --glass-bg: rgba(30, 30, 32, 0.65);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

* {
  box-sizing: border-box; margin: 0; padding: 0; 
  -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: var(--bg-base); color: var(--text-main); }

button { cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { border: none; outline: none; background: none; color: inherit; }

.app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

/* ===================== САЙДБАР (СПИСОК ЧАТОВ) ===================== */
.sidebar {
  width: 100%; max-width: 420px; background: var(--bg-base);
  display: flex; flex-direction: column; position: relative;
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  z-index: 10;
}

/* Шапка */
.sb-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
}
.btn-text { font-size: 17px; color: var(--text-main); font-weight: 400; }
.btn-text.dim { color: var(--text-dim); }
.header-center { display: flex; gap: 16px; align-items: center; }
.header-title { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.icon-btn { font-size: 22px; color: var(--text-main); display: grid; place-items: center; }
.icon-btn-bg {
  width: 36px; height: 36px; border-radius: 50%; background: var(--bg-panel);
  display: grid; place-items: center; font-size: 18px; transition: 0.2s;
}
.icon-btn-bg:active { transform: scale(0.92); background: var(--bg-panel-hover); }

/* Поиск */
.search-wrap { padding: 8px 16px; }
.search {
  width: 100%; background: var(--bg-search); border-radius: 12px;
  padding: 8px 12px; font-size: 17px; color: var(--text-main);
  display: flex; align-items: center; gap: 8px;
}
.search input { width: 100%; font-size: 17px; }
.search input::placeholder { color: var(--text-dim); }

/* Папки */
.folders {
  display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none;
}
.folders::-webkit-scrollbar { display: none; }
.folder {
  background: var(--bg-panel); padding: 6px 14px; border-radius: 20px;
  font-size: 15px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px;
  transition: 0.2s;
}
.folder.active { background: #3a3a3c; }
.folder-badge { background: var(--bg-panel-hover); border-radius: 10px; padding: 1px 6px; font-size: 13px; }

/* Список чатов */
.chat-list { flex: 1; overflow-y: auto; padding-bottom: 100px; }
.chat-list::-webkit-scrollbar { display: none; }

.chat-item {
  display: flex; align-items: center; gap: 12px; padding: 8px 16px;
  transition: background 0.2s; cursor: pointer;
}
.chat-item:active { background: var(--bg-panel); }

.avatar-wrap { position: relative; flex: 0 0 auto; }
.avatar {
  width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 600; font-size: 22px; color: #fff; background: #3a3a3c;
}
.avatar-ring {
  position: absolute; inset: -2px; border-radius: 50%;
  background: conic-gradient(from 0deg, #0a84ff, #30d158, #0a84ff);
  z-index: -1; opacity: 0;
}
.avatar-ring.active { opacity: 1; }
.avatar-ring::after {
  content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--bg-base);
}

.ci-body { flex: 1; min-width: 0; border-bottom: 1px solid var(--border); padding-bottom: 8px; padding-top: 4px; }
.chat-item:last-child .ci-body { border-bottom: none; }

.ci-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.ci-name { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px;}
.ci-time { font-size: 14px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
.ci-bottom { display: flex; justify-content: space-between; align-items: center; }
.ci-sub { font-size: 15px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci-sub b { color: var(--text-main); font-weight: 400; }
.badge {
  background: var(--text-dim); color: #fff; border-radius: 11px; font-size: 13px; font-weight: 600;
  padding: 2px 7px; min-width: 22px; text-align: center;
}
.badge.unread { background: var(--accent); }
.badge.muted { background: #3a3a3c; color: var(--text-dim); }
.icon-muted { font-size: 14px; color: var(--text-dim); }

/* Нижняя навигация */
.bottom-nav {
  position: absolute; bottom: 20px; left: 16px; right: 16px;
  background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--glass-border); border-radius: 30px;
  display: flex; justify-content: space-around; align-items: center;
  padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 20;
  padding-bottom: calc(6px + env(safe-area-inset-bottom));
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 10px; font-weight: 500; color: var(--text-dim); padding: 6px 12px;
  border-radius: 20px; transition: 0.2s;
}
.nav-item.active { background: rgba(255,255,255,0.1); color: var(--accent); }
.nav-item svg { width: 24px; height: 24px; fill: currentColor; }

/* ===================== ЧАТ ===================== */
.chat {
  flex: 1; display: flex; flex-direction: column; position: absolute; inset: 0;
  background: var(--bg-base); z-index: 100;
  transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
}
.app.chat-open .chat { transform: translateX(0); }

.chat-header {
  display: flex; align-items: center; gap: 12px; padding: 8px 12px;
  padding-top: calc(8px + env(safe-area-inset-top));
  background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); z-index: 10;
}
.chat-header .avatar { width: 42px; height: 42px; font-size: 16px; }
.chat-title { flex: 1; min-width: 0; }
.chat-title .name { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.chat-title .status { font-size: 13px; color: var(--text-dim); }
.chat-title .status.online { color: var(--accent); }
.back-btn { color: var(--accent); font-size: 20px; margin-right: -4px; display: grid; place-items: center; }

/* Сообщения */
.msgs-wrap { position: relative; flex: 1; overflow: hidden; }
.doodle-bg { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--doodle); pointer-events: none; }
.messages {
  position: absolute; inset: 0; overflow-y: auto; padding: 16px 16px 100px;
  display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { display: none; }

.date-chip {
  align-self: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
  color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 500;
  margin: 12px 0; user-select: none;
}

/* 3D Bubbles */
.msg {
  max-width: 80%; padding: 8px 12px; border-radius: 18px;
  font-size: 16px; line-height: 1.35; word-break: break-word; position: relative;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  transform-origin: bottom;
  animation: msgPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes msgPop {
  0% { opacity: 0; transform: scale(0.8) translateY(20px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.msg.in {
  align-self: flex-start; background: var(--bubble-in); border-bottom-left-radius: 6px;
}
.msg.out {
  align-self: flex-end; background: var(--bubble-out-gradient); border-bottom-right-radius: 6px;
  box-shadow: 0 2px 10px rgba(10, 132, 255, 0.3);
}

.msg .text { white-space: pre-wrap; }
.msg .meta {
  display: flex; align-items: center; justify-content: flex-end; gap: 4px;
  font-size: 12px; margin-top: 4px; color: rgba(255,255,255,0.6);
}
.msg.in .meta { color: var(--text-dim); }
.tick { font-size: 14px; letter-spacing: -3px; color: #fff; }
.msg.in .tick { color: var(--accent); }

/* Реакции */
.reactions { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.reaction {
  background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
  border-radius: 12px; padding: 2px 8px; font-size: 14px;
  display: flex; align-items: center; gap: 4px; transition: 0.2s;
  animation: reactionPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes reactionPop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
.reaction.mine { background: rgba(10, 132, 255, 0.4); border: 1px solid rgba(10, 132, 255, 0.6); }
.reaction:active { transform: scale(0.9); }

/* Голосовые */
.voice-msg { display: flex; align-items: center; gap: 12px; min-width: 180px; }
.play-btn { width: 32px; height: 32px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; font-size: 12px; }
.msg.in .play-btn { background: var(--accent); color: #fff; }
.wave { display: flex; align-items: center; gap: 2px; height: 24px; flex: 1; }
.wave span { width: 3px; border-radius: 2px; background: rgba(255,255,255,0.4); transition: 0.2s; }
.msg.in .wave span { background: rgba(255,255,255,0.2); }
.wave span.played { background: #fff; }

/* ===================== 3D LIQUID GLASS COMPOSER ===================== */
.composer-container {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 16px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
  z-index: 20; pointer-events: none;
}

.composer-glass {
  pointer-events: auto; display: flex; align-items: flex-end; gap: 8px;
  background: var(--glass-bg);
  backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 6px;
  box-shadow: var(--glass-shadow);
  transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.composer-glass:focus-within {
  border-color: rgba(255,255,255,0.25);
  box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.3);
}

.attach-btn {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  color: var(--text-dim); font-size: 20px; transition: 0.2s;
}
.attach-btn:active { background: rgba(255,255,255,0.1); transform: scale(0.9); }

.input-wrap { flex: 1; display: flex; align-items: flex-end; padding: 0 4px; }
#input {
  width: 100%; resize: none; max-height: 120px; font-size: 17px;
  padding: 8px 0; color: var(--text-main); line-height: 1.3;
}
#input::placeholder { color: var(--text-dim); }

.send-btn {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-gradient); color: #fff; font-size: 16px;
  box-shadow: 0 4px 12px rgba(10, 132, 255, 0.4); transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.send-btn:active { transform: scale(0.85); }
.send-btn.mic { background: transparent; box-shadow: none; color: var(--text-dim); }

/* Запись голосового */
.recording-ui { display: flex; align-items: center; gap: 12px; width: 100%; padding: 0 8px; height: 36px; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff453a; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
.rec-time { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.rec-hint { flex: 1; color: var(--text-dim); font-size: 15px; }
.rec-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.1); }
.rec-btn.send { background: var(--accent); }

/* Меню и панели */
.ctx {
  position: fixed; z-index: 200; background: var(--bg-panel); border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.8); min-width: 200px; padding: 6px;
  border: 1px solid var(--border); animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
.ctx-emojis { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.ctx-emoji { font-size: 22px; padding: 4px; border-radius: 50%; transition: 0.1s; }
.ctx-emoji:active { transform: scale(1.3); }
.ctx-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; font-size: 16px; border-radius: 10px; transition: 0.1s; }
.ctx-item:active { background: var(--bg-panel-hover); }
.ctx-item.danger { color: #ff453a; }

.emoji-panel {
  position: fixed; z-index: 150; background: var(--bg-panel); border-radius: 16px;
  padding: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 1px solid var(--border);
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
  animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.emoji-panel button { font-size: 24px; transition: 0.1s; }
.emoji-panel button:active { transform: scale(1.3); }

.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
  color: #fff; padding: 12px 20px; border-radius: 20px; font-size: 14px;
  opacity: 0; transition: 0.3s; pointer-events: none; z-index: 300;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 768px) {
  .app { max-width: 480px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
}
</style>
</head>
<body>

<div class="app" id="app">
  
  <!-- СПИСОК ЧАТОВ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">
      <button class="btn-text dim">Изм.</button>
      <div class="header-center">
        <div class="header-title">
          <span style="color:var(--accent); font-size: 20px;">✈️</span> Аноним Нет
        </div>
      </div>
      <button class="icon-btn icon-btn-bg" id="themeBtn">✎</button>
    </div>

    <div class="search-wrap">
      <div class="search">
        <span style="color:var(--text-dim); font-size: 16px;">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск">
      </div>
    </div>

    <div class="folders">
      <div class="folder active">Все</div>
      <div class="folder">Vz <span class="folder-badge">14</span></div>
      <div class="folder">Перелив <span class="folder-badge">2</span></div>
      <div class="folder">1 <span class="folder-badge">1</span></div>
    </div>

    <div class="chat-list" id="chatList"></div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Контакты
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        Звонки
      </div>
      <div class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        Чаты
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        Настройки
      </div>
    </div>
  </aside>

  <!-- ЧАТ -->
  <main class="chat" id="chat">
    <header class="chat-header">
      <button class="back-btn" id="backBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="avatar" id="chatAvatar">А</div>
      <div class="chat-title">
        <div class="name" id="chatName">Аноним</div>
        <div class="status" id="chatStatus">в сети</div>
      </div>
      <button class="icon-btn" style="color:var(--accent); font-size: 20px;">📞</button>
    </header>

    <div class="msgs-wrap">
      <svg class="doodle-bg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="doodle" width="400" height="400" patternUnits="userSpaceOnUse">
             <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
               <path d="M 50 50 Q 70 20 90 50 T 130 50" transform="rotate(15 50 50)"/>

             </g>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#doodle)"/>
      </svg>

      <div class="messages" id="messages"></div>

      <!-- 3D LIQUID GLASS COMPOSER -->
      <div class="composer-container">
        <div class="composer-glass" id="composerGlass">
          
          <div id="normalPanel" style="display:flex; width:100%; align-items:flex-end; gap:8px;">
            <button class="attach-btn" id="emojiBtn">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            </button>
            <div class="input-wrap">
              <textarea id="input" rows="1" placeholder="Сообщение"></textarea>
            </div>
            <button class="send-btn mic" id="sendBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
          </div>

          <div id="recPanel" hidden style="display:flex; width:100%;">
            <div class="recording-ui">
              <div class="rec-dot"></div>
              <div class="rec-time" id="recTime">0:00</div>
              <div class="rec-hint">Запись...</div>
              <button class="rec-btn" id="recCancel">✕</button>
              <button class="rec-btn send" id="recSend">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const nid = () => 'm' + Date.now() + Math.random().toString(36).substr(2, 5);
const nowTime = () => {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};
const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2000);
}

const EMOJIS = ['👍','❤️','🔥','😂','😮','😢','🎉','👏','🤔','💩','😍','🥰','😎','🤯','🙏','💯'];

// Данные с учетом стиля скриншота
const chats = [
  {
    id: 'archive', name: 'Архив чатов', avatar: '📁', color: '#3a3a3c',
    status: 'Взаимные подписки ❤️', time: '', unread: 182, muted: false, pinned: true,
    messages: []
  },
  {
    id: '9g', name: '9г', avatar: '9г', color: '#ff453a',
    status: 'Максон: Опять', time: '13:10', unread: 0, muted: true, pinned: true,
    messages: [
      {id:nid(), out:false, type:'text', time:'13:09', text:'Опять', reactions:{}, mine:{}}
    ]
  },
  {
    id: 'anonym', name: 'Аноним', avatar: 'А', color: '#0a84ff',
    status: 'в сети', time: '12:02', unread: 0, muted: false, pinned: false,
    messages: [
      {id:nid(), out:false, type:'text', time:'11:58', text:'Привет 👋 Добро пожаловать в Аноним Нет!', reactions:{}, mine:{}},
      {id:nid(), out:false, type:'text', time:'11:59', text:'Оцени 3D-эффекты и жидкое стекло 🧊', reactions:{'🔥':3}, mine:{}},
      {id:nid(), out:true, type:'text', time:'12:02', text:'Кайф! Выглядит супер свежо.', reactions:{}, mine:{}}
    ]
  },
  {
    id: 'secret', name: 'Секретный чат', avatar: '🔒', color: '#30d158',
    status: 'был(а) недавно', time: '10:13', unread: 2, muted: false, pinned: false,
    messages: [
      {id:nid(), out:false, type:'text', time:'10:12', text:'Этот чат шифруется 🛡️', reactions:{}, mine:{}},
      {id:nid(), out:false, type:'voice', time:'10:13', reactions:{'❤️':1}, mine:{}, voice:{url:null, duration:6, bars:Array.from({length:30},()=>Math.random()*0.8+0.2)}}
    ]
  }
];

let activeId = 'anonym';
const activeChat = () => chats.find(c => c.id === activeId);

// Рендер списка чатов
function renderChatList(filter = '') {
  const list = $('#chatList');
  list.innerHTML = '';
  chats.filter(c => c.name.toLowerCase().includes(filter.toLowerCase())).forEach(c => {
    const el = document.createElement('div');
    el.className = 'chat-item';
    
    // Кольцо вокруг аватара (для архива)
    const ringHTML = c.id === 'archive' ? `<div class="avatar-ring active"></div>` : '';
    
    // Иконки справа
    let rightIcon = '';
    if (c.pinned) rightIcon = `<span class="icon-muted">📌</span>`;
    else if (c.muted) rightIcon = `<span class="icon-muted">🔕</span>`;

    // Бейдж
    let badge = '';
    if (c.unread > 0) {
      badge = `<div class="badge ${c.muted ? 'muted' : 'unread'}">${c.unread}</div>`;
    }

    el.innerHTML = `
      <div class="avatar-wrap">
        ${ringHTML}
        <div class="avatar" style="background:${c.color}">${c.avatar}</div>
      </div>
      <div class="ci-body">
        <div class="ci-top">
          <div class="ci-name">${c.name} ${c.muted ? '<span class="icon-muted" style="font-size:14px">🔕</span>' : ''}</div>
          <div class="ci-time">${c.time} ${rightIcon}</div>
        </div>
        <div class="ci-bottom">
          <div class="ci-sub">${c.status}</div>
          ${badge}
        </div>
      </div>
    `;
    el.onclick = () => switchChat(c.id);
    list.appendChild(el);
  });
}

// Переключение чата
function switchChat(id) {
  activeId = id;
  const c = activeChat();
  c.unread = 0;
  
  $('#chatName').textContent = c.name;
  $('#chatStatus').textContent = c.status;
  $('#chatStatus').classList.toggle('online', c.status === 'в сети');
  
  const av = $('#chatAvatar');
  av.textContent = c.avatar;
  av.style.background = c.color;

  renderMessages();
  renderChatList($('#searchInput').value);
  
  $('#app').classList.add('chat-open');
  closeEmojiPanel();
  closeContext();
}

// Рендер сообщений
function renderMessages() {
  const box = $('#messages');
  box.innerHTML = '';
  
  const msgs = activeChat().messages;
  if (msgs.length) {
    const chip = document.createElement('div');
    chip.className = 'date-chip';
    chip.textContent = 'Сегодня';
    box.appendChild(chip);
  }

  msgs.forEach(m => {
    box.appendChild(messageEl(m));
  });
  scrollToBottom(true);
}

function scrollToBottom(instant) {
  const box = $('#messages');
  requestAnimationFrame(() => {
    box.scrollTo({ top: box.scrollHeight, behavior: instant ? 'auto' : 'smooth' });
  });
}

// Создание элемента сообщения
function messageEl(m) {
  const el = document.createElement('div');
  el.className = `msg ${m.out ? 'out' : 'in'}`;
  el.dataset.id = m.id;

  if (m.type === 'text') {
    const t = document.createElement('div');
    t.className = 'text';
    t.textContent = m.text;
    el.appendChild(t);
  } else {
    el.appendChild(voiceEl(m));
  }

  // Мета (время + галочки)
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<span>${m.time}</span>` + (m.out ? `<span class="tick">✓✓</span>` : '');
  el.appendChild(meta);

  // Реакции
  const react = document.createElement('div');
  react.className = 'reactions';
  el.appendChild(react);
  renderReactions(react, m);

  attachContext(el, m);

  // Двойной клик = сердечко
  el.addEventListener('dblclick', e => {
    if(window.getSelection().toString()) return;
    e.preventDefault();
    toggleReaction(m, '❤️');
  });

  return el;
}

// Голосовое сообщение
function voiceEl(m) {
  const v = m.voice;
  const wrap = document.createElement('div');
  wrap.className = 'voice-msg';

  const btn = document.createElement('button');
  btn.className = 'play-btn';
  btn.innerHTML = '▶';
  wrap.appendChild(btn);

  const wave = document.createElement('div');
  wave.className = 'wave';
  v.bars.forEach(h => {
    const b = document.createElement('span');
    b.style.height = Math.round(h * 100) + '%';
    wave.appendChild(b);
  });
  wrap.appendChild(wave);

  const dur = document.createElement('span');
  dur.style.fontSize = '12px';
  dur.style.fontWeight = '500';
  dur.textContent = fmt(v.duration);

  if(!v.url) {
    btn.onclick = e => { e.stopPropagation(); toast('Демо голосовое'); };
    return wrap;
  }

  const audio = new Audio(v.url);
  const bars = [...wave.children];

  btn.onclick = e => {
    e.stopPropagation();
    if(audio.paused) {
      audio.play();
      btn.innerHTML = '❚❚';
    } else {
      audio.pause();
      btn.innerHTML = '▶';
    }
  };

  audio.ontimeupdate = () => {
    const p = audio.duration ? audio.currentTime / audio.duration : 0;
    bars.forEach((b,i) => b.classList.toggle('played', i / bars.length < p));
    dur.textContent = fmt(Math.max(0, audio.duration - audio.currentTime));
  };
  audio.onended = () => { btn.innerHTML = '▶'; bars.forEach(b=>b.classList.remove('played')); dur.textContent = fmt(v.duration); };

  return wrap;
}

// Реакции
function renderReactions(container, m) {
  container.innerHTML = '';
  const entries = Object.entries(m.reactions).filter(([,c]) => c > 0);
  entries.forEach(([emoji, count]) => {
    const chip = document.createElement('button');
    chip.className = 'reaction' + (m.mine[emoji] ? ' mine' : '');
    chip.innerHTML = `<span>${emoji}</span><b>${count}</b>`;
    chip.onclick = e => { e.stopPropagation(); toggleReaction(m, emoji); };
    container.appendChild(chip);
  });
}

function toggleReaction(m, emoji) {
  if(m.mine[emoji]) {
    m.reactions[emoji]--;
    if(m.reactions[emoji] <= 0) delete m.reactions[emoji];
    delete m.mine[emoji];
  } else {
    m.reactions[emoji] = (m.reactions[emoji] || 0) + 1;
    m.mine[emoji] = true;
  }
  const box = document.querySelector(`.msg[data-id="${m.id}"] .reactions`);
  if(box) renderReactions(box, m);
}

// Контекстное меню
let ctxEl = null;
function closeContext() { if(ctxEl) { ctxEl.remove(); ctxEl = null; } }
document.addEventListener('click', closeContext);

function openContext(x, y, m) {
  closeContext();
  const menu = document.createElement('div');
  menu.className = 'ctx';

  const row = document.createElement('div');
  row.className = 'ctx-emojis';
  EMOJIS.slice(0, 7).forEach(em => {
    const b = document.createElement('button');
    b.className = 'ctx-emoji';
    b.textContent = em;
    b.onclick = e => { e.stopPropagation(); toggleReaction(m, em); closeContext(); };
    row.appendChild(b);
  });
  menu.appendChild(row);

  const del = document.createElement('button');
  del.className = 'ctx-item danger';
  del.innerHTML = '<span>🗑</span> Удалить';
  del.onclick = e => { e.stopPropagation(); deleteMessage(m.id); closeContext(); };
  menu.appendChild(del);

  document.body.appendChild(menu);
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(10, Math.min(x, window.innerWidth - r.width - 10)) + 'px';
  menu.style.top = Math.max(10, Math.min(y, window.innerHeight - r.height - 10)) + 'px';
  ctxEl = menu;
}

function attachContext(el, m) {
  el.addEventListener('contextmenu', e => { e.preventDefault(); openContext(e.clientX, e.clientY, m); });
}

// Удаление
function deleteMessage(id) {
  const chat = activeChat();
  const idx = chat.messages.findIndex(m => m.id === id);
  if(idx < 0) return;
  const el = document.querySelector(`.msg[data-id="${id}"]`);
  if(el) {
    el.style.transform = 'scale(0.8)';
    el.style.opacity = '0';
    setTimeout(() => {
      chat.messages.splice(idx, 1);
      renderMessages();
    }, 200);
  }
}

// Ввод и отправка
const input = $('#input');
const sendBtn = $('#sendBtn');

function updateComposer() {
  if(input.value.trim().length > 0) {
    sendBtn.classList.remove('mic');
    sendBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`;
  } else {
    sendBtn.classList.add('mic');
    sendBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>`;
  }
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  updateComposer();
});

input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
});

sendBtn.onclick = () => {
  if(input.value.trim()) sendText();
  else startRecording();
};

function sendText() {
  const text = input.value.trim();
  if(!text) return;
  const chat = activeChat();
  const m = { id: nid(), out: true, type: 'text', text, time: nowTime(), reactions: {}, mine: {} };
  chat.messages.push(m);
  
  // 3D-эффект вылета
  $('#messages').appendChild(messageEl(m));
  input.value = '';
  input.style.height = 'auto';
  updateComposer();
  scrollToBottom();
  
  // Обновляем превью в списке чатов
  const c = chats.find(c => c.id === activeId);
  c.status = 'Вы: ' + text;
  c.time = nowTime();
  renderChatList();
}

// Запись голосового
let mediaRecorder, chunks = [], recStart = 0, recTimerId, recStream, recSendFlag = false;

async function startRecording() {
  if(!navigator.mediaDevices?.getUserMedia) return toast('Запись недоступна');
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); } 
  catch { return toast('Нет доступа к микрофону'); }

  chunks = [];
  mediaRecorder = new MediaRecorder(recStream);
  mediaRecorder.ondataavailable = e => chunks.push(e.data);
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start();

  recStart = Date.now();
  recSendFlag = false;
  
  $('#normalPanel').hidden = true;
  $('#recPanel').hidden = false;
  $('#recTime').textContent = '0:00';

  recTimerId = setInterval(() => {
    $('#recTime').textContent = fmt((Date.now() - recStart) / 1000);
  }, 200);
}

function stopRecording(send) {
  if(!mediaRecorder) return;
  recSendFlag = send;
  mediaRecorder.stop();
  clearInterval(recTimerId);
  if(recStream) recStream.getTracks().forEach(t => t.stop());
  $('#recPanel').hidden = true;
  $('#normalPanel').hidden = false;
}

function onRecordingStop() {
  const duration = Math.max(1, Math.round((Date.now() - recStart) / 1000));
  if(!recSendFlag || !chunks.length) return;

  const blob = new Blob(chunks, { type: chunks[0].type || 'audio/webm' });
  const url = URL.createObjectURL(blob);
  
  const chat = activeChat();
  const m = { id: nid(), out: true, type: 'voice', time: nowTime(), reactions: {}, mine: {}, voice: { url, duration, bars: Array.from({length:30},()=>Math.random()*0.8+0.2) } };
  chat.messages.push(m);
  $('#messages').appendChild(messageEl(m));
  scrollToBottom();
  
  renderChatList();
}

$('#recCancel').onclick = () => stopRecording(false);
$('#recSend').onclick = () => stopRecording(true);

// Эмодзи панель
let emojiPanel = null;
function closeEmojiPanel() { if(emojiPanel) { emojiPanel.remove(); emojiPanel = null; } }

$('#emojiBtn').onclick = e => {
  e.stopPropagation();
  if(emojiPanel) return closeEmojiPanel();
  
  const r = $('#composerGlass').getBoundingClientRect();
  const panel = document.createElement('div');
  panel.className = 'emoji-panel';
  panel.style.left = '16px';
  panel.style.bottom = (window.innerHeight - r.top + 8) + 'px';
  
  EMOJIS.concat(['😀','😂','🥰','😎','🤔','🙃','😴','🤯','🥳','😭','😡','🤝','✌️','💪','🌟','✨']).forEach(em => {
    const b = document.createElement('button');
    b.textContent = em;
    b.onclick = () => {
      input.value += em;
      input.focus();
      updateComposer();
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    };
    panel.appendChild(b);
  });
  
  document.body.appendChild(panel);
  emojiPanel = panel;
};

document.addEventListener('click', e => {
  if(emojiPanel && !emojiPanel.contains(e.target) && e.target.id !== 'emojiBtn') closeEmojiPanel();
});

$('#backBtn').onclick = () => $('#app').classList.remove('chat-open');
$('#searchInput').addEventListener('input', e => renderChatList(e.target.value));

// Инициализация
renderChatList();
switchChat('anonym');
</script>
</body>
</html>
