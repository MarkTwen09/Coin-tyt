<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Аноним Нет</title>
<style>
/* ============================================================
   АНОНИМ НЕТ — Telegram-like messenger
   ============================================================ */
:root{
  --bg:#0e1621;
  --panel:#17212b;
  --panel-hover:#202b36;
  --panel-active:#2b5278;
  --search:#242f3d;
  --bubble-in:#182533;
  --bubble-out:#2b5278;
  --text:#ffffff;
  --dim:#7d8e9e;
  --accent:#64b5ef;
  --accent-solid:#3390ec;
  --border:rgba(255,255,255,.06);
  --hover:rgba(255,255,255,.05);
  --doodle:rgba(255,255,255,.045);
  --menu:rgba(28,39,51,.94);
  --reaction:rgba(100,181,239,.16);
  --danger:#e05c5c;
  --glass:rgba(23,33,43,.58);
  --glass-border:rgba(255,255,255,.10);
  --glass-shadow:0 10px 40px rgba(0,0,0,.42);
  --tick:#64b5ef;
}
body.light{
  --bg:#e3eaf0;
  --panel:#ffffff;
  --panel-hover:#f4f4f5;
  --panel-active:#3390ec;
  --search:#f1f3f5;
  --bubble-in:#ffffff;
  --bubble-out:#effdde;
  --text:#0f1419;
  --dim:#707579;
  --accent:#3390ec;
  --accent-solid:#3390ec;
  --border:rgba(0,0,0,.07);
  --hover:rgba(0,0,0,.045);
  --doodle:rgba(0,0,0,.055);
  --menu:rgba(255,255,255,.96);
  --reaction:rgba(51,144,236,.13);
  --danger:#d94848;
  --glass:rgba(255,255,255,.62);
  --glass-border:rgba(255,255,255,.85);
  --glass-shadow:0 10px 40px rgba(0,0,0,.13);
  --tick:#3390ec;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
  transition:background .3s ease,color .3s ease;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;border:none;outline:none;background:none;color:inherit}

.app{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* ===================== САЙДБАР ===================== */
.sidebar{
  width:360px;min-width:360px;background:var(--panel);display:flex;flex-direction:column;
  border-right:1px solid var(--border);transition:background .3s;
}
.sb-header{display:flex;align-items:center;gap:11px;padding:11px 14px}
.logo{
  width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(135deg,#64b5ef,#2b5278);color:#fff;
  font-weight:700;font-size:13.5px;letter-spacing:.5px;
  box-shadow:0 3px 14px rgba(100,181,239,.35);
}
.brand{flex:1;min-width:0}
.brand-name{font-weight:600;font-size:15.5px;letter-spacing:.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:12px;color:var(--dim);margin-top:1px}

.icon-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-size:17px;color:var(--dim);transition:.15s;flex:0 0 auto;
}
.icon-btn:hover{background:var(--hover);color:var(--text)}

.search-wrap{padding:2px 12px 8px}
.search{
  width:100%;background:var(--search);border-radius:11px;padding:9px 15px;font-size:14px;
  color:var(--text);transition:background .2s;
}
.search::placeholder{color:var(--dim)}

.chat-list{flex:1;overflow-y:auto;padding:2px 0 10px}
.chat-list::-webkit-scrollbar{width:6px}
.chat-list::-webkit-scrollbar-thumb{background:rgba(128,128,128,.25);border-radius:3px}

.chat-item{
  display:flex;align-items:center;gap:12px;padding:8px 14px;cursor:pointer;
  transition:background .13s;position:relative;
}
.chat-item:hover{background:var(--panel-hover)}
.chat-item.active{background:var(--panel-active);color:#fff}
.chat-item.active .ci-sub,.chat-item.active .ci-time{color:rgba(255,255,255,.72)}

.avatar{
  width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  font-weight:600;font-size:19px;color:#fff;flex:0 0 auto;user-select:none;
}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ci-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{font-size:12px;color:var(--dim);flex:0 0 auto}
.ci-bottom{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:3px}
.ci-sub{font-size:13.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{
  background:var(--accent-solid);color:#fff;border-radius:11px;font-size:12px;font-weight:600;
  padding:1px 7px;min-width:21px;text-align:center;flex:0 0 auto;
}
.chat-item.active .badge{background:#fff;color:var(--accent-solid)}

/* ===================== ЧАТ ===================== */
.chat{
  flex:1;display:flex;flex-direction:column;position:relative;min-width:0;
  background:var(--bg);overflow:hidden;transition:background .3s;
}

.chat-header{
  display:flex;align-items:center;gap:12px;padding:7px 14px;
  background:var(--panel);border-bottom:1px solid var(--border);
  z-index:6;min-height:58px;transition:background .3s;
}
.chat-header .avatar{width:44px;height:44px;font-size:17px}
.chat-title{flex:1;min-width:0}
.chat-title .name{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-title .status{font-size:12.5px;color:var(--dim);margin-top:1px}
.chat-title .status.online{color:var(--accent)}
#backBtn{display:none}

/* ---------- Область сообщений ---------- */
.msgs-wrap{position:relative;flex:1;overflow:hidden}
.doodle-bg{
  position:absolute;inset:0;width:100%;height:100%;color:var(--doodle);
  pointer-events:none;transition:color .3s;
}
.messages{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:14px 20px 110px;display:flex;flex-direction:column;gap:2px;
  scroll-behavior:smooth;overscroll-behavior:contain;touch-action:manipulation;
}
.messages::-webkit-scrollbar{width:7px}
.messages::-webkit-scrollbar-thumb{background:rgba(128,128,128,.25);border-radius:4px}
.messages::-webkit-scrollbar-track{background:transparent}

.date-chip{
  align-self:center;background:rgba(0,0,0,.25);color:#fff;
  padding:3px 13px;border-radius:13px;font-size:12.5px;font-weight:500;
  margin:8px 0 12px;backdrop-filter:blur(8px);user-select:none;
}
body.light .date-chip{background:rgba(0,0,0,.13);color:#fff}

/* ---------- Сообщения ---------- */
.msg{
  position:relative;max-width:min(75%,560px);padding:7px 11px 6px;
  border-radius:16px;background:var(--bubble-in);align-self:flex-start;
  font-size:15px;line-height:1.36;word-break:break-word;
  box-shadow:0 1px 1px rgba(0,0,0,.10);
  animation:msgIn .24s cubic-bezier(.2,.85,.3,1);
  transition:opacity .22s,transform .22s;
}
.msg.out{align-self:flex-end;background:var(--bubble-out)}
.msg.in.last{border-bottom-left-radius:5px}
.msg.out.last{border-bottom-right-radius:5px}
.msg.removing{opacity:0;transform:scale(.88);pointer-events:none}

@keyframes msgIn{
  from{opacity:0;transform:translateY(8px) scale(.96)}
  to{opacity:1;transform:none}
}

/* хвостики */
.msg.in.last::before{
  content:"";position:absolute;left:-7px;bottom:0;width:14px;height:14px;
  background:var(--bubble-in);border-bottom-right-radius:14px;
}
.msg.out.last::after{
  content:"";position:absolute;right:-7px;bottom:0;width:14px;height:14px;
  background:var(--bubble-out);border-bottom-left-radius:14px;
}

.msg .text{white-space:pre-wrap}

/* мета-строка */
.meta{
  display:flex;align-items:center;justify-content:flex-end;gap:5px;
  margin-top:3px;font-size:11.5px;line-height:1;color:var(--dim);
  user-select:none;
}
.msg.out .meta{color:rgba(255,255,255,.62)}
body.light .msg.out .meta{color:rgba(0,0,0,.42)}

.addreact{
  width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;line-height:1;color:var(--dim);margin-right:auto;
  opacity:0;transition:opacity .16s,background .15s;cursor:pointer;
}
.msg:hover .addreact{opacity:.85}
.addreact:hover{background:var(--hover)}
body.light .addreact{color:var(--dim)}

.tick{font-size:11px;letter-spacing:-2px;color:var(--tick);margin-left:1px}
.msg.out .tick{color:rgba(255,255,255,.75)}
body.light .msg.out .tick{color:var(--accent)}

/* ---------- Реакции ---------- */
.reactions{display:none;flex-wrap:wrap;gap:4px;margin-top:5px}
.reactions.has{display:flex}
.reaction{
  display:flex;align-items:center;gap:3px;background:var(--reaction);
  border-radius:12px;padding:2px 8px 2px 6px;font-size:13px;line-height:1.45;
  transition:.14s;color:var(--text);
}
.reaction b{font-weight:600;font-size:11.5px;opacity:.85}
.reaction:hover{filter:brightness(1.18)}
.reaction.mine{background:var(--accent-solid);color:#fff}
.reaction.mine b{opacity:1}

/* ---------- Голосовые ---------- */
.voice{display:flex;align-items:center;gap:10px;min-width:200px;padding:2px 0}
.play-btn{
  width:36px;height:36px;border-radius:50%;background:var(--accent-solid);color:#fff;
  display:grid;place-items:center;flex:0 0 auto;font-size:13px;
  transition:.15s;padding-left:1px;
}
.play-btn:hover{filter:brightness(1.12);transform:scale(1.05)}
.wave{display:flex;align-items:center;gap:2px;height:26px;flex:1;overflow:hidden}
.wave span{width:3px;border-radius:2px;background:var(--dim);opacity:.5;transition:background .15s,opacity .15s}
.wave span.played{background:var(--accent-solid);opacity:1}
.msg.out .wave span{background:rgba(255,255,255,.5)}
.msg.out .wave span.played{background:#fff;opacity:1}
body.light .msg.out .wave span.played{background:var(--accent-solid)}
.v-dur{font-size:11.5px;color:var(--dim);min-width:34px;text-align:right;user-select:none}
.msg.out .v-dur{color:rgba(255,255,255,.78)}
body.light .msg.out .v-dur{color:rgba(0,0,0,.45)}

/* ===================== ПЛАВАЮЩИЙ КОМПОЗЕР ===================== */
.composer-float{
  position:absolute;left:0;right:0;bottom:0;z-index:7;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.composer-pill{
  pointer-events:auto;display:flex;align-items:flex-end;gap:4px;
  padding:4px 6px 4px 4px;border-radius:26px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.07);
  transition:background .3s,border-color .3s,box-shadow .3s;
}
body.light .composer-pill{
  box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.9);
}

.cp-normal{display:flex;align-items:flex-end;gap:4px;width:100%}
.cp-recording{
  display:flex;align-items:center;gap:10px;width:100%;padding:0 2px 0 12px;min-height:42px;
}

.circle-btn{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  flex:0 0 auto;font-size:20px;color:var(--dim);transition:.15s;
}
.circle-btn:hover{background:var(--hover);color:var(--text)}
.circle-btn.accent{background:var(--accent-solid);color:#fff;transform:scale(.97)}
.circle-btn.accent:hover{filter:brightness(1.1);transform:scale(1);color:#fff}
.circle-btn.danger{color:var(--danger)}
.circle-btn.danger:hover{background:rgba(224,92,92,.13);color:var(--danger)}

#input{
  flex:1;resize:none;max-height:132px;font-size:15px;line-height:22px;
  padding:10px 2px;color:var(--text);background:none;border:none;outline:none;
  scrollbar-width:none;
}
#input::-webkit-scrollbar{display:none}
#input::placeholder{color:var(--dim)}

/* запись */
.rec-dot{width:11px;height:11px;border-radius:50%;background:var(--danger);animation:blink 1.1s infinite;flex:0 0 auto}
@keyframes blink{50%{opacity:.2}}
.rec-time{font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:600;min-width:42px}
.rec-hint{font-size:13px;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-actions{display:flex;gap:4px}

/* ===================== КОНТЕКСТНОЕ МЕНЮ ===================== */
.ctx{
  position:fixed;z-index:120;background:var(--menu);border-radius:15px;padding:6px;
  box-shadow:0 12px 44px rgba(0,0,0,.5);min-width:200px;
  animation:ctxIn .13s cubic-bezier(.2,.85,.3,1);
  border:1px solid var(--border);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
}
@keyframes ctxIn{from{opacity:0;transform:scale(.94) translateY(4px)}to{opacity:1;transform:none}}
.ctx-emojis{
  display:flex;gap:2px;padding:2px 2px 7px;
  border-bottom:1px solid var(--border);margin-bottom:5px;
}
.ctx-emoji{
  width:33px;height:33px;border-radius:50%;display:grid;place-items:center;
  font-size:18px;transition:.12s;
}
.ctx-emoji:hover{background:var(--hover);transform:scale(1.22)}
.ctx-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;
  font-size:14px;width:100%;text-align:left;transition:.12s;
}
.ctx-item:hover{background:var(--hover)}
.ctx-item.danger{color:var(--danger)}
.ctx-item .ico{width:18px;text-align:center;font-size:15px}

/* ===================== ЭМОДЗИ-ПАНЕЛЬ ===================== */
.emoji-panel{
  position:fixed;z-index:110;background:var(--menu);border-radius:16px;padding:10px;
  box-shadow:0 12px 44px rgba(0,0,0,.5);
  display:grid;grid-template-columns:repeat(8,1fr);gap:2px;
  max-width:340px;border:1px solid var(--border);
  animation:ctxIn .13s cubic-bezier(.2,.85,.3,1);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
}
.emoji-panel button{
  font-size:21px;width:36px;height:36px;border-radius:9px;transition:.1s;
  display:grid;place-items:center;
}
.emoji-panel button:hover{background:var(--hover);transform:scale(1.15)}

/* ===================== ТОСТ ===================== */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--menu);color:var(--text);padding:11px 20px;border-radius:12px;
  font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.45);opacity:0;
  transition:.26s cubic-bezier(.2,.85,.3,1);pointer-events:none;z-index:200;
  border:1px solid var(--border);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===================== АДАПТИВ ===================== */
@media(max-width:760px){
  .sidebar{width:100%;min-width:0;border-right:none}
  .app.chat-open .sidebar{display:none}
  .chat{display:none}
  .app.chat-open .chat{display:flex}
  #backBtn{display:grid}
  .msg{max-width:86%}
  .messages{padding:12px 12px 108px}
  .composer-float{padding:6px 10px calc(12px + env(safe-area-inset-bottom))}
  .emoji-panel{grid-template-columns:repeat(7,1fr);max-width:300px}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ================= САЙДБАР ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">
      <div class="logo">АН</div>
      <div class="brand">
        <div class="brand-name">Аноним Нет</div>
        <div class="brand-sub" id="brandSub">в сети</div>
      </div>
      <button class="icon-btn" id="themeBtn" title="Сменить тему">◐</button>
    </div>
    <div class="search-wrap">
      <input class="search" id="search" placeholder="Поиск">
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <!-- ================= ЧАТ ================= -->
  <main class="chat" id="chat">
    <header class="chat-header">
      <button class="icon-btn" id="backBtn">←</button>
      <div class="avatar" id="chatAvatar" style="background:linear-gradient(135deg,#64b5ef,#3d7ec4)">А</div>
      <div class="chat-title">
        <div class="name" id="chatName">Аноним</div>
        <div class="status" id="chatStatus">в сети</div>
      </div>
      <button class="icon-btn" title="Поиск">🔍</button>
      <button class="icon-btn" title="Ещё">⋮</button>
    </header>

    <div class="msgs-wrap">
      <svg class="doodle-bg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="doodlePattern" width="440" height="440" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
              <g transform="translate(10,10) scale(0.8) rotate(-10 50 50)">
                <path d="M50 82 C18 58 18 32 34 24 C43 20 50 27 50 33 C50 27 57 20 66 24 C82 32 82 58 50 82 Z"/>
              </g>
              <g transform="translate(270,20) scale(0.8) rotate(14 50 50)">
                <path d="M50 16 L60 40 L86 42 L66 58 L73 84 L50 70 L27 84 L34 58 L14 42 L40 40 Z"/>
              </g>
              <g transform="translate(140,95) scale(0.8) rotate(-22 50 50)">
                <path d="M12 50 L88 16 L60 86 L46 58 Z"/><path d="M46 58 L88 16"/>
              </g>
              <g transform="translate(320,120) scale(0.8) rotate(8 50 50)">
                <circle cx="50" cy="55" r="24"/>
                <path d="M30 38 L27 16 L46 28"/><path d="M70 38 L73 16 L54 28"/>
                <path d="M22 52 h-9 M22 60 h-9 M78 52 h9 M78 60 h9"/>
                <circle cx="42" cy="52" r="2.4" fill="currentColor" stroke="none"/>
                <circle cx="58" cy="52" r="2.4" fill="currentColor" stroke="none"/>
                <path d="M50 60 l-4 5 h8 z"/>
              </g>
              <g transform="translate(20,180) scale(0.8) rotate(-12 50 50)">
                <path d="M40 70 V26 L70 20 V58"/>
                <circle cx="32" cy="70" r="9"/><circle cx="62" cy="58" r="9"/>
              </g>
              <g transform="translate(190,240) scale(0.8)">
                <circle cx="50" cy="50" r="32"/>
                <circle cx="39" cy="42" r="2.6" fill="currentColor" stroke="none"/>
                <circle cx="61" cy="42" r="2.6" fill="currentColor" stroke="none"/>
                <path d="M34 58 Q50 72 66 58"/>
              </g>
              <g transform="translate(340,285) scale(0.8) rotate(10 50 50)">
                <path d="M56 10 L26 54 L46 54 L38 90 L70 42 L50 42 Z"/>
              </g>
              <g transform="translate(60,325) scale(0.8)">
                <path d="M26 70 h48"/>
                <path d="M32 70 a12 12 0 0 1 0 -24 a16 16 0 0 1 30 -6 a12 12 0 0 1 10 30 z"/>
              </g>
              <g transform="translate(240,345) scale(0.8) rotate(-8 50 50)">
                <rect x="18" y="30" width="64" height="44" rx="7"/>
                <path d="M21 35 L50 56 L79 35"/>
              </g>
            </g>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#doodlePattern)"/>
      </svg>

      <div class="messages" id="messages"></div>

      <!-- ===== Плавающий композер ===== -->
      <div class="composer-float" id="composerFloat">
        <div class="composer-pill" id="composerPill">
          <div class="cp-normal" id="cpNormal">
            <button class="circle-btn" id="emojiBtn" title="Эмодзи">😊</button>
            <textarea id="input" rows="1" placeholder="Сообщение"></textarea>
            <button class="circle-btn accent" id="sendBtn" title="Отправить"></button>
          </div>
          <div class="cp-recording" id="cpRecording" hidden>
            <span class="rec-dot"></span>
            <span class="rec-time" id="recTime">0:00</span>
            <span class="rec-hint">Идёт запись…</span>
            <div class="rec-actions">
              <button class="circle-btn danger" id="recCancel" title="Отмена">✕</button>
              <button class="circle-btn accent" id="recSend" title="Отправить">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
                  <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   АНОНИМ НЕТ — логика
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ---------- Утилиты ---------- */
let _uid = 1;
const nid = () => 'm' + (_uid++);
const nowTime = () => {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};
const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
const escapeHtml = s => String(s).replace(/[&<>"']/g, ch =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function toast(text){
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2000);
}

const EMOJIS = ['👍','❤️','🔥','😂','😮','😢','🎉','👏','🤔','💩','😍','🥰','😎','🤯','🙏','💯'];
const randomBars = (n = 34) =>
  Array.from({length:n}, () => 0.16 + Math.random()*0.84);

const ICON_MIC = `<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
  <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>`;
const ICON_SEND = `<svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor">
  <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>`;

/* ---------- Данные ---------- */
const chats = [
  {
    id:'anonym', name:'Аноним', avatar:'А',
    color:'linear-gradient(135deg,#64b5ef,#3d7ec4)',
    status:'в сети', online:true, unread:0,
    messages:[
      {id:nid(), out:false, type:'text', time:'11:58', reactions:{}, mine:{},
       text:'Привет 👋 Это Аноним Нет — приватный мессенджер.'},
      {id:nid(), out:false, type:'text', time:'11:59', reactions:{'🔥':3}, mine:{},
       text:'Тут есть реакции, удаление сообщений и голосовые 🎤\nДвойной клик по сообщению ставит ❤️'},
      {id:nid(), out:true, type:'text', time:'12:01', reactions:{}, mine:{},
       text:'Круто! А реакции правда можно убирать?'},
      {id:nid(), out:false, type:'text', time:'12:02', reactions:{'👍':2}, mine:{},
       text:'Да — нажми на реакцию ещё раз, и она исчезнет.'}
    ]
  },
  {
    id:'secret', name:'Секретный чат', avatar:'🔒',
    color:'linear-gradient(135deg,#8b7be8,#5b4bc4)',
    status:'был(а) недавно', online:false, unread:2,
    messages:[
      {id:nid(), out:false, type:'text', time:'10:12', reactions:{}, mine:{},
       text:'Этот чат шифруется 🛡️'},
      {id:nid(), out:false, type:'voice', time:'10:13', reactions:{'❤️':1}, mine:{},
       voice:{url:null, duration:6, bars:randomBars()}}
    ]
  },
  {
    id:'team', name:'Команда 2.0', avatar:'2',
    color:'linear-gradient(135deg,#ef8a80,#d3544a)',
    status:'12 участников', online:false, unread:0,
    messages:[
      {id:nid(), out:false, type:'text', time:'09:30', reactions:{'👍':5,'🎉':2}, mine:{},
       text:'Собираем релиз в пятницу 🚀'},
      {id:nid(), out:true, type:'text', time:'09:31', reactions:{}, mine:{},
       text:'Принято!'}
    ]
  }
];

let activeId = 'anonym';
const activeChat = () => chats.find(c => c.id === activeId);

/* ---------- Список чатов ---------- */
function lastPreview(chat){
  const m = chat.messages[chat.messages.length - 1];
  if(!m) return 'Нет сообщений';
  if(m.type === 'voice') return '🎤 Голосовое сообщение';
  return (m.out ? 'Вы: ' : '') + m.text;
}
function lastTime(chat){
  const m = chat.messages[chat.messages.length - 1];
  return m ? m.time : '';
}

function renderChatList(filter = ''){
  const list = $('#chatList');
  list.innerHTML = '';
  chats
    .filter(c => c.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach(c => {
      const el = document.createElement('div');
      el.className = 'chat-item' + (c.id === activeId ? ' active' : '');
      el.innerHTML = `
        <div class="avatar" style="background:${c.color}">${c.avatar}</div>
        <div class="ci-body">
          <div class="ci-top">
            <div class="ci-name">${escapeHtml(c.name)}</div>
            <div class="ci-time">${lastTime(c)}</div>
          </div>
          <div class="ci-bottom">
            <div class="ci-sub">${escapeHtml(lastPreview(c))}</div>
            ${c.unread ? `<div class="badge">${c.unread}</div>` : ''}
          </div>
        </div>`;
      el.onclick = () => switchChat(c.id);
      list.appendChild(el);
    });
}

/* ---------- Переключение чата ---------- */
function switchChat(id){
  activeId = id;
  const c = activeChat();
  c.unread = 0;

  $('#chatName').textContent = c.name;
  $('#chatStatus').textContent = c.status;
  $('#chatStatus').classList.toggle('online', !!c.online);

  const av = $('#chatAvatar');
  av.textContent = c.avatar;
  av.style.background = c.color;

  renderMessages();
  renderChatList($('#search').value);
  $('#app').classList.add('chat-open');
  closeEmojiPanel();
  closeContext();
}

/* ---------- Рендер сообщений ---------- */
function renderMessages(){
  const box = $('#messages');
  box.innerHTML = '';
  const msgs = activeChat().messages;

  if(msgs.length){
    const chip = document.createElement('div');
    chip.className = 'date-chip';
    chip.textContent = 'Сегодня';
    box.appendChild(chip);
  }

  msgs.forEach((m, i) => {
    const next = msgs[i+1];
    const isLast = !next || next.out !== m.out;
    box.appendChild(messageEl(m, isLast));
  });

  scrollToBottom(true);
}

function scrollToBottom(instant){
  const box = $('#messages');
  requestAnimationFrame(() => {
    box.scrollTo({top: box.scrollHeight, behavior: instant ? 'auto' : 'smooth'});
  });
}

function messageEl(m, isLast){
  const el = document.createElement('div');
  el.className = 'msg ' + (m.out ? 'out' : 'in') + (isLast ? ' last' : '');
  el.dataset.id = m.id;

  if(m.type === 'text'){
    const t = document.createElement('div');
    t.className = 'text';
    t.textContent = m.text;
    el.appendChild(t);
  } else {
    el.appendChild(voiceEl(m));
  }

  /* мета */
  const meta = document.createElement('div');
  meta.className = 'meta';

  const add = document.createElement('button');
  add.className = 'addreact';
  add.textContent = '＋';
  add.title = 'Реакция';
  add.onclick = e => {
    e.stopPropagation();
    const r = add.getBoundingClientRect();
    openContext(r.left, r.top - 40, m);
  };
  meta.appendChild(add);

  meta.insertAdjacentHTML('beforeend',
    `<span>${m.time}</span>` + (m.out ? `<span class="tick">✓✓</span>` : ''));
  el.appendChild(meta);

  /* реакции */
  const react = document.createElement('div');
  react.className = 'reactions';
  el.appendChild(react);
  renderReactions(react, m);

  attachContext(el, m);

  el.addEventListener('dblclick', e => {
    if(window.getSelection().toString()) return;
    e.preventDefault();
    toggleReaction(m, '❤️');
  });

  return el;
}

/* ---------- Голосовое ---------- */
let currentAudio = null, currentBtn = null;

function voiceEl(m){
  const v = m.voice;
  const wrap = document.createElement('div');
  wrap.className = 'voice';

  const btn = document.createElement('button');
  btn.className = 'play-btn';
  btn.innerHTML = '▶';
  wrap.appendChild(btn);

  const wave = document.createElement('div');
  wave.className = 'wave';
  v.bars.forEach(h => {
    const b = document.createElement('span');
    b.style.height = Math.round(h * 100) + '%';
    wave.appendChild(b);
  });
  wrap.appendChild(wave);

  const dur = document.createElement('span');
  dur.className = 'v-dur';
  dur.textContent = fmt(v.duration);
  wrap.appendChild(dur);

  const bars = [...wave.children];

  if(!v.url){
    btn.onclick = e => { e.stopPropagation(); toast('Демо-голосовое (без аудио)'); };
    return wrap;
  }

  const audio = new Audio(v.url);
  const reset = () => {
    btn.innerHTML = '▶';
    dur.textContent = fmt(v.duration);
    bars.forEach(b => b.classList.remove('played'));
  };

  btn.onclick = e => {
    e.stopPropagation();
    if(audio.paused){
      if(currentAudio && currentAudio !== audio) currentAudio.pause();
      if(currentBtn && currentBtn !== btn) currentBtn.innerHTML = '▶';
      audio.play();
      btn.innerHTML = '❚❚';
      currentAudio = audio;
      currentBtn = btn;
    } else {
      audio.pause();
      btn.innerHTML = '▶';
    }
  };

  audio.ontimeupdate = () => {
    const p = audio.duration ? audio.currentTime / audio.duration : 0;
    bars.forEach((b,i) => b.classList.toggle('played', i / bars.length < p));
    if(!audio.paused) dur.textContent = fmt(Math.max(0, audio.duration - audio.currentTime));
  };
  audio.onended = reset;

  return wrap;
}

/* ---------- Реакции ---------- */
function renderReactions(container, m){
  container.innerHTML = '';
  const entries = Object.entries(m.reactions).filter(([,c]) => c > 0);
  container.classList.toggle('has', entries.length > 0);
  entries.forEach(([emoji, count]) => {
    const chip = document.createElement('button');
    chip.className = 'reaction' + (m.mine[emoji] ? ' mine' : '');
    chip.innerHTML = `<span>${emoji}</span><b>${count}</b>`;
    chip.title = m.mine[emoji] ? 'Убрать реакцию' : 'Поставить реакцию';
    chip.onclick = e => { e.stopPropagation(); toggleReaction(m, emoji); };
    container.appendChild(chip);
  });
}

function toggleReaction(m, emoji){
  if(m.mine[emoji]){
    m.reactions[emoji] = (m.reactions[emoji] || 0) - 1;
    if(m.reactions[emoji] <= 0) delete m.reactions[emoji];
    delete m.mine[emoji];
  } else {
    m.reactions[emoji] = (m.reactions[emoji] || 0) + 1;
    m.mine[emoji] = true;
  }
  const box = document.querySelector(`.msg[data-id="${m.id}"] .reactions`);
  if(box) renderReactions(box, m);
}

/* ---------- Контекстное меню ---------- */
let ctxEl = null;

function closeContext(){
  if(ctxEl){ ctxEl.remove(); ctxEl = null; }
}
document.addEventListener('click', closeContext);
document.addEventListener('scroll', closeContext, true);

function openContext(x, y, m){
  closeContext();
  const menu = document.createElement('div');
  menu.className = 'ctx';

  const row = document.createElement('div');
  row.className = 'ctx-emojis';
  EMOJIS.slice(0, 8).forEach(em => {
    const b = document.createElement('button');
    b.className = 'ctx-emoji';
    b.textContent = em;
    b.onclick = e => { e.stopPropagation(); toggleReaction(m, em); closeContext(); };
    row.appendChild(b);
  });
  menu.appendChild(row);

  const copy = document.createElement('button');
  copy.className = 'ctx-item';
  copy.innerHTML = '<span class="ico">📋</span> Копировать';
  copy.onclick = e => {
    e.stopPropagation();
    const txt = m.type === 'text' ? m.text : '🎤 Голосовое сообщение';
    navigator.clipboard?.writeText(txt)
      .then(() => toast('Скопировано'))
      .catch(() => toast('Не удалось скопировать'));
    closeContext();
  };
  menu.appendChild(copy);

  const del = document.createElement('button');
  del.className = 'ctx-item danger';
  del.innerHTML = '<span class="ico">🗑</span> Удалить';
  del.onclick = e => { e.stopPropagation(); deleteMessage(m.id); closeContext(); };
  menu.appendChild(del);

  document.body.appendChild(menu);

  const r = menu.getBoundingClientRect();
  const px = Math.min(x, window.innerWidth  - r.width  - 10);
  const py = Math.min(y, window.innerHeight - r.height - 10);
  menu.style.left = Math.max(10, px) + 'px';
  menu.style.top  = Math.max(10, py) + 'px';

  ctxEl = menu;
}

function attachContext(el, m){
  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    openContext(e.clientX, e.clientY, m);
  });

  let timer = null;
  el.addEventListener('touchstart', e => {
    const t = e.touches[0];
    timer = setTimeout(() => openContext(t.clientX, t.clientY, m), 460);
  }, {passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev =>
    el.addEventListener(ev, () => clearTimeout(timer), {passive:true})
  );
}

/* ---------- Удаление ---------- */
function deleteMessage(id){
  const chat = activeChat();
  const idx = chat.messages.findIndex(m => m.id === id);
  if(idx < 0) return;

  const el = document.querySelector(`.msg[data-id="${id}"]`);
  if(el) el.classList.add('removing');

  setTimeout(() => {
    chat.messages.splice(idx, 1);
    if(el) el.remove();
    renderChatList($('#search').value);
    toast('Сообщение удалено');
  }, 210);
}

/* ---------- Отправка текста ---------- */
function sendText(){
  const input = $('#input');
  const text = input.value.trim();
  if(!text) return;

  const chat = activeChat();
  const m = {id:nid(), out:true, type:'text', text, time:nowTime(), reactions:{}, mine:{}};
  chat.messages.push(m);
  $('#messages').appendChild(messageEl(m, true));
  input.value = '';
  autoResize();
  updateComposerState();
  scrollToBottom();
  renderChatList($('#search').value);
}

function autoResize(){
  const i = $('#input');
  i.style.height = 'auto';
  i.style.height = Math.min(i.scrollHeight, 132) + 'px';
}

function updateComposerState(){
  const btn = $('#sendBtn');
  const has = $('#input').value.trim().length > 0;
  btn.innerHTML = has ? ICON_SEND : ICON_MIC;
  btn.title = has ? 'Отправить' : 'Голосовое сообщение';
  btn.classList.toggle('accent', true);
}

/* ---------- Запись голосового ---------- */
let mediaRecorder = null, chunks = [], recStart = 0, recTimerId = null, recStream = null, recSendFlag = false;

async function startRecording(){
  if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined'){
    toast('Запись недоступна в этом браузере');
    return;
  }
  try{
    recStream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(err){
    toast('Нет доступа к микрофону (нужен https или localhost)');
    return;
  }

  chunks = [];
  try{
    mediaRecorder = new MediaRecorder(recStream);
  }catch(err){
    toast('Формат записи не поддерживается');
    recStream.getTracks().forEach(t => t.stop());
    return;
  }

  mediaRecorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start();

  recStart = Date.now();
  recSendFlag = false;

  $('#cpNormal').hidden = true;
  $('#cpRecording').hidden = false;
  $('#recTime').textContent = '0:00';

  recTimerId = setInterval(() => {
    $('#recTime').textContent = fmt((Date.now() - recStart) / 1000);
  }, 200);
}

function stopRecording(send){
  if(!mediaRecorder) return;
  recSendFlag = send;
  try{ mediaRecorder.stop(); }catch(e){}
  clearInterval(recTimerId);
  if(recStream) recStream.getTracks().forEach(t => t.stop());
  $('#cpRecording').hidden = true;
  $('#cpNormal').hidden = false;
  mediaRecorder = null;
  recStream = null;
}

function onRecordingStop(){
  const duration = Math.max(1, Math.round((Date.now() - recStart) / 1000));
  if(!recSendFlag || !chunks.length) return;

  const blob = new Blob(chunks, {type: chunks[0].type || 'audio/webm'});
  const url = URL.createObjectURL(blob);

  const chat = activeChat();
  const m = {
    id:nid(), out:true, type:'voice', time:nowTime(), reactions:{}, mine:{},
    voice:{url, duration, bars: randomBars()}
  };
  chat.messages.push(m);
  $('#messages').appendChild(messageEl(m, true));
  scrollToBottom();
  renderChatList($('#search').value);
  toast('Голосовое отправлено');
}

/* ---------- Эмодзи-панель ---------- */
let emojiPanel = null;

function closeEmojiPanel(){
  if(emojiPanel){ emojiPanel.remove(); emojiPanel = null; }
}

function toggleEmojiPanel(){
  if(emojiPanel){ closeEmojiPanel(); return; }

  const pill = $('#composerPill');
  const r = pill.getBoundingClientRect();

  const panel = document.createElement('div');
  panel.className = 'emoji-panel';
  panel.style.left = Math.max(12, r.left) + 'px';
  panel.style.bottom = (window.innerHeight - r.top + 8) + 'px';

  EMOJIS.concat(['😀','😁','😂','🤣','😊','😇','🙂','😉','😍','🥳','😭','😡','🤝','✌️','💪','🌟'])
    .forEach(em => {
      const b = document.createElement('button');
      b.textContent = em;
      b.onclick = () => {
        const inp = $('#input');
        inp.value += em;
        inp.focus();
        autoResize();
        updateComposerState();
      };
      panel.appendChild(b);
    });

  document.body.appendChild(panel);
  emojiPanel = panel;
}

/* ---------- События ---------- */
$('#sendBtn').onclick = () => {
  if($('#input').value.trim()) sendText();
  else startRecording();
};

$('#input').addEventListener('input', () => { autoResize(); updateComposerState(); });
$('#input').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendText();
  }
});

$('#recCancel').onclick = () => stopRecording(false);
$('#recSend').onclick = () => stopRecording(true);

$('#emojiBtn').onclick = e => { e.stopPropagation(); toggleEmojiPanel(); };
document.addEventListener('click', e => {
  if(emojiPanel && !emojiPanel.contains(e.target) && e.target.id !== 'emojiBtn'){
    closeEmojiPanel();
  }
});

$('#search').addEventListener('input', e => renderChatList(e.target.value));

$('#themeBtn').onclick = () => {
  document.body.classList.toggle('light');
  toast(document.body.classList.contains('light') ? 'Светлая тема' : 'Тёмная тема');
};

$('#backBtn').onclick = () => $('#app').classList.remove('chat-open');

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeContext(); closeEmojiPanel(); }
});

window.addEventListener('resize', closeEmojiPanel);

/* ---------- Старт ---------- */
updateComposerState();
switchChat('anonym');
renderChatList();
setTimeout(() => toast('Двойной клик по сообщению — поставить ❤️'), 900);
</script>
