<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анонимная 2.0</title>
<style>
:root{
  --bg:#0e1621; --panel:#17212b; --panel2:#1c2733; --bubble-in:#182533; --bubble-out:#2b5278;
  --text:#ffffff; --dim:#7d8e9e; --accent:#64b5ef; --border:rgba(255,255,255,.06);
  --hover:rgba(255,255,255,.05); --doodle:rgba(255,255,255,.05); --menu:#1c2733;
  --reaction:rgba(100,181,239,.18); --danger:#e05c5c;
}
body.light{
  --bg:#e6ebee; --panel:#ffffff; --panel2:#f4f4f5; --bubble-in:#ffffff; --bubble-out:#effdde;
  --text:#0f0f0f; --dim:#707579; --accent:#3390ec; --border:rgba(0,0,0,.08);
  --hover:rgba(0,0,0,.05); --doodle:rgba(0,0,0,.07); --menu:#ffffff;
  --reaction:rgba(51,144,236,.15); --danger:#d94848;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;transition:background .25s,color .25s;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;border:none;outline:none;background:none;color:inherit}

.app{display:flex;height:100vh;height:100dvh}

/* ---------- Сайдбар ---------- */
.sidebar{
  width:340px;min-width:340px;background:var(--panel);display:flex;flex-direction:column;
  border-right:1px solid var(--border);transition:background .25s;
}
.sb-header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.logo{
  width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(135deg,#64b5ef,#2b5278);color:#fff;font-weight:700;font-size:17px;
  box-shadow:0 2px 10px rgba(100,181,239,.35);
}
.brand-name{font-weight:600;font-size:15px;letter-spacing:.2px}
.brand-sub{font-size:12px;color:var(--dim)}
.spacer{flex:1}
.icon-btn{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  font-size:17px;color:var(--dim);transition:.15s;flex:0 0 auto;
}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.search-wrap{padding:8px 12px}
.search{
  width:100%;background:var(--panel2);border-radius:10px;padding:9px 14px;font-size:14px;
  color:var(--text);transition:background .2s;
}
.search::placeholder{color:var(--dim)}

.chat-list{flex:1;overflow-y:auto;padding:4px 0}
.chat-item{
  display:flex;align-items:center;gap:11px;padding:9px 14px;cursor:pointer;transition:background .12s;
  position:relative;
}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--accent);color:#fff}
.chat-item.active .ci-sub,.chat-item.active .ci-time{color:rgba(255,255,255,.75)}
.avatar{
  width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:600;
  font-size:18px;color:#fff;flex:0 0 auto;
}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ci-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{font-size:11.5px;color:var(--dim);flex:0 0 auto}
.ci-sub{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.badge{
  background:var(--accent);color:#fff;border-radius:11px;font-size:11.5px;font-weight:600;
  padding:1px 7px;min-width:20px;text-align:center;
}
.chat-item.active .badge{background:#fff;color:var(--accent)}

/* ---------- Чат ---------- */
.chat{flex:1;display:flex;flex-direction:column;position:relative;min-width:0;background:var(--bg)}
.msgs-wrap{position:relative;flex:1;overflow:hidden}
.doodle-bg{
  position:absolute;inset:0;width:100%;height:100%;color:var(--doodle);
  pointer-events:none;transition:color .25s;
}
.messages{
  position:absolute;inset:0;overflow-y:auto;padding:18px 18px 8px;
  display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth;
}
.messages::-webkit-scrollbar{width:7px}
.messages::-webkit-scrollbar-thumb{background:rgba(128,128,128,.28);border-radius:4px}
.messages::-webkit-scrollbar-track{background:transparent}

.chat-header{
  display:flex;align-items:center;gap:11px;padding:8px 14px;background:var(--panel);
  border-bottom:1px solid var(--border);z-index:3;min-height:60px;
}
.chat-header .avatar{width:42px;height:42px;font-size:16px}
.chat-title{flex:1;min-width:0}
.chat-title .name{font-weight:600;font-size:15px}
.chat-title .status{font-size:12.5px;color:var(--dim)}
.chat-title .status.online{color:var(--accent)}
#backBtn{display:none}

/* ---------- Сообщения ---------- */
.msg{
  max-width:min(72%,520px);padding:7px 11px 8px;border-radius:14px;position:relative;
  background:var(--bubble-in);align-self:flex-start;font-size:14.5px;line-height:1.38;
  word-break:break-word;animation:pop .18s ease-out;transition:opacity .2s,transform .2s;
  box-shadow:0 1px 1px rgba(0,0,0,.1);
}
.msg.out{align-self:flex-end;background:var(--bubble-out);border-bottom-right-radius:5px}
.msg.in{border-bottom-left-radius:5px}
.msg.removing{opacity:0;transform:scale(.85);pointer-events:none}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.msg .text{white-space:pre-wrap}
.msg .meta{
  display:flex;justify-content:flex-end;align-items:center;gap:4px;
  font-size:11px;color:var(--dim);margin-top:2px;line-height:1;
}
.msg.out .meta{color:rgba(255,255,255,.6)}
body.light .msg.out .meta{color:rgba(0,0,0,.42)}
.tick{font-size:11px;color:var(--accent)}

/* Реакции */
.reactions{display:none;flex-wrap:wrap;gap:4px;margin-top:5px}
.reactions.has{display:flex}
.reaction{
  display:flex;align-items:center;gap:3px;background:var(--reaction);border-radius:11px;
  padding:2px 7px;font-size:12.5px;line-height:1.4;transition:.12s;color:var(--text);
}
.reaction b{font-weight:600;font-size:11.5px}
.reaction:hover{filter:brightness(1.18)}
.reaction.mine{background:var(--accent);color:#fff}
.reaction.mine b{color:#fff}

/* Голосовые */
.voice{display:flex;align-items:center;gap:9px;min-width:190px;padding:2px 0}
.play-btn{
  width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;flex:0 0 auto;font-size:13px;transition:.15s;
}
.play-btn:hover{filter:brightness(1.12)}
.wave{display:flex;align-items:center;gap:2px;height:26px;flex:1}
.wave span{width:3px;border-radius:2px;background:var(--dim);opacity:.55;transition:background .15s,opacity .15s}
.wave span.played{background:var(--accent);opacity:1}
.msg.out .wave span{background:rgba(255,255,255,.45)}
.msg.out .wave span.played{background:#fff}
.v-dur{font-size:11.5px;color:var(--dim);min-width:32px;text-align:right}
.msg.out .v-dur{color:rgba(255,255,255,.75)}

/* ---------- Композер ---------- */
.composer{background:var(--panel);border-top:1px solid var(--border);padding:8px 12px;z-index:3}
.composer-panel{display:flex;align-items:center;gap:9px}
.composer-panel[hidden]{display:none}
#input{
  flex:1;resize:none;max-height:130px;font-size:14.5px;line-height:1.4;
  padding:9px 4px;color:var(--text);
}
#input::placeholder{color:var(--dim)}
.send-btn{
  width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;flex:0 0 auto;transition:.15s;transform:scale(.95);
}
.send-btn:hover{filter:brightness(1.1);transform:scale(1)}
.rec-panel{justify-content:space-between;padding:4px 2px}
.rec-left{display:flex;align-items:center;gap:10px}
.rec-dot{width:11px;height:11px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rec-time{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.rec-hint{font-size:12.5px;color:var(--dim)}
.rec-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:16px;transition:.15s}
.rec-btn.cancel{color:var(--danger)}
.rec-btn.cancel:hover{background:rgba(224,92,92,.15)}
.rec-btn.send{background:var(--accent);color:#fff}
.rec-btn.send:hover{filter:brightness(1.1)}

/* ---------- Контекстное меню ---------- */
.ctx{
  position:fixed;z-index:100;background:var(--menu);border-radius:14px;padding:6px;
  box-shadow:0 8px 34px rgba(0,0,0,.45);min-width:190px;animation:ctxIn .12s ease-out;
  border:1px solid var(--border);
}
@keyframes ctxIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.ctx-emojis{display:flex;gap:2px;padding:2px 2px 7px;border-bottom:1px solid var(--border);margin-bottom:5px}
.ctx-emoji{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;transition:.12s;
}
.ctx-emoji:hover{background:var(--hover);transform:scale(1.18)}
.ctx-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:14px;
  width:100%;text-align:left;transition:.12s;
}
.ctx-item:hover{background:var(--hover)}
.ctx-item.danger{color:var(--danger)}
.ctx-item .ico{width:18px;text-align:center}

/* ---------- Тост ---------- */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--menu);color:var(--text);padding:11px 20px;border-radius:11px;
  font-size:13.5px;box-shadow:0 6px 26px rgba(0,0,0,.4);opacity:0;transition:.25s;
  pointer-events:none;z-index:200;border:1px solid var(--border);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Эмодзи-панель ---------- */
.emoji-panel{
  position:absolute;bottom:70px;left:12px;background:var(--menu);border-radius:14px;padding:10px;
  box-shadow:0 8px 34px rgba(0,0,0,.45);display:grid;grid-template-columns:repeat(8,1fr);gap:3px;
  z-index:20;max-width:330px;border:1px solid var(--border);animation:ctxIn .12s ease-out;
}
.emoji-panel button{font-size:20px;width:34px;height:34px;border-radius:8px;transition:.1s}
.emoji-panel button:hover{background:var(--hover);transform:scale(1.15)}

@media(max-width:760px){
  .sidebar{width:100%;min-width:0}
  .app.chat-open .sidebar{display:none}
  .chat{display:none}
  .app.chat-open .chat{display:flex}
  #backBtn{display:grid}
  .msg{max-width:86%}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ============ САЙДБАР ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">
      <div class="logo">А</div>
      <div>
        <div class="brand-name">Анонимная 2.0</div>
        <div class="brand-sub" id="brandSub">в сети</div>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn" title="Сменить тему">◐</button>
    </div>
    <div class="search-wrap">
      <input class="search" id="search" placeholder="Поиск">
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <!-- ============ ЧАТ ============ -->
  <main class="chat" id="chat">
    <header class="chat-header">
      <button class="icon-btn" id="backBtn">←</button>
      <div class="avatar" id="chatAvatar" style="background:#64b5ef">А</div>
      <div class="chat-title">
        <div class="name" id="chatName">Аноним</div>
        <div class="status" id="chatStatus">в сети</div>
      </div>
      <button class="icon-btn" title="Поиск">🔍</button>
      <button class="icon-btn" title="Ещё">⋮</button>
    </header>

    <div class="msgs-wrap">
      <svg class="doodle-bg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="doodlePattern" width="420" height="420" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
              <!-- сердце -->
              <g transform="translate(10,10) scale(0.8) rotate(-10 50 50)">
                <path d="M50 82 C18 58 18 32 34 24 C43 20 50 27 50 33 C50 27 57 20 66 24 C82 32 82 58 50 82 Z"/>
              </g>
              <!-- звезда -->
              <g transform="translate(250,20) scale(0.8) rotate(14 50 50)">
                <path d="M50 16 L60 40 L86 42 L66 58 L73 84 L50 70 L27 84 L34 58 L14 42 L40 40 Z"/>
              </g>
              <!-- бумажный самолётик -->
              <g transform="translate(130,90) scale(0.8) rotate(-22 50 50)">
                <path d="M12 50 L88 16 L60 86 L46 58 Z"/>
                <path d="M46 58 L88 16"/>
              </g>
              <!-- котик -->
              <g transform="translate(300,110) scale(0.8) rotate(8 50 50)">
                <circle cx="50" cy="55" r="24"/>
                <path d="M30 38 L27 16 L46 28"/>
                <path d="M70 38 L73 16 L54 28"/>
                <path d="M22 52 h-9 M22 60 h-9 M78 52 h9 M78 60 h9"/>
                <circle cx="42" cy="52" r="2.4" fill="currentColor" stroke="none"/>
                <circle cx="58" cy="52" r="2.4" fill="currentColor" stroke="none"/>
                <path d="M50 60 l-4 5 h8 z"/>
              </g>
              <!-- нотка -->
              <g transform="translate(20,170) scale(0.8) rotate(-12 50 50)">
                <path d="M40 70 V26 L70 20 V58"/>
                <circle cx="32" cy="70" r="9"/>
                <circle cx="62" cy="58" r="9"/>
              </g>
              <!-- смайлик -->
              <g transform="translate(180,230) scale(0.8)">
                <circle cx="50" cy="50" r="32"/>
                <circle cx="39" cy="42" r="2.6" fill="currentColor" stroke="none"/>
                <circle cx="61" cy="42" r="2.6" fill="currentColor" stroke="none"/>
                <path d="M34 58 Q50 72 66 58"/>
              </g>
              <!-- молния -->
              <g transform="translate(320,270) scale(0.8) rotate(10 50 50)">
                <path d="M56 10 L26 54 L46 54 L38 90 L70 42 L50 42 Z"/>
              </g>
              <!-- облако -->
              <g transform="translate(60,310) scale(0.8)">
                <path d="M26 70 h48"/>
                <path d="M32 70 a12 12 0 0 1 0 -24 a16 16 0 0 1 30 -6 a12 12 0 0 1 10 30 z"/>
              </g>
              <!-- конверт -->
              <g transform="translate(230,330) scale(0.8) rotate(-8 50 50)">
                <rect x="18" y="30" width="64" height="44" rx="7"/>
                <path d="M21 35 L50 56 L79 35"/>
              </g>
            </g>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#doodlePattern)"/>
      </svg>
      <div class="messages" id="messages"></div>
    </div>

    <div class="composer">
      <!-- обычный режим -->
      <div class="composer-panel" id="normalPanel">
        <button class="icon-btn" id="emojiBtn" title="Эмодзи">😊</button>
        <textarea id="input" rows="1" placeholder="Написать сообщение..."></textarea>
        <button class="icon-btn" id="micBtn" title="Голосовое сообщение">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor">
            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
          </svg>
        </button>
        <button class="send-btn" id="sendBtn" title="Отправить">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
          </svg>
        </button>
      </div>

      <!-- режим записи -->
      <div class="composer-panel rec-panel" id="recPanel" hidden>
        <div class="rec-left">
          <span class="rec-dot"></span>
          <span class="rec-time" id="recTime">0:00</span>
          <span class="rec-hint">Идёт запись…</span>
        </div>
        <div style="display:flex;gap:8px">
          <button class="rec-btn cancel" id="recCancel">✕</button>
          <button class="rec-btn send" id="recSend">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   АНОНИМНАЯ 2.0 — фронтенд-прототип мессенджера
   ========================================================= */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ---------- Утилиты ---------- */
let _uid = 1;
const nid = () => 'm' + (_uid++);
const nowTime = () => {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};
const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

function toast(text){
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 1900);
}

const EMOJIS = ['👍','❤️','🔥','😂','😮','😢','🎉','👏','🤔','💩','😍','🥰','😎','🤯','🙏','💯'];
const randomBars = (n = 32) =>
  Array.from({length:n}, () => 0.18 + Math.random()*0.82);

/* ---------- Состояние ---------- */
const chats = [
  {
    id:'anonym', name:'Аноним', avatar:'А', color:'#64b5ef', status:'в сети', online:true, unread:0,
    messages:[
      {id:nid(), out:false, type:'text', text:'Привет 👋 Добро пожаловать в Анонимную 2.0', time:'11:58', reactions:{}, mine:{}},
      {id:nid(), out:false, type:'text', text:'Тут можно писать, удалять сообщения, ставить реакции и записывать голосовые 🎤', time:'11:59', reactions:{'🔥':3}, mine:{}},
      {id:nid(), out:true,  type:'text', text:'Круто! А реакции правда можно убирать?', time:'12:01', reactions:{}, mine:{}}
    ]
  },
  {
    id:'secret', name:'Секретный чат', avatar:'🔒', color:'#7d68d8', status:'был(а) недавно', online:false, unread:2,
    messages:[
      {id:nid(), out:false, type:'text', text:'Этот чат шифруется 🛡️', time:'10:12', reactions:{}, mine:{}},
      {id:nid(), out:false, type:'voice', time:'10:13', reactions:{'❤️':1}, mine:{},
       voice:{url:null, duration:6, bars:randomBars()}}
    ]
  },
  {
    id:'team', name:'Команда 2.0', avatar:'2', color:'#e17076', status:'12 участников', online:false, unread:0,
    messages:[
      {id:nid(), out:false, type:'text', text:'Собираем релиз в пятницу 🚀', time:'09:30', reactions:{'👍':5,'🎉':2}, mine:{}},
      {id:nid(), out:true,  type:'text', text:'Принято!', time:'09:31', reactions:{}, mine:{}}
    ]
  }
];

let activeId = 'anonym';
const activeChat = () => chats.find(c => c.id === activeId);

/* ---------- Рендер списка чатов ---------- */
function lastPreview(chat){
  const m = chat.messages[chat.messages.length - 1];
  if(!m) return 'Нет сообщений';
  if(m.type === 'voice') return '🎤 Голосовое сообщение';
  return (m.out ? 'Вы: ' : '') + m.text;
}
function lastTime(chat){
  const m = chat.messages[chat.messages.length - 1];
  return m ? m.time : '';
}

function renderChatList(filter = ''){
  const list = $('#chatList');
  list.innerHTML = '';
  chats
    .filter(c => c.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach(c => {
      const el = document.createElement('div');
      el.className = 'chat-item' + (c.id === activeId ? ' active' : '');
      el.innerHTML = `
        <div class="avatar" style="background:${c.color}">${c.avatar}</div>
        <div class="ci-body">
          <div class="ci-top">
            <div class="ci-name">${c.name}</div>
            <div class="ci-time">${lastTime(c)}</div>
          </div>
          <div class="ci-top" style="margin-top:2px">
            <div class="ci-sub">${escapeHtml(lastPreview(c))}</div>
            ${c.unread ? `<div class="badge">${c.unread}</div>` : ''}
          </div>
        </div>`;
      el.onclick = () => switchChat(c.id);
      list.appendChild(el);
    });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

/* ---------- Переключение чата ---------- */
function switchChat(id){
  activeId = id;
  const c = activeChat();
  c.unread = 0;
  $('#chatName').textContent = c.name;
  $('#chatStatus').textContent = c.status;
  $('#chatStatus').classList.toggle('online', !!c.online);
  const av = $('#chatAvatar');
  av.textContent = c.avatar;
  av.style.background = c.color;

  renderMessages();
  renderChatList($('#search').value);
  $('#app').classList.add('chat-open');
  closeEmojiPanel();
}

/* ---------- Рендер сообщений ---------- */
function renderMessages(){
  const box = $('#messages');
  box.innerHTML = '';
  activeChat().messages.forEach(m => box.appendChild(messageEl(m)));
  scrollToBottom(true);
}

function scrollToBottom(instant){
  const box = $('#messages');
  requestAnimationFrame(() => {
    box.scrollTo({top: box.scrollHeight, behavior: instant ? 'auto' : 'smooth'});
  });
}

function messageEl(m){
  const el = document.createElement('div');
  el.className = 'msg ' + (m.out ? 'out' : 'in');
  el.dataset.id = m.id;

  if(m.type === 'text'){
    const t = document.createElement('div');
    t.className = 'text';
    t.textContent = m.text;
    el.appendChild(t);
  } else {
    el.appendChild(voiceEl(m));
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<span>${m.time}</span>` + (m.out ? `<span class="tick">✓✓</span>` : '');
  el.appendChild(meta);

  const react = document.createElement('div');
  react.className = 'reactions';
  el.appendChild(react);
  renderReactions(react, m);

  attachContext(el, m);
  return el;
}

/* ---------- Голосовое сообщение ---------- */
let currentAudio = null, currentBtn = null;

function voiceEl(m){
  const v = m.voice;
  const wrap = document.createElement('div');
  wrap.className = 'voice';

  const btn = document.createElement('button');
  btn.className = 'play-btn';
  btn.innerHTML = '▶';
  wrap.appendChild(btn);

  const wave = document.createElement('div');
  wave.className = 'wave';
  v.bars.forEach(h => {
    const b = document.createElement('span');
    b.style.height = Math.round(h * 100) + '%';
    wave.appendChild(b);
  });
  wrap.appendChild(wave);

  const dur = document.createElement('span');
  dur.className = 'v-dur';
  dur.textContent = fmt(v.duration);
  wrap.appendChild(dur);

  const bars = [...wave.children];

  if(!v.url){
    btn.onclick = e => { e.stopPropagation(); toast('Демо-голосовое (без аудио)'); };
    return wrap;
  }

  const audio = new Audio(v.url);
  const reset = () => {
    btn.innerHTML = '▶';
    dur.textContent = fmt(v.duration);
    bars.forEach(b => b.classList.remove('played'));
  };

  btn.onclick = e => {
    e.stopPropagation();
    if(audio.paused){
      if(currentAudio && currentAudio !== audio){ currentAudio.pause(); }
      if(currentBtn && currentBtn !== btn) currentBtn.innerHTML = '▶';
      audio.play();
      btn.innerHTML = '❚❚';
      currentAudio = audio;
      currentBtn = btn;
    } else {
      audio.pause();
      btn.innerHTML = '▶';
    }
  };

  audio.ontimeupdate = () => {
    const p = audio.duration ? audio.currentTime / audio.duration : 0;
    bars.forEach((b,i) => b.classList.toggle('played', i / bars.length < p));
    if(!audio.paused) dur.textContent = fmt(Math.max(0, audio.duration - audio.currentTime));
  };
  audio.onended = reset;

  return wrap;
}

/* ---------- Реакции ---------- */
function renderReactions(container, m){
  container.innerHTML = '';
  const entries = Object.entries(m.reactions).filter(([,c]) => c > 0);
  container.classList.toggle('has', entries.length > 0);
  entries.forEach(([emoji, count]) => {
    const chip = document.createElement('button');
    chip.className = 'reaction' + (m.mine[emoji] ? ' mine' : '');
    chip.innerHTML = `<span>${emoji}</span><b>${count}</b>`;
    chip.title = m.mine[emoji] ? 'Убрать реакцию' : 'Поставить реакцию';
    chip.onclick = e => { e.stopPropagation(); toggleReaction(m, emoji); };
    container.appendChild(chip);
  });
}

function toggleReaction(m, emoji){
  if(m.mine[emoji]){
    m.reactions[emoji] = (m.reactions[emoji] || 0) - 1;
    if(m.reactions[emoji] <= 0) delete m.reactions[emoji];
    delete m.mine[emoji];
  } else {
    m.reactions[emoji] = (m.reactions[emoji] || 0) + 1;
    m.mine[emoji] = true;
  }
  const box = document.querySelector(`.msg[data-id="${m.id}"] .reactions`);
  if(box) renderReactions(box, m);
}

/* ---------- Контекстное меню ---------- */
let ctxEl = null;

function closeContext(){
  if(ctxEl){ ctxEl.remove(); ctxEl = null; }
}
document.addEventListener('click', closeContext);
document.addEventListener('scroll', closeContext, true);

function openContext(x, y, m){
  closeContext();
  const menu = document.createElement('div');
  menu.className = 'ctx';

  const row = document.createElement('div');
  row.className = 'ctx-emojis';
  EMOJIS.slice(0, 8).forEach(em => {
    const b = document.createElement('button');
    b.className = 'ctx-emoji';
    b.textContent = em;
    b.onclick = e => { e.stopPropagation(); toggleReaction(m, em); closeContext(); };
    row.appendChild(b);
  });
  menu.appendChild(row);

  const copy = document.createElement('button');
  copy.className = 'ctx-item';
  copy.innerHTML = '<span class="ico">📋</span> Копировать';
  copy.onclick = e => {
    e.stopPropagation();
    const txt = m.type === 'text' ? m.text : '🎤 Голосовое сообщение';
    navigator.clipboard?.writeText(txt).then(() => toast('Скопировано')).catch(() => toast('Не удалось скопировать'));
    closeContext();
  };
  menu.appendChild(copy);

  const del = document.createElement('button');
  del.className = 'ctx-item danger';
  del.innerHTML = '<span class="ico">🗑</span> Удалить';
  del.onclick = e => { e.stopPropagation(); deleteMessage(m.id); closeContext(); };
  menu.appendChild(del);

  document.body.appendChild(menu);

  const r = menu.getBoundingClientRect();
  const px = Math.min(x, window.innerWidth  - r.width  - 8);
  const py = Math.min(y, window.innerHeight - r.height - 8);
  menu.style.left = Math.max(8, px) + 'px';
  menu.style.top  = Math.max(8, py) + 'px';

  ctxEl = menu;
}

function attachContext(el, m){
  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    openContext(e.clientX, e.clientY, m);
  });

  // долгое нажатие (мобильные)
  let timer = null;
  el.addEventListener('touchstart', e => {
    const t = e.touches[0];
    timer = setTimeout(() => openContext(t.clientX, t.clientY, m), 480);
  }, {passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev =>
    el.addEventListener(ev, () => clearTimeout(timer), {passive:true})
  );
}

/* ---------- Удаление сообщения ---------- */
function deleteMessage(id){
  const chat = activeChat();
  const idx = chat.messages.findIndex(m => m.id === id);
  if(idx < 0) return;
  const el = document.querySelector(`.msg[data-id="${id}"]`);
  if(el) el.classList.add('removing');
  setTimeout(() => {
    chat.messages.splice(idx, 1);
    if(el) el.remove();
    renderChatList($('#search').value);
    toast('Сообщение удалено');
  }, 190);
}

/* ---------- Отправка текста ---------- */
function sendText(){
  const input = $('#input');
  const text = input.value.trim();
  if(!text) return;
  const chat = activeChat();
  const m = {id:nid(), out:true, type:'text', text, time:nowTime(), reactions:{}, mine:{}};
  chat.messages.push(m);
  $('#messages').appendChild(messageEl(m));
  input.value = '';
  autoResize();
  scrollToBottom();
  renderChatList($('#search').value);
}

function autoResize(){
  const i = $('#input');
  i.style.height = 'auto';
  i.style.height = Math.min(i.scrollHeight, 130) + 'px';
}

/* ---------- Запись голосового ---------- */
let mediaRecorder = null, chunks = [], recStart = 0, recTimerId = null, recStream = null, recSendFlag = false;

async function startRecording(){
  if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined'){
    toast('Запись недоступна в этом браузере');
    return;
  }
  try{
    recStream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(err){
    toast('Нет доступа к микрофону (нужен https или localhost)');
    return;
  }

  chunks = [];
  try{
    mediaRecorder = new MediaRecorder(recStream);
  }catch(err){
    toast('Формат записи не поддерживается');
    recStream.getTracks().forEach(t => t.stop());
    return;
  }

  mediaRecorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start();

  recStart = Date.now();
  recSendFlag = false;

  $('#normalPanel').hidden = true;
  $('#recPanel').hidden = false;
  $('#recTime').textContent = '0:00';

  recTimerId = setInterval(() => {
    $('#recTime').textContent = fmt((Date.now() - recStart) / 1000);
  }, 200);
}

function stopRecording(send){
  if(!mediaRecorder) return;
  recSendFlag = send;
  try{ mediaRecorder.stop(); }catch(e){}
  clearInterval(recTimerId);
  if(recStream) recStream.getTracks().forEach(t => t.stop());
  $('#recPanel').hidden = true;
  $('#normalPanel').hidden = false;
  mediaRecorder = null;
  recStream = null;
}

function onRecordingStop(){
  const duration = Math.max(1, Math.round((Date.now() - recStart) / 1000));
  if(!recSendFlag || !chunks.length) return;

  const blob = new Blob(chunks, {type: chunks[0].type || 'audio/webm'});
  const url = URL.createObjectURL(blob);

  const chat = activeChat();
  const m = {
    id:nid(), out:true, type:'voice', time:nowTime(), reactions:{}, mine:{},
    voice:{url, duration, bars: randomBars()}
  };
  chat.messages.push(m);
  $('#messages').appendChild(messageEl(m));
  scrollToBottom();
  renderChatList($('#search').value);
  toast('Голосовое отправлено');
}

/* ---------- Панель эмодзи ---------- */
let emojiPanel = null;
function closeEmojiPanel(){
  if(emojiPanel){ emojiPanel.remove(); emojiPanel = null; }
}
function toggleEmojiPanel(){
  if(emojiPanel){ closeEmojiPanel(); return; }
  const panel = document.createElement('div');
  panel.className = 'emoji-panel';
  EMOJIS.concat(['😀','😁','😂','🤣','😊','😇','🙂','😉','😍','🥳','😭','😡','🤝','✌️','💪','🌟'])
    .forEach(em => {
      const b = document.createElement('button');
      b.textContent = em;
      b.onclick = () => {
        const inp = $('#input');
        inp.value += em;
        inp.focus();
        autoResize();
      };
      panel.appendChild(b);
    });
  $('.composer').appendChild(panel);
  emojiPanel = panel;
}

/* ---------- События ---------- */
$('#sendBtn').onclick = sendText;

$('#input').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendText();
  }
});
$('#input').addEventListener('input', autoResize);

$('#micBtn').onclick = startRecording;
$('#recCancel').onclick = () => stopRecording(false);
$('#recSend').onclick = () => stopRecording(true);

$('#emojiBtn').onclick = e => { e.stopPropagation(); toggleEmojiPanel(); };
document.addEventListener('click', e => {
  if(emojiPanel && !emojiPanel.contains(e.target) && e.target.id !== 'emojiBtn') closeEmojiPanel();
});

$('#search').addEventListener('input', e => renderChatList(e.target.value));

$('#themeBtn').onclick = () => document.body.classList.toggle('light');

$('#backBtn').onclick = () => $('#app').classList.remove('chat-open');

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeContext(); closeEmojiPanel(); }
});

/* ---------- Старт ---------- */
switchChat('anonym');
renderChatList();
setTimeout(() => { $('#chatStatus').textContent = 'в сети'; }, 800);
</script>
