<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shirma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --bg-elevated: #ffffff;
      --bg-subtle: #f3f3f3;
      --text: #111111;
      --text-secondary: #555555;
      --text-muted: #888888;
      --accent: #b08d57;
      --accent-soft: rgba(176, 141, 87, 0.12);
      --border: #e8e8e8;
      --border-strong: #d0d0d0;
      --header: #0c0c0c;
      --danger: #c0392b;
      --radius: 6px;
      --radius-lg: 12px;
      --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
      --max: 1180px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --serif: 'Instrument Serif', Georgia, serif;
      --transition: 0.2s ease;
    }

    [data-theme="dark"] {
      --bg: #0f0f0f;
      --bg-elevated: #1a1a1a;
      --bg-subtle: #242424;
      --text: #f0f0f0;
      --text-secondary: #b0b0b0;
      --text-muted: #777777;
      --border: #2a2a2a;
      --border-strong: #3a3a3a;
      --header: #000000;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 4px 16px rgba(0,0,0,0.2);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.35);
      --accent-soft: rgba(176, 141, 87, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font-family: inherit; }

    .header {
      background: var(--header);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .header-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 28px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .logo {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 400;
      letter-spacing: -0.3px;
      color: var(--accent);
      transition: opacity var(--transition);
    }
    .logo:hover { opacity: 0.8; }

    .nav {
      display: flex;
      gap: 28px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .nav a {
      color: rgba(255,255,255,0.55);
      transition: color var(--transition);
      position: relative;
    }
    .nav a:hover, .nav a.active { color: #fff; }
    .nav a.active::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .icon-btn:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 18px;
      border: none;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .btn-accent {
      background: var(--accent);
      color: #111;
    }
    .btn-accent:hover { filter: brightness(1.08); }
    .btn-ghost {
      background: transparent;
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-ghost:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.3);
    }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border-strong);
    }
    .btn-outline:hover { background: var(--bg-subtle); }
    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .btn-danger:hover { filter: brightness(1.1); }
    .btn-sm { padding: 7px 14px; font-size: 12.5px; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
    }
    .user-chip strong {
      color: var(--accent);
      font-weight: 500;
    }

    .main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 48px 28px 100px;
    }

    .featured {
      display: none;
      margin-bottom: 48px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--bg-elevated);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: box-shadow var(--transition);
    }
    .featured.visible { display: grid; }
    .featured:hover { box-shadow: var(--shadow-lg); }
    .featured.has-image { grid-template-columns: 1.15fr 1fr; }
    .featured-img {
      width: 100%;
      height: 100%;
      min-height: 340px;
      object-fit: cover;
      background: var(--bg-subtle);
    }
    .featured-body {
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .featured-tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }
    .featured-title {
      font-family: var(--serif);
      font-size: 34px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.4px;
      margin-bottom: 14px;
    }
    .featured-excerpt {
      font-size: 15.5px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .featured-meta {
      font-size: 13px;
      color: var(--text-muted);
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
    }
    .section-title {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.3px;
    }
    .section-count {
      font-size: 13px;
      color: var(--text-muted);
    }

    .feed {
      display: flex;
      flex-direction: column;
    }

    .post-card {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      padding: 28px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .post-card:first-child { padding-top: 0; }
    .post-card.has-image {
      grid-template-columns: 240px 1fr;
      gap: 28px;
      align-items: start;
    }

    .post-img-wrap {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-subtle);
      aspect-ratio: 16/10;
    }
    .post-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .post-card:hover .post-img { transform: scale(1.03); }

    .post-body { display: flex; flex-direction: column; justify-content: center; min-height: 100%; }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .post-tag {
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--accent);
    }
    .post-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-muted);
      opacity: 0.6;
    }

    .post-title {
      font-family: var(--serif);
      font-size: 23px;
      font-weight: 400;
      line-height: 1.28;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
      transition: color var(--transition);
    }
    .post-card:hover .post-title { color: var(--accent); }

    .post-excerpt {
      font-size: 14.5px;
      color: var(--text-secondary);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .empty-state h2 {
      font-family: var(--serif);
      font-size: 26px;
      color: var(--text);
      margin-bottom: 10px;
      font-weight: 400;
    }

    .article-view { max-width: 720px; margin: 0 auto; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 28px;
      transition: color var(--transition);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .back-btn:hover { color: var(--text); }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .article-meta .tag {
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .article-title {
      font-family: var(--serif);
      font-size: 40px;
      font-weight: 400;
      line-height: 1.18;
      letter-spacing: -0.5px;
      margin-bottom: 28px;
    }

    .article-img {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      border-radius: var(--radius);
      margin-bottom: 32px;
      background: var(--bg-subtle);
    }

    .article-body {
      font-size: 17.5px;
      line-height: 1.75;
      color: var(--text);
    }
    .article-body p { margin-bottom: 1.35em; }

    .article-actions {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    .admin-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      margin-bottom: 48px;
      box-shadow: var(--shadow);
    }
    .admin-panel h2 {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 400;
      margin-bottom: 22px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 16px;
    }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14.5px;
      background: var(--bg);
      color: var(--text);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .form-group textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.55;
    }

    .image-zone {
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: var(--bg);
      position: relative;
    }
    .image-zone:hover, .image-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .image-zone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .image-zone-text {
      font-size: 13.5px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .image-zone-text strong {
      color: var(--accent);
      font-weight: 500;
    }
    .image-preview-wrap {
      display: none;
      margin-top: 14px;
      position: relative;
    }
    .image-preview-wrap.visible { display: block; }
    .image-preview-wrap img {
      max-width: 100%;
      max-height: 200px;
      border-radius: var(--radius);
      object-fit: cover;
    }
    .image-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s;
      padding: 20px;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      background: var(--bg-elevated);
      border-radius: 14px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
      transform: translateY(16px) scale(0.98);
      transition: transform 0.25s;
      border: 1px solid var(--border);
    }
    .modal-overlay.open .modal {
      transform: translateY(0) scale(1);
    }
    .modal h2 {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 6px;
    }
    .modal > p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .modal-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    .modal-error.show { display: block; }

    .footer {
      background: var(--header);
      color: rgba(255,255,255,0.4);
      padding: 36px 28px;
      text-align: center;
      font-size: 13px;
    }
    .footer strong {
      color: var(--accent);
      font-weight: 500;
    }

    .hidden { display: none !important; }
    .admin-only { display: none; }
    body.is-admin .admin-only { display: block; }
    body.is-admin .guest-only { display: none; }

    @media (max-width: 860px) {
      .featured.has-image { grid-template-columns: 1fr; }
      .featured-img { min-height: 220px; max-height: 260px; }
      .featured-body { padding: 28px 24px; }
      .featured-title { font-size: 26px; }
      .post-card.has-image { grid-template-columns: 160px 1fr; gap: 18px; }
      .post-title { font-size: 19px; }
      .form-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .nav { display: none; }
      .header-inner { padding: 0 16px; }
      .main { padding: 32px 16px 80px; }
      .post-card.has-image { grid-template-columns: 1fr; }
      .post-img-wrap { aspect-ratio: 16/9; }
      .article-title { font-size: 30px; }
      .section-title { font-size: 24px; }
      .featured-title { font-size: 24px; }
      .admin-panel { padding: 20px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="#" class="logo" onclick="showFeed(); return false;">shirma</a>

      <nav class="nav">
        <a href="#" class="active" onclick="showFeed(); return false;">Новости</a>
        <a href="#" onclick="filterTag('истории'); return false;">Истории</a>
        <a href="#" onclick="filterTag('разбор'); return false;">Разбор</a>
      </nav>

      <div class="header-right">
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Тема" aria-label="Переключить тему">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>

        <div class="guest-only">
          <button class="btn btn-ghost btn-sm" onclick="openLogin()">Войти</button>
        </div>
        <div class="admin-only user-chip">
          <strong id="adminName">admin</strong>
          <button class="btn btn-ghost btn-sm" onclick="logout()">Выйти</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div id="feedView">
      <div class="admin-only">
        <div class="admin-panel">
          <h2>Новый материал</h2>
          <form id="postForm" onsubmit="publishPost(event)">
            <div class="form-group">
              <label>Заголовок</label>
              <input type="text" id="postTitle" required placeholder="Сильный и точный заголовок" maxlength="220">
            </div>

            <div class="form-group">
              <label>Текст</label>
              <textarea id="postBody" required placeholder="Основной текст материала. Можно использовать пустые строки для абзацев."></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Изображение</label>
                <div class="image-zone" id="imageZone">
                  <input type="file" id="postImageFile" accept="image/*" onchange="handleImageUpload(event)">
                  <div class="image-zone-text">
                    Перетащите фото сюда или <strong>выберите файл</strong><br>
                    <span style="font-size:12px;opacity:0.8">JPG, PNG, WebP · до 12 МБ (будет сжато)</span>
                  </div>
                </div>
                <div class="image-preview-wrap" id="previewWrap">
                  <img id="imagePreview" alt="Превью">
                  <button type="button" class="image-remove" onclick="clearImage()" title="Убрать">×</button>
                </div>
                <div class="image-hint" id="imageHint"></div>
              </div>

              <div class="form-group">
                <label>Рубрика</label>
                <select id="postTag">
                  <option value="новости">Новости</option>
                  <option value="истории">Истории</option>
                  <option value="разбор">Разбор</option>
                </select>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-accent" id="publishBtn">Опубликовать</button>
              <button type="button" class="btn btn-outline" onclick="resetForm()">Очистить</button>
            </div>
          </form>
        </div>
      </div>

      <div class="featured" id="featured"></div>

      <div class="section-head">
        <h1 class="section-title" id="sectionTitle">Все материалы</h1>
        <span class="section-count" id="sectionCount"></span>
      </div>

      <div id="feed" class="feed"></div>
    </div>

    <div id="articleView" class="hidden">
      <div class="article-view">
        <button class="back-btn" onclick="showFeed()">← Назад к ленте</button>
        <article id="articleContent"></article>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p><strong>shirma</strong> · независимые новости</p>
  </footer>

  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <h2>Вход в редакцию</h2>
      <p>Публиковать материалы может только авторизованный редактор.</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Логин</label>
          <input type="text" id="loginUser" required autocomplete="username" placeholder="admin">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="loginPass" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <div class="modal-error" id="loginError">Неверный логин или пароль</div>
        <div class="form-actions" style="margin-top: 20px;">
          <button type="submit" class="btn btn-accent" style="flex:1">Войти</button>
          <button type="button" class="btn btn-outline" onclick="closeLogin()">Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const ADMIN = { username: 'admin', password: 'shirma2026' };
    const MAX_FILE_MB = 12;
    const TARGET_MAX_WIDTH = 1600;
    const JPEG_QUALITY = 0.82;

    let posts = [];
    let currentUser = null;
    let imageDataUrl = null;
    let currentFilter = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadTheme();
      loadPosts();
      checkAuth();
      renderFeed();
      setupDropZone();
    });

    function loadTheme() {
      const t = localStorage.getItem('shirma_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    }
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      const next = cur === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('shirma_theme', next);
    }

    function checkAuth() {
      if (localStorage.getItem('shirma_auth') === 'true') {
        currentUser = ADMIN.username;
        document.body.classList.add('is-admin');
        document.getElementById('adminName').textContent = currentUser;
      }
    }
    function openLogin() {
      document.getElementById('loginModal').classList.add('open');
      setTimeout(() => document.getElementById('loginUser').focus(), 50);
    }
    function closeLogin() {
      document.getElementById('loginModal').classList.remove('open');
      document.getElementById('loginError').classList.remove('show');
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
    }
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value;
      if (u === ADMIN.username && p === ADMIN.password) {
        currentUser = u;
        localStorage.setItem('shirma_auth', 'true');
        document.body.classList.add('is-admin');
        document.getElementById('adminName').textContent = u;
        closeLogin();
      } else {
        document.getElementById('loginError').classList.add('show');
      }
    }
    function logout() {
      currentUser = null;
      localStorage.removeItem('shirma_auth');
      document.body.classList.remove('is-admin');
      showFeed();
    }

    function loadPosts() {
      try {
        const raw = localStorage.getItem('shirma_posts');
        posts = raw ? JSON.parse(raw) : demoPosts();
      } catch { posts = demoPosts(); }
    }
    function savePosts() {
      localStorage.setItem('shirma_posts', JSON.stringify(posts));
    }
    function demoPosts() {
      return [{
        id: 'demo1',
        title: 'Добро пожаловать в Shirma',
        body: 'Это демо-материал. Войдите как редактор, чтобы публиковать свои тексты и фото.\n\nЛогин: admin\nПароль: shirma2026\n\nПосле входа появится удобная форма публикации. Фото автоматически сжимаются — можно загружать файлы до 12 МБ.',
        image: '',
        tag: 'новости',
        date: new Date().toISOString(),
        author: 'Редакция'
      }];
    }

    function getFiltered() {
      let list = [...posts].sort((a, b) => new Date(b.date) - new Date(a.date));
      if (currentFilter) list = list.filter(p => p.tag === currentFilter);
      return list;
    }

    function renderFeed() {
      const list = getFiltered();
      const feed = document.getElementById('feed');
      const featured = document.getElementById('featured');
      const countEl = document.getElementById('sectionCount');
      const titleEl = document.getElementById('sectionTitle');

      titleEl.textContent = currentFilter
        ? currentFilter.charAt(0).toUpperCase() + currentFilter.slice(1)
        : 'Все материалы';
      countEl.textContent = list.length ? list.length + ' ' + plural(list.length) : '';

      if (!currentFilter && list.length > 0) {
        const feat = list.find(p => p.image) || list[0];
        const rest = list.filter(p => p.id !== feat.id);
        renderFeatured(feat);
        renderCards(rest, feed);
      } else {
        featured.classList.remove('visible');
        renderCards(list, feed);
      }
    }

    function renderFeatured(post) {
      const el = document.getElementById('featured');
      const hasImg = !!post.image;
      el.className = 'featured visible' + (hasImg ? ' has-image' : '');
      el.onclick = () => showArticle(post.id);

      const excerpt = post.body.replace(/\n/g, ' ').slice(0, 200) + (post.body.length > 200 ? '…' : '');

      el.innerHTML = `
        ${hasImg ? `<img class="featured-img" src="${esc(post.image)}" alt="" loading="eager">` : ''}
        <div class="featured-body">
          <div class="featured-tag">${esc(post.tag)}</div>
          <h2 class="featured-title">${esc(post.title)}</h2>
          <p class="featured-excerpt">${esc(excerpt)}</p>
          <div class="featured-meta">${formatTimeAgo(post.date)} · ${esc(post.author || 'Редакция')}</div>
        </div>
      `;
    }

    function renderCards(list, container) {
      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>Пока пусто</h2>
            <p>Опубликуйте первый материал</p>
          </div>`;
        return;
      }

      container.innerHTML = list.map(post => {
        const hasImg = !!post.image;
        const excerpt = post.body.replace(/\n/g, ' ').slice(0, 160) + (post.body.length > 160 ? '…' : '');
        return `
          <article class="post-card ${hasImg ? 'has-image' : ''}" onclick="showArticle('${post.id}')">
            ${hasImg ? `
              <div class="post-img-wrap">
                <img class="post-img" src="${esc(post.image)}" alt="" loading="lazy">
              </div>` : ''}
            <div class="post-body">
              <div class="post-meta">
                <span class="post-tag">${esc(post.tag)}</span>
                <span class="post-dot"></span>
                <span>${formatTimeAgo(post.date)}</span>
              </div>
              <h2 class="post-title">${esc(post.title)}</h2>
              <p class="post-excerpt">${esc(excerpt)}</p>
            </div>
          </article>`;
      }).join('');
    }

    function showArticle(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;

      const el = document.getElementById('articleContent');
      el.innerHTML = `
        <div class="article-meta">
          <span class="tag">${esc(post.tag)}</span>
          <span>${formatFullDate(post.date)}</span>
          <span>${esc(post.author || 'Редакция')}</span>
        </div>
        <h1 class="article-title">${esc(post.title)}</h1>
        ${post.image ? `<img class="article-img" src="${esc(post.image)}" alt="">` : ''}
        <div class="article-body">${formatBody(post.body)}</div>
        ${currentUser ? `
          <div class="article-actions">
            <button class="btn btn-danger btn-sm" onclick="deletePost('${post.id}')">Удалить материал</button>
          </div>` : ''}
      `;

      document.getElementById('feedView').classList.add('hidden');
      document.getElementById('articleView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function showFeed() {
      currentFilter = null;
      document.getElementById('articleView').classList.add('hidden');
      document.getElementById('feedView').classList.remove('hidden');
      renderFeed();
      window.scrollTo(0, 0);
    }

    function filterTag(tag) {
      currentFilter = tag;
      document.getElementById('articleView').classList.add('hidden');
      document.getElementById('feedView').classList.remove('hidden');
      renderFeed();
      window.scrollTo(0, 0);
    }

    function setupDropZone() {
      const zone = document.getElementById('imageZone');
      ['dragenter', 'dragover'].forEach(ev => {
        zone.addEventListener(ev, e => {
          e.preventDefault();
          zone.classList.add('dragover');
        });
      });
      ['dragleave', 'drop'].forEach(ev => {
        zone.addEventListener(ev, e => {
          e.preventDefault();
          zone.classList.remove('dragover');
        });
      });
      zone.addEventListener('drop', e => {
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) processImage(file);
      });
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (file) processImage(file);
    }

    async function processImage(file) {
      if (file.size > MAX_FILE_MB * 1024 * 1024) {
        alert(`Файл слишком большой. Максимум ${MAX_FILE_MB} МБ.`);
        return;
      }

      const hint = document.getElementById('imageHint');
      hint.textContent = 'Обрабатываем изображение…';

      try {
        const dataUrl = await compressImage(file);
        imageDataUrl = dataUrl;
        const preview = document.getElementById('imagePreview');
        preview.src = dataUrl;
        document.getElementById('previewWrap').classList.add('visible');

        const sizeKb = Math.round((dataUrl.length * 0.75) / 1024);
        hint.textContent = `Готово · ≈ ${sizeKb} КБ после сжатия`;
      } catch (err) {
        console.error(err);
        hint.textContent = 'Не удалось обработать изображение';
        alert('Ошибка при обработке изображения');
      }
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width, height } = img;
          if (width > TARGET_MAX_WIDTH) {
            height = Math.round(height * (TARGET_MAX_WIDTH / width));
            width = TARGET_MAX_WIDTH;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const mime = file.type === 'image/png' && hasTransparency(ctx, width, height)
            ? 'image/png'
            : 'image/jpeg';
          const quality = mime === 'image/jpeg' ? JPEG_QUALITY : undefined;
          resolve(canvas.toDataURL(mime, quality));
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    function hasTransparency(ctx, w, h) {
      try {
        const data = ctx.getImageData(0, 0, Math.min(w, 50), Math.min(h, 50)).data;
        for (let i = 3; i < data.length; i += 4) {
          if (data[i] < 255) return true;
        }
      } catch {}
      return false;
    }

    function clearImage() {
      imageDataUrl = null;
      document.getElementById('postImageFile').value = '';
      document.getElementById('previewWrap').classList.remove('visible');
      document.getElementById('imagePreview').src = '';
      document.getElementById('imageHint').textContent = '';
    }

    function publishPost(e) {
      e.preventDefault();
      if (!currentUser) return;

      const title = document.getElementById('postTitle').value.trim();
      const body = document.getElementById('postBody').value.trim();
      const tag = document.getElementById('postTag').value;

      const post = {
        id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        title,
        body,
        image: imageDataUrl || '',
        tag,
        date: new Date().toISOString(),
        author: currentUser
      };

      posts.unshift(post);
      savePosts();
      resetForm();
      currentFilter = null;
      renderFeed();

      const btn = document.getElementById('publishBtn');
      const original = btn.textContent;
      btn.textContent = 'Опубликовано';
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = original;
        btn.disabled = false;
      }, 1600);
    }

    function deletePost(id) {
      if (!confirm('Удалить этот материал?')) return;
      posts = posts.filter(p => p.id !== id);
      savePosts();
      showFeed();
    }

    function resetForm() {
      document.getElementById('postForm').reset();
      clearImage();
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatBody(text) {
      return esc(text)
        .split(/\n\n+/)
        .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
        .join('');
    }

    function formatTimeAgo(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'только что';
      if (mins < 60) return mins + ' мин. назад';
      const hours = Math.floor(mins / 60);
      if (hours < 24) return hours + ' ч. назад';
      const days = Math.floor(hours / 24);
      if (days < 7) return days + ' дн. назад';
      return formatFullDate(iso);
    }

    function formatFullDate(iso) {
      return new Date(iso).toLocaleDateString('ru-RU', {
        day: 'numeric', month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function plural(n) {
      const m10 = n % 10, m100 = n % 100;
      if (m10 === 1 && m100 !== 11) return 'материал';
      if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return 'материала';
      return 'материалов';
    }

    document.getElementById('loginModal').addEventListener('click', e => {
      if (e.target.id === 'loginModal') closeLogin();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLogin();
    });
  </script>
</body>
</html>
