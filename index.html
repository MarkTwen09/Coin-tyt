<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Анонимнет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #000000;
      --bg-header: rgba(22, 22, 24, 0.85);
      --bg-bubble-me: #2A60E4;
      --bg-bubble-other: #1C1C1E;
      --text-main: #FFFFFF;
      --text-muted: #8E8E93;
      --accent: #2A60E4;
      --danger: #FF3B30;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
      position: relative;
    }

    /* Шапка iOS Telegram Style */
    .header {
      padding: 12px 16px;
      padding-top: calc(env(safe-area-inset-top, 12px) + 8px);
      background: var(--bg-header);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .chat-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2A60E4, #00C6FF);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }

    .chat-titles h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .chat-titles p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    /* Область сообщений */
    .chat-body {
      flex: 1;
      padding: 12px 12px 16px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      position: relative;
    }

    .msg-group.me {
      align-self: flex-end;
    }

    .msg-group.other {
      align-self: flex-start;
    }

    .msg-author {
      font-size: 0.75rem;
      font-weight: 600;
      color: #34C759;
      margin-left: 10px;
      margin-bottom: 2px;
    }

    .msg-bubble {
      padding: 8px 12px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.35;
      word-break: break-word;
      position: relative;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .msg-bubble:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .msg-group.me .msg-bubble {
      background: var(--bg-bubble-me);
      color: #FFFFFF;
      border-bottom-right-radius: 4px;
    }

    .msg-group.other .msg-bubble {
      background: var(--bg-bubble-other);
      color: #FFFFFF;
      border-bottom-left-radius: 4px;
    }

    /* Цитата ответа */
    .reply-quote {
      background: rgba(0, 0, 0, 0.25);
      border-left: 2px solid #FFFFFF;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      margin-bottom: 4px;
    }

    .reply-quote-author {
      font-weight: 600;
      opacity: 0.9;
    }

    .reply-quote-text {
      opacity: 0.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .msg-meta {
      float: right;
      font-size: 0.68rem;
      color: rgba(255, 255, 255, 0.65);
      margin-left: 12px;
      margin-top: 4px;
      line-height: 1;
    }

    /* Панель ввода Telegram Style */
    .input-container {
      background: var(--bg-header);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid var(--border-color);
      padding: 8px 12px;
      padding-bottom: calc(env(safe-area-inset-bottom, 8px) + 6px);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reply-preview-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 8px;
      border-left: 2px solid var(--accent);
      font-size: 0.8rem;
    }

    .reply-preview-bar.active {
      display: flex;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .msg-input {
      flex: 1;
      background: #1C1C1E;
      border: 0.5px solid rgba(255, 255, 255, 0.1);
      padding: 9px 14px;
      border-radius: 20px;
      color: #FFFFFF;
      font-size: 0.95rem;
      outline: none;
      user-select: text;
    }

    .msg-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Контекстное меню iOS */
    .context-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .context-overlay.active {
      display: block;
      opacity: 1;
    }

    .ios-menu {
      position: fixed;
      background: rgba(30, 30, 32, 0.95);
      border-radius: 14px;
      width: 180px;
      z-index: 101;
      display: none;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .ios-menu.active {
      display: flex;
    }

    .ios-menu-btn {
      padding: 12px 16px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #FFFFFF;
      cursor: pointer;
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
    }

    .ios-menu-btn:last-child {
      border-bottom: none;
    }

    .ios-menu-btn.danger {
      color: var(--danger);
    }

    /* Модальное окно профиля */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal.active { display: flex; }

    .modal-box {
      background: #1C1C1E;
      border-radius: 16px;
      padding: 20px;
      width: 85%;
      max-width: 320px;
    }

    .modal-box h3 { margin-bottom: 12px; font-size: 1.1rem; }

    .modal-box input {
      width: 100%;
      background: #2C2C2E;
      border: none;
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      margin-bottom: 10px;
      outline: none;
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save { background: var(--accent); color: #fff; }
    .btn-cancel { background: transparent; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="app">
    <header class="header">
      <div class="chat-info">
        <div class="chat-avatar">А</div>
        <div class="chat-titles">
          <h1>Анонимнет</h1>
          <p>в сети: 124 участников</p>
        </div>
      </div>
      <div class="user-badge" id="userBadge">
        <span id="myAvatar">🥷</span>
        <span id="myNick">Аноним</span>
      </div>
    </header>

    <main class="chat-body" id="chatBody"></main>

    <footer class="input-container">
      <div class="reply-preview-bar" id="replyBar">
        <span id="replyText">Ответ...</span>
        <span style="cursor:pointer;" id="closeReply">&times;</span>
      </div>
      <div class="input-row">
        <input type="text" class="msg-input" id="msgInput" placeholder="Сообщение..." autocomplete="off">
        <button class="send-btn" id="sendBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Контекстное меню -->
  <div class="context-overlay" id="overlay"></div>
  <div class="ios-menu" id="iosMenu">
    <div class="ios-menu-btn" id="mReply">Ответить <span>↩️</span></div>
    <div class="ios-menu-btn" id="mCopy">Скопировать <span>📋</span></div>
    <div class="ios-menu-btn danger" id="mDelete" style="display: none;">Удалить у всех <span>🗑️</span></div>
  </div>

  <!-- Настройки профиля -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <h3>Твой профиль</h3>
      <input type="text" id="inNick" placeholder="Имя">
      <input type="text" id="inAvatar" placeholder="Аватар (эмодзи)" maxlength="2">
      <div class="modal-btns">
        <button class="btn btn-cancel" id="mClose">Отмена</button>
        <button class="btn btn-save" id="mSave">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      user: {
        id: localStorage.getItem('anon_tg_id') || 'u_' + Date.now(),
        nick: localStorage.getItem('anon_tg_nick') || 'Аноним_' + Math.floor(100 + Math.random() * 900),
        avatar: localStorage.getItem('anon_tg_avatar') || '🥷'
      },
      messages: JSON.parse(localStorage.getItem('anon_tg_msgs')) || [
        { id: 1, uid: 'sys', author: 'Система', text: 'Добро пожаловать в Анонимнет. Нажмите на сообщение для меню.', time: '12:00', reply: null }
      ],
      selectedMsg: null,
      replyTo: null
    };

    localStorage.setItem('anon_tg_id', state.user.id);

    const chatBody = document.getElementById('chatBody');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const myNick = document.getElementById('myNick');
    const myAvatar = document.getElementById('myAvatar');
    
    const overlay = document.getElementById('overlay');
    const iosMenu = document.getElementById('iosMenu');
    const mDelete = document.getElementById('mDelete');
    
    const replyBar = document.getElementById('replyBar');
    const replyText = document.getElementById('replyText');

    function save() {
      localStorage.setItem('anon_tg_msgs', JSON.stringify(state.messages));
    }

    function render() {
      chatBody.innerHTML = '';
      state.messages.forEach(msg => {
        const isMe = msg.uid === state.user.id;
        const group = document.createElement('div');
        group.className = `msg-group ${isMe ? 'me' : 'other'}`;

        let replyHtml = '';
        if (msg.reply) {
          replyHtml = `
            <div class="reply-quote">
              <div class="reply-quote-author">${escape(msg.reply.author)}</div>
              <div class="reply-quote-text">${escape(msg.reply.text)}</div>
            </div>`;
        }

        group.innerHTML = `
          ${!isMe ? `<div class="msg-author">${escape(msg.author)}</div>` : ''}
          <div class="msg-bubble" data-id="${msg.id}">
            ${replyHtml}
            <span>${escape(msg.text)}</span>
            <span class="msg-meta">${msg.time}</span>
          </div>
        `;

        const bubble = group.querySelector('.msg-bubble');
        bubble.addEventListener('click', (e) => openMenu(e, msg));

        chatBody.appendChild(group);
      });

      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function escape(s) {
      return s.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t));
    }

    function send() {
      const val = msgInput.value.trim();
      if (!val) return;

      const d = new Date();
      const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

      state.messages.push({
        id: Date.now(),
        uid: state.user.id,
        author: state.user.nick,
        text: val,
        time: time,
        reply: state.replyTo
      });

      save();
      render();
      msgInput.value = '';
      clearReply();
    }

    function openMenu(e, msg) {
      state.selectedMsg = msg;
      
      // ИСПРАВЛЕНИЕ ЛОГИКИ: Показываем кнопкой "Удалить" ТОЛЬКО для своих сообщений
      if (msg.uid === state.user.id) {
        mDelete.style.display = 'flex';
      } else {
        mDelete.style.display = 'none';
      }

      iosMenu.style.top = `${Math.min(e.clientY, window.innerHeight - 140)}px`;
      iosMenu.style.left = `${Math.min(e.clientX, window.innerWidth - 190)}px`;

      overlay.classList.add('active');
      iosMenu.classList.add('active');
    }

    function closeMenu() {
      overlay.classList.remove('active');
      iosMenu.classList.remove('active');
    }

    function clearReply() {
      state.replyTo = null;
      replyBar.classList.remove('active');
    }

    // Обработчики контекстного меню
    document.getElementById('mDelete').onclick = () => {
      if (state.selectedMsg && state.selectedMsg.uid === state.user.id) {
        state.messages = state.messages.filter(m => m.id !== state.selectedMsg.id);
        save();
        render();
      }
      closeMenu();
    };

    document.getElementById('mReply').onclick = () => {
      if (state.selectedMsg) {
        state.replyTo = { author: state.selectedMsg.author, text: state.selectedMsg.text };
        replyText.textContent = `Ответ для ${state.selectedMsg.author}: "${state.selectedMsg.text.slice(0, 18)}..."`;
        replyBar.classList.add('active');
      }
      closeMenu();
    };

    document.getElementById('mCopy').onclick = () => {
      if (state.selectedMsg) {
        navigator.clipboard.writeText(state.selectedMsg.text);
      }
      closeMenu();
    };

    overlay.onclick = closeMenu;
    document.getElementById('closeReply').onclick = clearReply;

    sendBtn.onclick = send;
    msgInput.onkeypress = (e) => { if (e.key === 'Enter') send(); };

    // Управление профилем
    document.getElementById('userBadge').onclick = () => {
      document.getElementById('inNick').value = state.user.nick;
      document.getElementById('inAvatar').value = state.user.avatar;
      document.getElementById('modal').classList.add('active');
    };

    document.getElementById('mClose').onclick = () => document.getElementById('modal').classList.remove('active');

    document.getElementById('mSave').onclick = () => {
      const n = document.getElementById('inNick').value.trim();
      const a = document.getElementById('inAvatar').value.trim();
      if (n) state.user.nick = n;
      if (a) state.user.avatar = a;

      localStorage.setItem('anon_tg_nick', state.user.nick);
      localStorage.setItem('anon_tg_avatar', state.user.avatar);
      
      myNick.textContent = state.user.nick;
      myAvatar.textContent = state.user.avatar;

      document.getElementById('modal').classList.remove('active');
    };

    // Старт
    myNick.textContent = state.user.nick;
    myAvatar.textContent = state.user.avatar;
    render();
  </script>
</body>
</html>
