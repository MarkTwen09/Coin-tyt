<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken Shoot InOut</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f121a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 960px;
            max-height: 680px;
            background: #1a1d28;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* Top Bar Info */
        .top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .stat-box {
            background: rgba(15, 18, 26, 0.85);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-label {
            color: #8a8d9b;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .stat-value {
            color: #4cd964;
            font-size: 15px;
            font-weight: 800;
        }

        /* Bottom Controls */
        .controls-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 18, 26, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-label {
            font-size: 9px;
            color: #8a8d9b;
            text-transform: uppercase;
            font-weight: 700;
        }

        .bet-input-wrapper {
            display: flex;
            align-items: center;
            background: #222634;
            border: 1px solid #33384a;
            border-radius: 6px;
            padding: 2px;
        }

        .bet-input-wrapper input {
            background: transparent;
            border: none;
            color: #fff;
            width: 50px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }

        .btn-small {
            background: #2c3245;
            border: none;
            color: #a0a5b5;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .risk-selector {
            display: flex;
            background: #222634;
            padding: 2px;
            border-radius: 6px;
            gap: 2px;
        }

        .risk-btn {
            background: transparent;
            border: none;
            color: #8a8d9b;
            padding: 5px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
        }

        .risk-btn.active {
            background: #ff9500;
            color: #fff;
        }

        .btn-primary {
            background: linear-gradient(180deg, #ff9500 0%, #e07b00 100%);
            border: none;
            color: #fff;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 149, 0, 0.4);
            text-transform: uppercase;
            flex-grow: 1;
            max-width: 140px;
        }

        .btn-primary:disabled {
            background: #4a4e5d;
            box-shadow: none;
            opacity: 0.6;
        }

        /* Ammo Bar */
        .ammo-container {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .bullet {
            width: 8px;
            height: 18px;
            background: #ffcc00;
            border-radius: 2px;
            border: 1px solid #b38f00;
        }

        .bullet.spent {
            background: #444;
            border-color: #222;
            opacity: 0.3;
        }

        /* History */
        .history-bar {
            position: absolute;
            top: 55px;
            left: 10px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }

        .history-tag {
            background: rgba(22, 26, 38, 0.85);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        .history-tag.win { color: #4cd964; }
        .history-tag.loss { color: #ff3b30; }

        /* Notification overlay */
        .overlay-msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
            text-align: center;
            width: 90%;
        }

        .overlay-msg.show {
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="top-bar">
        <div class="stat-box">
            <div class="stat-label">Баланс</div>
            <div class="stat-value" id="balance-val">$1000.00</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Выигрыш</div>
            <div class="stat-value" id="win-val" style="color:#ffcc00;">$0.00</div>
        </div>
    </div>

    <div class="history-bar" id="history-bar"></div>
    <div class="overlay-msg" id="overlay-msg">НАЖМИ СТАРТ!</div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls-panel">
        <div class="control-group">
            <span class="control-label">Ставка</span>
            <div class="bet-input-wrapper">
                <button class="btn-small" id="btn-min">MIN</button>
                <input type="number" id="bet-input" value="10" min="1">
                <button class="btn-small" id="btn-max">MAX</button>
                <button class="btn-small" id="btn-x2">x2</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Риск</span>
            <div class="risk-selector">
                <button class="risk-btn" data-risk="low">Low</button>
                <button class="risk-btn active" data-risk="med">Med</button>
                <button class="risk-btn" data-risk="high">High</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Патроны</span>
            <div class="ammo-container" id="ammo-box"></div>
        </div>

        <button class="btn-primary" id="btn-start">СТАРТ</button>
    </div>
</div>

<script>
    // --- ЗВУКОВОЙ ДВИЖОК ---
    class SoundEngine {
        constructor() { this.ctx = null; }
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        playShot() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.1, this.ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            const src = this.ctx.createBufferSource();
            src.buffer = buf;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.8, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(now);
        }
        playHit() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(700, now + 0.1);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
        }
        playWin() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            [400, 550, 700].forEach((f, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(f, now + i * 0.08);
                gain.gain.setValueAtTime(0.2, now + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + i * 0.08);
                osc.stop(now + i * 0.08 + 0.15);
            });
        }
    }

    const sound = new SoundEngine();

    // --- СОСТОЯНИЕ ИГРЫ ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let balance = 1000;
    let currentBet = 10;
    let selectedRisk = 'med';
    let gameState = 'idle'; // idle, playing
    let maxAmmo = 5;
    let currentAmmo = 5;
    let roundWin = 0;
    let totalMultiplier = 0;

    const balanceEl = document.getElementById('balance-val');
    const winEl = document.getElementById('win-val');
    const betInput = document.getElementById('bet-input');
    const btnStart = document.getElementById('btn-start');
    const overlayMsg = document.getElementById('overlay-msg');
    const ammoBox = document.getElementById('ammo-box');
    const historyBar = document.getElementById('history-bar');

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let windmillAngle = 0;
    let chickens = [];
    let particles = [];
    let floatingTexts = [];

    const MULTIPLIERS = [
        { mult: 1.2, bg: '#4cd964', size: 32, speed: 2.0 },
        { mult: 1.5, bg: '#34a853', size: 30, speed: 2.3 },
        { mult: 2.0, bg: '#007aff', size: 28, speed: 2.7 },
        { mult: 5.0, bg: '#5856d6', size: 25, speed: 3.3 },
        { mult: 12.0, bg: '#ff9500', size: 22, speed: 4.0 },
        { mult: 48.0, bg: '#ff3b30', size: 18, speed: 5.0 }
    ];

    class Chicken {
        constructor() {
            this.reset();
        }

        reset() {
            const rand = Math.random();
            let type = MULTIPLIERS[0];
            if (rand > 0.4) type = MULTIPLIERS[1];
            if (rand > 0.65) type = MULTIPLIERS[2];
            if (rand > 0.82) type = MULTIPLIERS[3];
            if (rand > 0.93) type = MULTIPLIERS[4];
            if (rand > 0.98) type = MULTIPLIERS[5];

            this.mult = type.mult;
            this.bg = type.bg;
            this.baseSize = type.size;
            this.speed = type.speed * (selectedRisk === 'high' ? 1.3 : selectedRisk === 'low' ? 0.8 : 1.0);
            
            this.x = canvas.width + Math.random() * 200 + 30;
            this.y = canvas.height * 0.2 + Math.random() * (canvas.height * 0.4);
            this.startY = this.y;
            this.time = Math.random() * 100;
            this.alive = true;
        }

        update() {
            this.x -= this.speed;
            this.time += 0.05;
            this.y = this.startY + Math.sin(this.time) * 15;

            if (this.x < -50) {
                this.x = canvas.width + Math.random() * 150 + 30;
            }
        }

        draw(ctx) {
            if (!this.alive) return;

            ctx.save();
            ctx.translate(this.x, this.y);

            // Курица
            ctx.fillStyle = '#e84c3d';
            ctx.beginPath();
            ctx.ellipse(0, 0, this.baseSize, this.baseSize * 0.75, 0, 0, Math.PI * 2);
            ctx.fill();

            // Голова
            ctx.beginPath();
            ctx.arc(-this.baseSize * 0.6, -this.baseSize * 0.3, this.baseSize * 0.4, 0, Math.PI * 2);
            ctx.fill();

            // Гребешок
            ctx.fillStyle = '#ff2a2a';
            ctx.beginPath();
            ctx.arc(-this.baseSize * 0.6, -this.baseSize * 0.7, this.baseSize * 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Клюв
            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            ctx.moveTo(-this.baseSize * 0.9, -this.baseSize * 0.3);
            ctx.lineTo(-this.baseSize * 1.2, -this.baseSize * 0.1);
            ctx.lineTo(-this.baseSize * 0.9, 0);
            ctx.closePath();
            ctx.fill();

            // Табличка множителя
            ctx.restore();
            ctx.save();
            ctx.translate(this.x, this.y + this.baseSize + 10);
            
            ctx.fillStyle = this.bg;
            ctx.beginPath();
            ctx.roundRect(-20, -8, 40, 16, 4);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('x' + this.mult, 0, 1);

            ctx.restore();
        }

        isHit(px, py) {
            const dx = this.x - px;
            const dy = this.y - py;
            return Math.sqrt(dx * dx + dy * dy) < this.baseSize + 12;
        }
    }

    // Спавн куриц сразу при старте страницы
    for (let i = 0; i < 6; i++) {
        chickens.push(new Chicken());
    }

    function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;

        // Небо
        ctx.fillStyle = '#87ceeb';
        ctx.fillRect(0, 0, w, h);

        // Горы
        ctx.fillStyle = '#a3c2cf';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.6);
        ctx.lineTo(w * 0.2, h * 0.4);
        ctx.lineTo(w * 0.5, h * 0.6);
        ctx.lineTo(w * 0.8, h * 0.45);
        ctx.lineTo(w, h * 0.6);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.fill();

        // Поле
        ctx.fillStyle = '#5ca935';
        ctx.fillRect(0, h * 0.55, w, h * 0.45);

        // Ветряк
        drawWindmill(w * 0.85, h * 0.45);
    }

    function drawWindmill(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = '#7a5230';
        ctx.fillRect(-8, 0, 16, 60);
        
        windmillAngle += 0.01;
        ctx.rotate(windmillAngle);
        ctx.fillStyle = '#ddd';
        for (let i = 0; i < 4; i++) {
            ctx.rotate(Math.PI / 2);
            ctx.fillRect(-2, 0, 4, 35);
        }
        ctx.restore();
    }

    function updateAmmoUI() {
        ammoBox.innerHTML = '';
        for (let i = 0; i < maxAmmo; i++) {
            const b = document.createElement('div');
            b.className = 'bullet' + (i >= currentAmmo ? ' spent' : '');
            ammoBox.appendChild(b);
        }
    }
    updateAmmoUI();

    function initRound() {
        if (balance < currentBet) {
            showOverlay('НЕДОСТАТОЧНО СРЕДСТВ');
            return;
        }

        sound.init();
        balance -= currentBet;
        roundWin = 0;
        totalMultiplier = 0;
        currentAmmo = maxAmmo;

        balanceEl.innerText = `$${balance.toFixed(2)}`;
        winEl.innerText = `$0.00`;
        updateAmmoUI();

        gameState = 'playing';
        btnStart.disabled = true;
        showOverlay('СТРЕЛЯЙ!');
    }

    function endRound() {
        gameState = 'idle';
        btnStart.disabled = false;

        if (roundWin > 0) {
            balance += roundWin;
            balanceEl.innerText = `$${balance.toFixed(2)}`;
            sound.playWin();
            showOverlay(`ВЫИГРЫШ: $${roundWin.toFixed(2)}`);
            addHistoryTag(totalMultiplier, true);
        } else {
            showOverlay('ПРОМАХ!');
            addHistoryTag(0, false);
        }
    }

    function showOverlay(msg) {
        overlayMsg.innerText = msg;
        overlayMsg.classList.add('show');
        setTimeout(() => overlayMsg.classList.remove('show'), 1200);
    }

    function addHistoryTag(mult, isWin) {
        const tag = document.createElement('div');
        tag.className = `history-tag ${isWin ? 'win' : 'loss'}`;
        tag.innerText = isWin ? `x${mult.toFixed(1)}` : '0.0x';
        historyBar.prepend(tag);
        if (historyBar.children.length > 6) historyBar.removeChild(historyBar.lastChild);
    }

    // --- ВЫСТРЕЛ ---
    function handleShoot(clientX, clientY) {
        if (gameState !== 'playing') return;

        const rect = canvas.getBoundingClientRect();
        const mouseX = clientX - rect.left;
        const mouseY = clientY - rect.top;

        if (currentAmmo <= 0) return;

        currentAmmo--;
        updateAmmoUI();
        sound.playShot();

        let hit = false;
        for (let chicken of chickens) {
            if (chicken.alive && chicken.isHit(mouseX, mouseY)) {
                chicken.alive = false;
                hit = true;
                sound.playHit();

                const winAmount = currentBet * chicken.mult;
                roundWin += winAmount;
                totalMultiplier += chicken.mult;

                winEl.innerText = `$${roundWin.toFixed(2)}`;

                setTimeout(() => {
                    chicken.reset();
                }, 500);
                break;
            }
        }

        if (currentAmmo <= 0) {
            setTimeout(endRound, 500);
        }
    }

    canvas.addEventListener('click', (e) => handleShoot(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
            handleShoot(e.touches[0].clientX, e.touches[0].clientY);
        }
    });

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBackground();

        for (let chicken of chickens) {
            chicken.update();
            chicken.draw(ctx);
        }

        requestAnimationFrame(gameLoop);
    }

    btnStart.addEventListener('click', initRound);

    betInput.addEventListener('change', () => {
        let val = parseFloat(betInput.value);
        if (isNaN(val) || val < 1) val = 1;
        if (val > balance) val = balance;
        currentBet = val;
        betInput.value = currentBet;
    });

    document.getElementById('btn-min').addEventListener('click', () => { currentBet = 1; betInput.value = 1; });
    document.getElementById('btn-max').addEventListener('click', () => { currentBet = Math.floor(balance); betInput.value = currentBet; });
    document.getElementById('btn-x2').addEventListener('click', () => { currentBet = Math.min(Math.floor(balance), currentBet * 2); betInput.value = currentBet; });

    document.querySelectorAll('.risk-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.risk-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            selectedRisk = e.target.dataset.risk;
        });
    });

    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
