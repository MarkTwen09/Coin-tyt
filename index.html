<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken Shoot InOut</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0e14;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 960px;
            max-height: 680px;
            background: #1a1d28;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* Top Bar Info */
        .top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .stat-box {
            background: rgba(15, 18, 26, 0.85);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .stat-label {
            color: #8a8d9b;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .stat-value {
            color: #4cd964;
            font-size: 16px;
            font-weight: 800;
        }

        /* Bottom Controls */
        .controls-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 18, 26, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-label {
            font-size: 9px;
            color: #8a8d9b;
            text-transform: uppercase;
            font-weight: 700;
        }

        .bet-input-wrapper {
            display: flex;
            align-items: center;
            background: #222634;
            border: 1px solid #33384a;
            border-radius: 6px;
            padding: 2px;
        }

        .bet-input-wrapper input {
            background: transparent;
            border: none;
            color: #fff;
            width: 50px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }

        .btn-small {
            background: #2c3245;
            border: none;
            color: #a0a5b5;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .risk-selector {
            display: flex;
            background: #222634;
            padding: 2px;
            border-radius: 6px;
            gap: 2px;
        }

        .risk-btn {
            background: transparent;
            border: none;
            color: #8a8d9b;
            padding: 5px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
        }

        .risk-btn.active {
            background: #ff9500;
            color: #fff;
        }

        .btn-primary {
            background: linear-gradient(180deg, #ff9500 0%, #e07b00 100%);
            border: none;
            color: #fff;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 149, 0, 0.4);
            text-transform: uppercase;
            flex-grow: 1;
            max-width: 140px;
        }

        .btn-primary:disabled {
            background: #4a4e5d;
            box-shadow: none;
            opacity: 0.6;
        }

        .btn-cashout {
            background: linear-gradient(180deg, #34c759 0%, #248a3d 100%);
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.4);
            display: none;
        }

        /* Ammo Bar */
        .ammo-container {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .bullet {
            width: 8px;
            height: 18px;
            background: #ffcc00;
            border-radius: 2px;
            border: 1px solid #b38f00;
        }

        .bullet.spent {
            background: #444;
            border-color: #222;
            opacity: 0.3;
        }

        /* History */
        .history-bar {
            position: absolute;
            top: 55px;
            left: 10px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }

        .history-tag {
            background: rgba(22, 26, 38, 0.85);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        .history-tag.win { color: #4cd964; }
        .history-tag.loss { color: #ff3b30; }

        /* Notification overlay */
        .overlay-msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
            text-align: center;
            width: 90%;
        }

        .overlay-msg.show {
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="top-bar">
        <div class="stat-box">
            <div class="stat-label">Баланс</div>
            <div class="stat-value" id="balance-val">$1000.00</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Текущий куш</div>
            <div class="stat-value" id="win-val" style="color:#ffcc00;">$0.00</div>
        </div>
    </div>

    <div class="history-bar" id="history-bar"></div>
    <div class="overlay-msg" id="overlay-msg">СДЕЛАЙ СТАВКУ!</div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls-panel">
        <div class="control-group">
            <span class="control-label">Ставка</span>
            <div class="bet-input-wrapper">
                <button class="btn-small" id="btn-min">MIN</button>
                <input type="number" id="bet-input" value="10" min="1">
                <button class="btn-small" id="btn-max">MAX</button>
                <button class="btn-small" id="btn-x2">x2</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Риск</span>
            <div class="risk-selector">
                <button class="risk-btn" data-risk="low">Low</button>
                <button class="risk-btn active" data-risk="med">Med</button>
                <button class="risk-btn" data-risk="high">High</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Патроны</span>
            <div class="ammo-container" id="ammo-box"></div>
        </div>

        <button class="btn-primary" id="btn-start">СТАРТ</button>
        <button class="btn-primary btn-cashout" id="btn-cashout">ЗАБРАТЬ</button>
    </div>
</div>

<script>
    // --- ЗВУКОВОЙ ДВИЖОК ---
    class SoundEngine {
        constructor() { this.ctx = null; }
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        playShot() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.12, this.ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.02));
            const src = this.ctx.createBufferSource();
            src.buffer = buf;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(1.0, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(now);
        }
        playHit() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(250, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        }
        playWin() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(f, now + i * 0.08);
                gain.gain.setValueAtTime(0.3, now + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + i * 0.08);
                osc.stop(now + i * 0.08 + 0.2);
            });
        }
    }

    const sound = new SoundEngine();

    // --- СОСТОЯНИЕ ИГРЫ ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let balance = 1000;
    let currentBet = 10;
    let selectedRisk = 'med';
    let gameState = 'idle'; // idle, playing
    let maxAmmo = 5;
    let currentAmmo = 5;
    let roundWin = 0;
    let hitsInRound = 0;

    const balanceEl = document.getElementById('balance-val');
    const winEl = document.getElementById('win-val');
    const betInput = document.getElementById('bet-input');
    const btnStart = document.getElementById('btn-start');
    const btnCashout = document.getElementById('btn-cashout');
    const overlayMsg = document.getElementById('overlay-msg');
    const ammoBox = document.getElementById('ammo-box');
    const historyBar = document.getElementById('history-bar');

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let windmillAngle = 0;
    let chickens = [];
    let particles = [];
    let floatingTexts = [];
    let muzzleFlashes = [];

    const MULTIPLIERS = [
        { mult: 1.2, bg: '#4cd964', scale: 0.85, speed: 1.6 },
        { mult: 1.5, bg: '#34a853', scale: 0.8, speed: 1.9 },
        { mult: 2.0, bg: '#007aff', scale: 0.75, speed: 2.2 },
        { mult: 5.0, bg: '#5856d6', scale: 0.7, speed: 2.7 },
        { mult: 12.0, bg: '#ff9500', scale: 0.65, speed: 3.2 },
        { mult: 48.0, bg: '#ff3b30', scale: 0.55, speed: 4.0 }
    ];

    // --- КРАСИВАЯ МУЛЬТЯШНАЯ КУРИЦА ---
    class Chicken {
        constructor(laneIndex) {
            this.lane = laneIndex; // Полоса высоты (чтобы не летали в куче)
            this.reset(true);
        }

        reset(initial = false) {
            const rand = Math.random();
            let type = MULTIPLIERS[0];
            if (rand > 0.35) type = MULTIPLIERS[1];
            if (rand > 0.60) type = MULTIPLIERS[2];
            if (rand > 0.80) type = MULTIPLIERS[3];
            if (rand > 0.92) type = MULTIPLIERS[4];
            if (rand > 0.98) type = MULTIPLIERS[5];

            this.mult = type.mult;
            this.bg = type.bg;
            this.scale = type.scale;
            this.speed = type.speed * (selectedRisk === 'high' ? 1.25 : selectedRisk === 'low' ? 0.85 : 1.0);
            
            this.dir = Math.random() > 0.5 ? 1 : -1; // Направление движения
            
            const laneY = canvas.height * 0.15 + (this.lane * (canvas.height * 0.1));
            this.y = laneY + (Math.random() * 20 - 10);
            this.x = initial 
                ? Math.random() * (canvas.width - 100) + 50 
                : (this.dir === 1 ? -80 - Math.random() * 100 : canvas.width + 80 + Math.random() * 100);

            this.time = Math.random() * 100;
            this.wingPhase = Math.random() * Math.PI * 2;
            this.alive = true;
        }

        update() {
            this.x += this.speed * this.dir;
            this.time += 0.04;
            this.wingPhase += 0.15;

            // Небольшое качание по вертикали
            this.currentY = this.y + Math.sin(this.time) * 10;

            // Выход за границы
            if (this.dir === 1 && this.x > canvas.width + 100) {
                this.reset(false);
            } else if (this.dir === -1 && this.x < -100) {
                this.reset(false);
            }
        }

        draw(ctx) {
            if (!this.alive) return;

            ctx.save();
            ctx.translate(this.x, this.currentY);
            if (this.dir === -1) {
                ctx.scale(-1, 1); // Отражение по горизонтали
            }
            ctx.scale(this.scale, this.scale);

            // --- ТЕЛО (Коричневое с градиентом) ---
            const bodyGrad = ctx.createRadialGradient(-10, -5, 5, 0, 0, 45);
            bodyGrad.addColorStop(0, '#b86b32');
            bodyGrad.addColorStop(1, '#6e3814');

            ctx.fillStyle = bodyGrad;
            ctx.strokeStyle = '#2d1405';
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(-35, -10);
            ctx.bezierCurveTo(-45, -30, -10, -45, 15, -30); // Шея
            ctx.bezierCurveTo(40, -15, 45, 20, 15, 35); // Живот
            ctx.bezierCurveTo(-15, 45, -45, 25, -35, -10); // Спина
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // --- ХВОСТ ---
            ctx.fillStyle = '#52270c';
            ctx.beginPath();
            ctx.moveTo(-35, 0);
            ctx.quadraticCurveTo(-55, -20, -50, -35);
            ctx.quadraticCurveTo(-35, -25, -30, -10);
            ctx.fill();
            ctx.stroke();

            // --- ЛАПЫ ---
            ctx.fillStyle = '#e67e22';
            ctx.strokeStyle = '#2d1405';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.rect(-10, 30, 6, 18);
            ctx.rect(5, 30, 6, 18);
            ctx.fill();
            ctx.stroke();

            // --- КРЫЛО (Анимированное) ---
            const wingY = Math.sin(this.wingPhase) * 12;
            ctx.save();
            ctx.translate(-5, -5);
            ctx.rotate(wingY * 0.05);
            ctx.fillStyle = '#9c5423';
            ctx.beginPath();
            ctx.ellipse(-5, wingY, 22, 14, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            // --- ГОЛОВА ---
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.arc(22, -35, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // --- ГРЕБЕШОК (Ярко-красный) ---
            ctx.fillStyle = '#e74c3c';
            ctx.strokeStyle = '#2d1405';
            ctx.beginPath();
            ctx.arc(15, -52, 9, 0, Math.PI * 2);
            ctx.arc(25, -56, 11, 0, Math.PI * 2);
            ctx.arc(36, -50, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // --- БОРОДКА ---
            ctx.beginPath();
            ctx.arc(34, -18, 7, 0, Math.PI * 2);
            ctx.arc(28, -15, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // --- КЛЮВ ---
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.moveTo(35, -35);
            ctx.lineTo(58, -28);
            ctx.lineTo(36, -20);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // --- ОГРОМНЫЕ БЕШЕНЫЕ ГЛАЗА ---
            // Белок 1
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(18, -38, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Белок 2
            ctx.beginPath();
            ctx.arc(32, -38, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Зрачки (косящие)
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(20, -37, 4, 0, Math.PI * 2);
            ctx.arc(30, -37, 4, 0, Math.PI * 2);
            ctx.fill();

            // Блик
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(21, -39, 1.5, 0, Math.PI * 2);
            ctx.arc(31, -39, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // --- ТАБЛИЧКА МНОЖИТЕЛЯ ---
            ctx.save();
            ctx.translate(this.x, this.currentY + 32 * this.scale);
            
            ctx.fillStyle = this.bg;
            ctx.beginPath();
            ctx.roundRect(-22, -9, 44, 18, 5);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('x' + this.mult, 0, 1);

            ctx.restore();
        }

        isHit(px, py) {
            const dx = this.x - px;
            const dy = this.currentY - py;
            return Math.sqrt(dx * dx + dy * dy) < 40 * this.scale;
        }
    }

    // Инициализация куриц по полосам
    for (let i = 0; i < 5; i++) {
        chickens.push(new Chicken(i));
    }

    // --- ЭФФЕКТЫ ---
    function createFeatherExplosion(x, y) {
        for (let i = 0; i < 20; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                size: Math.random() * 8 + 4,
                color: Math.random() > 0.4 ? '#6e3814' : (Math.random() > 0.5 ? '#e74c3c' : '#ffffff'),
                life: 1.0,
                rot: Math.random() * Math.PI * 2
            });
        }
    }

    function addMuzzleFlash(x, y) {
        muzzleFlashes.push({ x: x, y: y, radius: 35, life: 1.0 });
    }

    function addFloatingText(text, x, y, color = '#ffcc00') {
        floatingTexts.push({ text: text, x: x, y: y, vy: -2, alpha: 1, color: color });
    }

    function updateEffects() {
        // Перья
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // Гравитация
            p.life -= 0.03;

            if (p.life <= 0) particles.splice(i, 1);
            else {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size, p.size * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Вспышки
        for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
            let f = muzzleFlashes[i];
            f.life -= 0.15;
            if (f.life <= 0) muzzleFlashes.splice(i, 1);
            else {
                ctx.save();
                ctx.globalAlpha = f.life;
                ctx.fillStyle = '#fff5a8';
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Всплывающий текст
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y += ft.vy;
            ft.alpha -= 0.02;

            if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            else {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = '900 22px sans-serif';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 4;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }
        }
    }

    function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;

        // Небо
        const skyGradient = ctx.createLinearGradient(0, 0, 0, h * 0.6);
        skyGradient.addColorStop(0, '#74b9ff');
        skyGradient.addColorStop(1, '#a1c4fd');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, w, h);

        // Горы
        ctx.fillStyle = '#9cb8c1';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.6);
        ctx.lineTo(w * 0.25, h * 0.42);
        ctx.lineTo(w * 0.55, h * 0.6);
        ctx.lineTo(w * 0.8, h * 0.48);
        ctx.lineTo(w, h * 0.6);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.fill();

        // Поле
        ctx.fillStyle = '#6ab04c';
        ctx.fillRect(0, h * 0.58, w, h * 0.42);

        // Ветряк
        drawWindmill(w * 0.88, h * 0.48);
    }

    function drawWindmill(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = '#7a5230';
        ctx.fillRect(-8, 0, 16, 50);
        
        windmillAngle += 0.01;
        ctx.rotate(windmillAngle);
        ctx.fillStyle = '#f5f6fa';
        for (let i = 0; i < 4; i++) {
            ctx.rotate(Math.PI / 2);
            ctx.fillRect(-2, 0, 4, 30);
        }
        ctx.restore();
    }

    function updateAmmoUI() {
        ammoBox.innerHTML = '';
        for (let i = 0; i < maxAmmo; i++) {
            const b = document.createElement('div');
            b.className = 'bullet' + (i >= currentAmmo ? ' spent' : '');
            ammoBox.appendChild(b);
        }
    }
    updateAmmoUI();

    function initRound() {
        if (balance < currentBet) {
            showOverlay('НЕДОСТАТОЧНО СРЕДСТВ');
            return;
        }

        sound.init();
        balance -= currentBet;
        roundWin = 0;
        hitsInRound = 0;
        currentAmmo = maxAmmo;

        balanceEl.innerText = `$${balance.toFixed(2)}`;
        winEl.innerText = `$0.00`;
        updateAmmoUI();

        gameState = 'playing';
        btnStart.style.display = 'none';
        btnCashout.style.display = 'block';
        showOverlay('СТРЕЛЯЙ!');
    }

    function cashout() {
        if (gameState !== 'playing') return;

        gameState = 'idle';
        btnStart.style.display = 'block';
        btnCashout.style.display = 'none';

        if (roundWin > 0) {
            balance += roundWin;
            balanceEl.innerText = `$${balance.toFixed(2)}`;
            sound.playWin();
            showOverlay(`ВЫИГРЫШ: $${roundWin.toFixed(2)}`);
            addHistoryTag(roundWin / currentBet, true);
        } else {
            showOverlay('БЕЗ ВЫИГРЫША');
            addHistoryTag(0, false);
        }
    }

    function endRoundLoss() {
        gameState = 'idle';
        btnStart.style.display = 'block';
        btnCashout.style.display = 'none';

        if (roundWin > 0) {
            balance += roundWin;
            balanceEl.innerText = `$${balance.toFixed(2)}`;
            sound.playWin();
            showOverlay(`РАУНД ОКОНЧЕН: $${roundWin.toFixed(2)}`);
            addHistoryTag(roundWin / currentBet, true);
        } else {
            showOverlay('ПРОМАХ!');
            addHistoryTag(0, false);
        }
    }

    function showOverlay(msg) {
        overlayMsg.innerText = msg;
        overlayMsg.classList.add('show');
        setTimeout(() => overlayMsg.classList.remove('show'), 1200);
    }

    function addHistoryTag(mult, isWin) {
        const tag = document.createElement('div');
        tag.className = `history-tag ${isWin ? 'win' : 'loss'}`;
        tag.innerText = isWin ? `x${mult.toFixed(1)}` : '0.0x';
        historyBar.prepend(tag);
        if (historyBar.children.length > 6) historyBar.removeChild(historyBar.lastChild);
    }

    // --- ВЫСТРЕЛ ---
    function handleShoot(clientX, clientY) {
        if (gameState !== 'playing') return;

        const rect = canvas.getBoundingClientRect();
        const mouseX = clientX - rect.left;
        const mouseY = clientY - rect.top;

        if (currentAmmo <= 0) return;

        currentAmmo--;
        updateAmmoUI();
        sound.playShot();
        addMuzzleFlash(mouseX, mouseY);

        let hit = false;
        for (let chicken of chickens) {
            if (chicken.alive && chicken.isHit(mouseX, mouseY)) {
                chicken.alive = false;
                hit = true;
                hitsInRound++;
                sound.playHit();
                createFeatherExplosion(chicken.x, chicken.currentY);

                const winAmount = currentBet * chicken.mult;
                roundWin += winAmount;

                winEl.innerText = `$${roundWin.toFixed(2)}`;
                addFloatingText(`+$${winAmount.toFixed(1)} (x${chicken.mult})`, chicken.x, chicken.currentY);

                // Респавн курицы спустя время
                setTimeout(() => {
                    chicken.reset(false);
                }, 600);
                break;
            }
        }

        if (!hit) {
            addFloatingText('МИМО!', mouseX, mouseY, '#ff3b30');
        }

        // Если кончились патроны — раунд закончен
        if (currentAmmo <= 0) {
            setTimeout(endRoundLoss, 600);
        }
    }

    canvas.addEventListener('click', (e) => handleShoot(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
            handleShoot(e.touches[0].clientX, e.touches[0].clientY);
        }
    });

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBackground();

        for (let chicken of chickens) {
            chicken.update();
            chicken.draw(ctx);
        }

        updateEffects();

        requestAnimationFrame(gameLoop);
    }

    btnStart.addEventListener('click', initRound);
    btnCashout.addEventListener('click', cashout);

    betInput.addEventListener('change', () => {
        let val = parseFloat(betInput.value);
        if (isNaN(val) || val < 1) val = 1;
        if (val > balance) val = balance;
        currentBet = val;
        betInput.value = currentBet;
    });

    document.getElementById('btn-min').addEventListener('click', () => { currentBet = 1; betInput.value = 1; });
    document.getElementById('btn-max').addEventListener('click', () => { currentBet = Math.floor(balance); betInput.value = currentBet; });
    document.getElementById('btn-x2').addEventListener('click', () => { currentBet = Math.min(Math.floor(balance), currentBet * 2); betInput.value = currentBet; });

    document.querySelectorAll('.risk-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.risk-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            selectedRisk = e.target.dataset.risk;
        });
    });

    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
