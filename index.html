<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken Shoot InOut Ultra 4K</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #08090d;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 960px;
            max-height: 680px;
            background: #11131a;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.2);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* --- ГЛАВНОЕ МЕНЮ --- */
        .main-menu {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #1e2436 0%, #0a0c12 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .main-menu.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .logo-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #ffd000 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 25px rgba(255, 140, 0, 0.4);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .logo-subtitle {
            font-size: 14px;
            color: #8e95a5;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .menu-btn {
            background: linear-gradient(180deg, #ff9500 0%, #d97700 100%);
            border: none;
            color: #fff;
            padding: 16px 48px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 149, 0, 0.4);
            text-transform: uppercase;
            transition: all 0.2s;
            margin-bottom: 12px;
            width: 240px;
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 149, 0, 0.6);
        }

        .rules-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            max-width: 380px;
            font-size: 13px;
            color: #a0a7b5;
            line-height: 1.5;
            margin-top: 15px;
        }

        /* Top Bar Info */
        .top-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .stat-box {
            background: rgba(12, 14, 20, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .stat-label {
            color: #7b8190;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stat-value {
            color: #4cd964;
            font-size: 18px;
            font-weight: 800;
        }

        /* Bottom Controls */
        .controls-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(12, 14, 20, 0.92);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-label {
            font-size: 10px;
            color: #7b8190;
            text-transform: uppercase;
            font-weight: 700;
        }

        .bet-input-wrapper {
            display: flex;
            align-items: center;
            background: #1c202c;
            border: 1px solid #2d3345;
            border-radius: 8px;
            padding: 3px;
        }

        .bet-input-wrapper input {
            background: transparent;
            border: none;
            color: #fff;
            width: 60px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            outline: none;
        }

        .btn-small {
            background: #282e3f;
            border: none;
            color: #9ba1b0;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            transition: background 0.15s;
        }

        .btn-small:hover { background: #363d52; color: #fff; }

        .risk-selector {
            display: flex;
            background: #1c202c;
            padding: 3px;
            border-radius: 8px;
            gap: 3px;
        }

        .risk-btn {
            background: transparent;
            border: none;
            color: #7b8190;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .risk-btn.active {
            background: #ff9500;
            color: #fff;
            box-shadow: 0 2px 8px rgba(255, 149, 0, 0.4);
        }

        .btn-primary {
            background: linear-gradient(180deg, #ff9500 0%, #d97700 100%);
            border: none;
            color: #fff;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 149, 0, 0.4);
            text-transform: uppercase;
            flex-grow: 1;
            max-width: 140px;
            transition: all 0.15s;
        }

        .btn-cashout {
            background: linear-gradient(180deg, #34c759 0%, #248a3d 100%);
            box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4);
            display: none;
        }

        .btn-primary:disabled {
            background: #3a3f50;
            box-shadow: none;
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Ammo Bar */
        .ammo-container {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.4);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .bullet {
            width: 9px;
            height: 20px;
            background: linear-gradient(180deg, #ffe066 0%, #f39c12 100%);
            border-radius: 2px 2px 1px 1px;
            border: 1px solid #b37d00;
            box-shadow: 0 0 6px rgba(243, 156, 18, 0.4);
            transition: all 0.2s;
        }

        .bullet.spent {
            background: #333642;
            border-color: #1f222b;
            box-shadow: none;
            opacity: 0.25;
        }

        /* History */
        .history-bar {
            position: absolute;
            top: 65px;
            left: 12px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }

        .history-tag {
            background: rgba(12, 14, 20, 0.85);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .history-tag.win { color: #4cd964; border-color: rgba(76, 217, 100, 0.3); }
        .history-tag.loss { color: #ff3b30; border-color: rgba(255, 59, 48, 0.3); }

        /* Notification overlay */
        .overlay-msg {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 16px rgba(0,0,0,0.9), 0 0 20px rgba(255, 149, 0, 0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 20;
            text-align: center;
            width: 90%;
        }

        .overlay-msg.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.05);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- ГЛАВНОЕ МЕНЮ -->
    <div class="main-menu" id="main-menu">
        <div class="logo-title">Chicken Shoot</div>
        <div class="logo-subtitle">InOut Pro 4K Edition</div>
        
        <button class="menu-btn" id="btn-play-game">ИГРАТЬ</button>

        <div class="rules-card">
            <b>Правила игры:</b><br>
            • У вас 3 патрона на раунд.<br>
            • Каждый точный выстрел приносит множитель.<br>
            • Заберите куш в любой момент или рискуйте дальше!<br>
            • Промах сжигает патрон.
        </div>
    </div>

    <!-- ТОП БАР ИНФО -->
    <div class="top-bar">
        <div class="stat-box">
            <div class="stat-label">Баланс</div>
            <div class="stat-value" id="balance-val">$100.00</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Текущий выигрыш</div>
            <div class="stat-value" id="win-val" style="color:#ffcc00;">$0.00</div>
        </div>
    </div>

    <div class="history-bar" id="history-bar"></div>
    <div class="overlay-msg" id="overlay-msg">ГОТОВ?</div>

    <canvas id="gameCanvas"></canvas>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div class="controls-panel">
        <div class="control-group">
            <span class="control-label">Ставка</span>
            <div class="bet-input-wrapper">
                <button class="btn-small" id="btn-min">MIN</button>
                <input type="number" id="bet-input" value="5" min="1">
                <button class="btn-small" id="btn-max">MAX</button>
                <button class="btn-small" id="btn-x2">x2</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Риск</span>
            <div class="risk-selector">
                <button class="risk-btn" data-risk="low">Low</button>
                <button class="risk-btn active" data-risk="med">Med</button>
                <button class="risk-btn" data-risk="high">High</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Патроны</span>
            <div class="ammo-container" id="ammo-box"></div>
        </div>

        <button class="btn-primary" id="btn-start">СТАРТ</button>
        <button class="btn-primary btn-cashout" id="btn-cashout">ЗАБРАТЬ</button>
    </div>
</div>

<script>
    // --- ЗВУКОВОЙ ДВИЖОК (Web Audio API) ---
    class SoundEngine {
        constructor() { this.ctx = null; }
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        playShot() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.15, this.ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.02));
            const src = this.ctx.createBufferSource();
            src.buffer = buf;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(1.0, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(now);
        }
        playHit() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
        }
        playWin() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            [523, 659, 783, 1046].forEach((f, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f, now + i * 0.07);
                gain.gain.setValueAtTime(0.3, now + i * 0.07);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.07 + 0.18);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + i * 0.07);
                osc.stop(now + i * 0.07 + 0.18);
            });
        }
    }

    const sound = new SoundEngine();

    // --- НАСТРОЙКИ СТАТУСА И ГРАФИКИ ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let balance = 100;
    let currentBet = 5;
    let selectedRisk = 'med';
    let gameState = 'menu'; // menu, idle, playing
    let maxAmmo = 3;
    let currentAmmo = 3;
    let roundWin = 0;
    let totalMult = 1.0;

    const balanceEl = document.getElementById('balance-val');
    const winEl = document.getElementById('win-val');
    const betInput = document.getElementById('bet-input');
    const btnStart = document.getElementById('btn-start');
    const btnCashout = document.getElementById('btn-cashout');
    const overlayMsg = document.getElementById('overlay-msg');
    const ammoBox = document.getElementById('ammo-box');
    const historyBar = document.getElementById('history-bar');
    const mainMenu = document.getElementById('main-menu');

    // 4K HiDPI Canvas Scaling
    let dpr = window.devicePixelRatio || 1;
    function resizeCanvas() {
        dpr = window.devicePixelRatio || 1;
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let windmillAngle = 0;
    let chickens = [];
    let particles = [];
    let floatingTexts = [];
    let muzzleFlashes = [];

    // Множители и их математический риск
    const MULTIPLIERS = [
        { mult: 1.2, bg: '#4cd964', scale: 0.8, speed: 2.2, chance: 0.50 },
        { mult: 1.5, bg: '#34a853', scale: 0.75, speed: 2.6, chance: 0.30 },
        { mult: 2.0, bg: '#007aff', scale: 0.7, speed: 3.0, chance: 0.12 },
        { mult: 3.5, bg: '#5856d6', scale: 0.65, speed: 3.6, chance: 0.05 },
        { mult: 8.0, bg: '#ff9500', scale: 0.6, speed: 4.2, chance: 0.02 },
        { mult: 25.0, bg: '#ff3b30', scale: 0.5, speed: 5.0, chance: 0.01 }
    ];

    // --- КУРИЦА ЕДИНЫМ ВЕКТОРНЫМ СЛОЕМ ---
    class Chicken {
        constructor(laneIndex) {
            this.lane = laneIndex;
            this.reset(true);
        }

        reset(initial = false) {
            const rand = Math.random();
            let type = MULTIPLIERS[0];
            let acc = 0;
            for (let m of MULTIPLIERS) {
                acc += m.chance;
                if (rand <= acc) { type = m; break; }
            }

            this.mult = type.mult;
            this.bg = type.bg;
            this.scale = type.scale;
            this.speed = type.speed * (selectedRisk === 'high' ? 1.3 : selectedRisk === 'low' ? 0.8 : 1.0);
            
            this.dir = Math.random() > 0.5 ? 1 : -1;
            
            const renderW = canvas.width / dpr;
            const renderH = canvas.height / dpr;
            const laneY = renderH * 0.18 + (this.lane * (renderH * 0.09));
            
            this.y = laneY;
            this.x = initial 
                ? Math.random() * (renderW - 120) + 60 
                : (this.dir === 1 ? -90 - Math.random() * 120 : renderW + 90 + Math.random() * 120);

            this.time = Math.random() * 100;
            this.wingPhase = Math.random() * Math.PI * 2;
            this.alive = true;
        }

        update() {
            const renderW = canvas.width / dpr;
            this.x += this.speed * this.dir;
            this.time += 0.04;
            this.wingPhase += 0.18;

            this.currentY = this.y + Math.sin(this.time) * 8;

            if (this.dir === 1 && this.x > renderW + 120) this.reset(false);
            else if (this.dir === -1 && this.x < -120) this.reset(false);
        }

        draw(ctx) {
            if (!this.alive) return;

            ctx.save();
            ctx.translate(this.x, this.currentY);
            if (this.dir === -1) ctx.scale(-1, 1);
            ctx.scale(this.scale, this.scale);

            // КРЫЛО (Заднее)
            ctx.fillStyle = '#6e3814';
            ctx.beginPath();
            ctx.ellipse(-15, -12, 14, 8, -0.4, 0, Math.PI * 2);
            ctx.fill();

            // ТЕЛО
            ctx.fillStyle = '#9c5423';
            ctx.beginPath();
            ctx.arc(0, 0, 26, 0, Math.PI * 2);
            ctx.fill();

            // ХВОСТ
            ctx.fillStyle = '#52270c';
            ctx.beginPath();
            ctx.moveTo(-20, -5);
            ctx.lineTo(-38, -22);
            ctx.lineTo(-28, 5);
            ctx.closePath();
            ctx.fill();

            // ГОЛОВА
            ctx.fillStyle = '#9c5423';
            ctx.beginPath();
            ctx.arc(18, -20, 16, 0, Math.PI * 2);
            ctx.fill();

            // ГРЕБЕШОК
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(12, -34, 6, 0, Math.PI * 2);
            ctx.arc(20, -37, 7, 0, Math.PI * 2);
            ctx.arc(28, -32, 5, 0, Math.PI * 2);
            ctx.fill();

            // БОРОДКА
            ctx.beginPath();
            ctx.arc(28, -4, 5, 0, Math.PI * 2);
            ctx.fill();

            // КЛЮВ
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.moveTo(30, -22);
            ctx.lineTo(46, -17);
            ctx.lineTo(31, -11);
            ctx.closePath();
            ctx.fill();

            // КРЫЛО (Переднее анимированное)
            const wingAngle = Math.sin(this.wingPhase) * 0.3;
            ctx.save();
            ctx.translate(-2, 0);
            ctx.rotate(wingAngle);
            ctx.fillStyle = '#b86b32';
            ctx.beginPath();
            ctx.ellipse(-4, 2, 16, 10, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // ГЛАЗА (Сумасшедшие крупные)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(16, -24, 8, 0, Math.PI * 2);
            ctx.arc(27, -24, 9, 0, Math.PI * 2);
            ctx.fill();

            // Зрачки
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(18, -23, 3, 0, Math.PI * 2);
            ctx.arc(28, -23, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // МНОЖИТЕЛЬ
            ctx.save();
            ctx.translate(this.x, this.currentY + 34 * this.scale);
            
            ctx.fillStyle = this.bg;
            ctx.beginPath();
            ctx.roundRect(-22, -9, 44, 18, 5);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('x' + this.mult, 0, 1);

            ctx.restore();
        }

        isHit(px, py) {
            const dx = this.x - px;
            const dy = this.currentY - py;
            return Math.sqrt(dx * dx + dy * dy) < 35 * this.scale;
        }
    }

    // Постоянные полосы полёта
    for (let i = 0; i < 5; i++) {
        chickens.push(new Chicken(i));
    }

    // --- ФОН В 4K ---
    function drawBackground() {
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;

        // Небо
        const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.65);
        skyGrad.addColorStop(0, '#5fa8f5');
        skyGrad.addColorStop(1, '#9ecaff');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, h);

        // Горы
        ctx.fillStyle = '#8395a7';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.65);
        ctx.lineTo(w * 0.2, h * 0.45);
        ctx.lineTo(w * 0.45, h * 0.65);
        ctx.lineTo(w * 0.75, h * 0.48);
        ctx.lineTo(w, h * 0.65);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.fill();

        // Поле
        ctx.fillStyle = '#54a0ff';
        ctx.fillStyle = '#10ac84';
        ctx.fillRect(0, h * 0.62, w, h * 0.38);

        // Ветряк
        drawWindmill(w * 0.88, h * 0.52);
    }

    function drawWindmill(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = '#576574';
        ctx.fillRect(-6, 0, 12, 45);
        
        windmillAngle += 0.015;
        ctx.rotate(windmillAngle);
        ctx.fillStyle = '#f5f6fa';
        for (let i = 0; i < 4; i++) {
            ctx.rotate(Math.PI / 2);
            ctx.fillRect(-2, 0, 4, 28);
        }
        ctx.restore();
    }

    function updateAmmoUI() {
        ammoBox.innerHTML = '';
        for (let i = 0; i < maxAmmo; i++) {
            const b = document.createElement('div');
            b.className = 'bullet' + (i >= currentAmmo ? ' spent' : '');
            ammoBox.appendChild(b);
        }
    }
    updateAmmoUI();

    function initRound() {
        if (balance < currentBet) {
            showOverlay('НЕДОСТАТОЧНО СРЕДСТВ');
            return;
        }

        sound.init();
        balance -= currentBet;
        roundWin = 0;
        totalMult = 1.0;
        currentAmmo = maxAmmo;

        balanceEl.innerText = `$${balance.toFixed(2)}`;
        winEl.innerText = `$0.00`;
        updateAmmoUI();

        gameState = 'playing';
        btnStart.style.display = 'none';
        btnCashout.style.display = 'block';
        showOverlay('СТРЕЛЯЙ!');
    }

    function cashout() {
        if (gameState !== 'playing') return;

        gameState = 'idle';
        btnStart.style.display = 'block';
        btnCashout.style.display = 'none';

        if (roundWin > 0) {
            balance += roundWin;
            balanceEl.innerText = `$${balance.toFixed(2)}`;
            sound.playWin();
            showOverlay(`ВЫИГРЫШ: $${roundWin.toFixed(2)}`);
            addHistoryTag(roundWin / currentBet, true);
        }
    }

    function endRoundLoss() {
        gameState = 'idle';
        btnStart.style.display = 'block';
        btnCashout.style.display = 'none';

        if (roundWin > 0) {
            balance += roundWin;
            balanceEl.innerText = `$${balance.toFixed(2)}`;
            sound.playWin();
            showOverlay(`ЗАБРАНО: $${roundWin.toFixed(2)}`);
            addHistoryTag(roundWin / currentBet, true);
        } else {
            showOverlay('ПРОМАХ!');
            addHistoryTag(0, false);
        }
    }

    function showOverlay(msg) {
        overlayMsg.innerText = msg;
        overlayMsg.classList.add('show');
        setTimeout(() => overlayMsg.classList.remove('show'), 1200);
    }

    function addHistoryTag(mult, isWin) {
        const tag = document.createElement('div');
        tag.className = `history-tag ${isWin ? 'win' : 'loss'}`;
        tag.innerText = isWin ? `x${mult.toFixed(1)}` : '0.0x';
        historyBar.prepend(tag);
        if (historyBar.children.length > 6) historyBar.removeChild(historyBar.lastChild);
    }

    // --- ОБРАБОТКА ВЫСТРЕЛА ---
    function handleShoot(clientX, clientY) {
        if (gameState !== 'playing') return;

        const rect = canvas.getBoundingClientRect();
        const mouseX = clientX - rect.left;
        const mouseY = clientY - rect.top;

        if (currentAmmo <= 0) return;

        currentAmmo--;
        updateAmmoUI();
        sound.playShot();

        let hit = false;
        for (let chicken of chickens) {
            if (chicken.alive && chicken.isHit(mouseX, mouseY)) {
                chicken.alive = false;
                hit = true;
                sound.playHit();

                // Расчет кумулятивного множителя
                totalMult *= chicken.mult;
                roundWin = currentBet * totalMult;

                winEl.innerText = `$${roundWin.toFixed(2)}`;

                setTimeout(() => chicken.reset(false), 500);
                break;
            }
        }

        if (currentAmmo <= 0) {
            setTimeout(endRoundLoss, 500);
        }
    }

    canvas.addEventListener('click', (e) => handleShoot(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) handleShoot(e.touches[0].clientX, e.touches[0].clientY);
    });

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBackground();

        for (let chicken of chickens) {
            chicken.update();
            chicken.draw(ctx);
        }

        requestAnimationFrame(gameLoop);
    }

    document.getElementById('btn-play-game').addEventListener('click', () => {
        mainMenu.classList.add('hidden');
        gameState = 'idle';
    });

    btnStart.addEventListener('click', initRound);
    btnCashout.addEventListener('click', cashout);

    betInput.addEventListener('change', () => {
        let val = parseFloat(betInput.value);
        if (isNaN(val) || val < 1) val = 1;
        if (val > balance) val = balance;
        currentBet = val;
        betInput.value = currentBet;
    });

    document.getElementById('btn-min').addEventListener('click', () => { currentBet = 1; betInput.value = 1; });
    document.getElementById('btn-max').addEventListener('click', () => { currentBet = Math.floor(balance); betInput.value = currentBet; });
    document.getElementById('btn-x2').addEventListener('click', () => { currentBet = Math.min(Math.floor(balance), currentBet * 2); betInput.value = currentBet; });

    document.querySelectorAll('.risk-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.risk-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            selectedRisk = e.target.dataset.risk;
        });
    });

    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
