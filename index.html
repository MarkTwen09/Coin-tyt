<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kombat Packs — симулятор наборов</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0a0b;--bg2:#1a1012;--line:#3a2326;--blood:#c1121f;--ember:#ff5a1f;--gold:#e8b64a;--bone:#efe6d8;--mute:#9b8b86;--silver:#b9c2cc;--bronze:#c28a52;--dia:#52d6ff;--epic:#b65cff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e0a0b}}
:root[data-theme="dark"]{--bg:#0e0a0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(120% 60% at 50% 0,#2a0f12 0,var(--bg) 60%) var(--bg);color:var(--bone);font:400 15px/1.4 Rubik,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,.rz{font-family:"Russo One",Impact,sans-serif;font-weight:400;letter-spacing:.02em}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
header h1{font-size:20px;margin:0;color:var(--bone)}
header h1 span{color:var(--blood)}
.cur{display:flex;gap:8px}
.cur div{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.k{background:radial-gradient(circle at 35% 30%,#fff2a8,#e8b64a 50%,#8a5a0c);box-shadow:inset 0 0 0 2px #8a5a0c}.s{width:11px;height:14px;border-radius:50% 50% 45% 45%/65% 65% 35% 35%;background:radial-gradient(circle at 50% 35%,#fff,#7fe9ff 40%,#1b8fb8);box-shadow:0 0 8px #52d6ff;animation:fk 1.6s ease-in-out infinite}@keyframes fk{50%{transform:translateY(-1.5px) scale(1.12);box-shadow:0 0 14px #52d6ff}}

nav button{flex:1;background:none;border:0;color:var(--mute);padding:11px;font:600 14px Rubik;cursor:pointer}
nav button.on{background:var(--blood);color:#fff}
main{padding:4px 16px 90px;max-width:560px;margin:auto}
.pack{position:relative;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--bg2),#120b0c);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;overflow:hidden}
.pk{flex:0 0 74px;height:104px;border-radius:8px;position:relative;display:grid;place-items:center;box-shadow:0 6px 18px #000a,inset 0 0 0 2px #fff3}
.pk svg{width:44px;height:44px}
.pk::after{content:"";position:absolute;inset:0;border-radius:8px;background:linear-gradient(115deg,transparent 35%,#fff4 50%,transparent 65%)}
.pinfo{flex:1;min-width:0}
.pinfo h2{margin:0 0 2px;font-size:17px}
.pinfo p{margin:0 0 8px;color:var(--mute);font-size:12.5px}
.odds{font-size:11px;color:var(--mute);margin-bottom:8px}
.buy{border:0;border-radius:9px;padding:10px 14px;font:600 14px Rubik;color:#1a0d00;background:linear-gradient(var(--gold),#c98f27);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.buy.sv{background:linear-gradient(#7fe3ff,#2aa6d4)}
.buy.fr{background:linear-gradient(#ff7a3d,#c1121f);color:#fff}
.buy:disabled{opacity:.4}
.buy:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{color:var(--mute);font-size:13px;margin:10px 0}
/* card */
.card{position:relative;aspect-ratio:3/4.3;border-radius:10px;overflow:hidden;border:2px solid var(--rc);background:#140c0d;box-shadow:0 0 14px -4px var(--rc)}
.card .art{position:absolute;inset:0}
.card .art svg{width:100%;height:100%;display:block}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:16px 4px 5px;background:linear-gradient(transparent,#000d 55%);text-align:center;font:400 clamp(9px,2.8vw,13px)/1.1 "Russo One",Impact,sans-serif;text-transform:none}
.card .rr{position:absolute;top:4px;left:4px;font:600 9px Rubik;background:var(--rc);color:#10070a;border-radius:4px;padding:1px 5px}
.card .pw{position:absolute;top:4px;right:5px;font:400 11px "Russo One";color:var(--bone);text-shadow:0 1px 3px #000}
.card .ct{position:absolute;top:22px;right:4px;background:var(--blood);border-radius:9px;font:600 10px Rubik;padding:0 6px}
.card.cimg.cimg{border:0;background:none;box-shadow:none;overflow:visible;animation:none}.card.cimg img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 7px var(--rc))}.card.cimg.cimg::after{display:none}.up{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.up select{background:var(--bg2);color:var(--bone);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px Rubik}.card.lock{filter:grayscale(1) brightness(.35)}
.card.lock .nm,.card.lock .rr,.card.lock .pw{opacity:.5}
.card.legendary,.card.epic{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 26px 0 var(--rc)}}
.card.legendary::after,.card.diamond::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#fff5 50%,transparent 70%);background-size:250% 100%;animation:sh 2.6s linear infinite;pointer-events:none}
@keyframes sh{from{background-position:150% 0}to{background-position:-100% 0}}
/* opening */
#ov{position:fixed;inset:0;z-index:50;background:radial-gradient(90% 60% at 50% 40%,#3a0c10,#070405 70%),#080405;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
#ov.on{display:flex}
#ov h2{margin:0 0 14px;font-size:20px;text-align:center}
#big{width:190px;height:270px;border-radius:14px;display:grid;place-items:center;box-shadow:0 20px 50px #000,inset 0 0 0 3px #fff4;position:relative;cursor:pointer}
#big svg{width:110px;height:110px}
#big.shake{animation:shk .7s}
@keyframes shk{20%{transform:rotate(-6deg) scale(1.04)}40%{transform:rotate(6deg) scale(1.08)}60%{transform:rotate(-8deg) scale(1.12)}80%{transform:rotate(8deg) scale(1.2)}100%{transform:scale(1.5);opacity:0}}
#hint{color:var(--mute);margin-top:18px;text-align:center;font-size:13px;min-height:20px}
#stage{width:100%;display:flex;justify-content:center}#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;max-width:420px}
.fl{perspective:700px;aspect-ratio:3/4.3;cursor:pointer}
.fl .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.fl.open .in{transform:rotateY(180deg)}
.fl .bk,.fl .fr{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px}
.fl .bk{background:repeating-linear-gradient(45deg,#2b1013 0 6px,#1a0b0d 6px 12px);border:2px solid var(--blood);display:grid;place-items:center;font:400 22px "Russo One";color:var(--blood)}
.fl .fr{transform:rotateY(180deg)}
.fl .fr .card{height:100%}
.new{position:absolute;z-index:3;top:-6px;left:50%;transform:translateX(-50%);background:var(--ember);color:#fff;font:600 10px Rubik;padding:1px 7px;border-radius:8px}
#done{margin-top:18px;display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:9px 16px;border-radius:20px;z-index:60;font-size:13px}
.reset{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:8px 12px;margin-top:20px;font:13px Rubik}
@keyframes sway{0%,100%{transform:perspective(500px) rotateY(-18deg) rotateX(3deg)}50%{transform:perspective(500px) rotateY(18deg) rotateX(-3deg)}}
.pk{animation:sway 4s ease-in-out infinite}#big{animation:sway 4s ease-in-out infinite}#big.shake{animation:shk .7s}
.pk.has,#big.has{background:none!important;box-shadow:none}.pk.has svg,.pk.has::after,#big.has svg{display:none}
.pk img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px #000)}#big img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 20px #000)}
.ed{cursor:pointer;color:var(--gold);font-size:14px}.cw{cursor:pointer}
#vw,#ed,#gm{position:fixed;inset:0;z-index:55;background:#070405f2;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));text-align:center}#vw.on,#ed.on,#gm.on{display:flex}
#vst{perspective:900px;touch-action:none;padding:30px;width:100%;display:flex;justify-content:center}
.v3{width:min(70vw,300px);aspect-ratio:3/4.3;position:relative;transform-style:preserve-3d}.v3 .f{position:absolute;inset:0;backface-visibility:hidden}.v3 .f .card{width:100%;height:100%}.gl{position:absolute;inset:0;pointer-events:none;border-radius:10px}
.v3 .b{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;border-radius:10px;border:2px solid var(--blood);background:repeating-linear-gradient(45deg,#2b1013 0 6px,#1a0b0d 6px 12px);display:grid;place-items:center;font:400 30px 'Russo One';color:var(--blood)}
.vb{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
#ed input[type=text]{width:100%;max-width:320px;background:var(--bg2);color:var(--bone);border:1px solid var(--line);border-radius:8px;padding:12px;font:15px Rubik;margin:12px 0}
.tap{width:70vw;max-width:260px;aspect-ratio:1;border-radius:50%;border:0;font:400 34px 'Russo One';color:#fff;background:radial-gradient(circle at 35% 30%,#ff7a3d,#c1121f 60%,#5a0a10);box-shadow:0 12px 0 #3a0508,0 20px 40px #000;transition:transform .05s;touch-action:manipulation}
.bar{width:80%;max-width:320px;height:14px;border:1px solid var(--line);border-radius:8px;margin:12px 0 28px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--gold))}
#fld{position:relative;width:100%;max-width:420px;height:55vh;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:manipulation}
.sl{position:absolute;width:38px;height:48px;border-radius:50% 50% 45% 45%/65% 65% 35% 35%;background:radial-gradient(circle at 50% 35%,#fff,#7fe9ff 40%,#1b8fb8);box-shadow:0 0 18px #52d6ff;animation:fl 1.8s ease-out forwards}
@keyframes fl{from{transform:translateY(20px) scale(.5);opacity:0}15%{opacity:1}to{transform:translateY(-70px) scale(1.1);opacity:.2}}
@keyframes sway{0%,100%{transform:perspective(600px) rotateY(-30deg) rotateX(6deg)}50%{transform:perspective(600px) rotateY(30deg) rotateX(-6deg)}}
@keyframes jolt{30%{transform:perspective(600px) scale(.88) rotateZ(-5deg)}70%{transform:perspective(600px) scale(1.1) rotateZ(5deg)}}
#big{transform-style:preserve-3d;position:relative}#big.jolt{animation:jolt .15s}#big.shake{animation:shk .7s}
.ly{position:absolute;inset:0;border-radius:14px;background:inherit;display:grid;place-items:center;pointer-events:none}.ly img{width:100%;height:100%;object-fit:contain}
.pt{position:fixed;z-index:80;width:8px;height:8px;margin:-4px;border-radius:50%;pointer-events:none;background:var(--c);box-shadow:0 0 10px var(--c);animation:pt .9s ease-out forwards}@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.flash{position:fixed;inset:0;z-index:80;pointer-events:none;animation:fa .6s ease-out forwards}@keyframes fa{from{opacity:.85}to{opacity:0}}
.sk{animation:skk .5s}@keyframes skk{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-6px,-4px)}80%{transform:translate(5px,5px)}}
@keyframes dl{from{transform:translateY(-140px) scale(.4) rotate(-14deg);opacity:0}}
.fl .bk{padding:0;overflow:hidden;border-color:var(--rc);box-shadow:0 0 16px var(--rc);animation:bp 1.4s ease-in-out infinite}.fl .bk svg,.bi{width:100%;height:100%;object-fit:cover;display:block}@keyframes bp{50%{box-shadow:0 0 30px var(--rc)}}
.v3 .b{transform:rotateY(180deg) translateZ(10px);padding:0;overflow:hidden}.v3 .b svg,.v3 .b img{width:100%;height:100%;object-fit:cover}.th{position:absolute;inset:0;border-radius:10px;background:#3a3f48}
#vst{position:relative}.sd{position:absolute;bottom:6px;left:50%;width:55%;height:18px;margin-left:-27.5%;background:radial-gradient(#000c,transparent 70%)}
#ed input[type=number],#ed select{background:var(--bg2);color:var(--bone);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px Rubik;width:100px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;border:0;border-top:1px solid var(--line);border-radius:0;background:#120a0cf0;backdrop-filter:blur(12px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{padding:14px 2px;font-size:12.5px}nav button.on{background:linear-gradient(#c1121f,#7a0c14)}main{padding-bottom:120px}
.pack{flex-direction:column;text-align:center;padding:18px 14px;background:radial-gradient(80% 60% at 50% 0,#3a1216,#120b0c)}.pk{flex:none;width:118px;height:166px}.pack .buy{width:100%;justify-content:center;padding:14px;font-size:16px}.pinfo{width:100%}.pinfo h2{font-size:20px}
.lvb{font:600 11px Rubik;color:var(--gold);margin-top:2px}.lvb i{display:block;height:4px;width:90px;background:#2a1a1d;border-radius:2px;margin-top:3px;overflow:hidden}.lvb i b{display:block;height:100%;background:var(--gold)}
.new{white-space:nowrap}.card.lock.part{filter:grayscale(.5) brightness(.7)}.frg{position:absolute;left:50%;top:44%;transform:translateX(-50%);font:400 24px 'Russo One';color:#fff;text-shadow:0 2px 8px #000;z-index:3}
#dk{position:relative;width:min(62vw,250px);aspect-ratio:3/4.3}#dk::before{content:'';position:absolute;inset:-14%;border-radius:30px;background:radial-gradient(circle,var(--rc,#c1121f),transparent 65%);opacity:.35;filter:blur(18px);animation:bp 1.2s ease-in-out infinite}#dk.hot::before{opacity:.85}
.dc{position:absolute;inset:0;transition:transform .5s,opacity .5s}.sm .card{width:100%}
.card.loot .li{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3a1a1d,#0e0a0b)}.li svg{width:70%}.lc{width:60px;height:60px;border-radius:50%}.lc.s{width:46px;height:58px;border-radius:50% 50% 45% 45%/65% 65% 35% 35%}
.pips{display:flex;gap:5px;justify-content:center;margin:6px 0 10px}.pips u{width:24px;height:6px;border-radius:3px;background:#2a1a1d}.pips u.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
#sq{display:flex;gap:8px;margin:14px 0}#sq b{width:42px;height:52px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;font:400 24px 'Russo One';color:var(--mute)}#sq b.cu{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px #e8b64a88}#sq b.dn{background:var(--blood);color:#fff;border-color:var(--blood)}
.pad{display:grid;grid-template-columns:repeat(3,76px);grid-template-areas:'. u .' 'l . r' '. d .';gap:8px;margin:12px 0}.pad button{height:70px;font:400 28px 'Russo One';background:var(--bg2);color:var(--bone);border:1px solid var(--line);border-radius:12px;touch-action:manipulation}.pad button:nth-child(1){grid-area:u}.pad button:nth-child(2){grid-area:l}.pad button:nth-child(3){grid-area:r}.pad button:nth-child(4){grid-area:d}.pad button:active{background:var(--blood)}
.sl.sk2{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle,#ddd,#444);box-shadow:0 0 16px #c1121f;display:grid;place-items:center;font-size:20px}.sl.gd{background:radial-gradient(circle at 50% 35%,#fff,#ffd75e 40%,#c98f27);box-shadow:0 0 20px #ffd75e}
#wl{position:relative;width:250px;height:250px;border-radius:50%;border:4px solid var(--gold);background:repeating-conic-gradient(#8a1018 0 45deg,#2a1013 0 90deg);transition:transform 4s cubic-bezier(.1,.7,.1,1)}#wl span{position:absolute;left:50%;top:50%;width:80px;margin-left:-40px;font:600 11px Rubik}#wp{color:var(--gold);font-size:30px;margin-bottom:-10px;z-index:2}
body{background:radial-gradient(120% 55% at 50% 0,#3a1216 0,transparent 60%),radial-gradient(80% 50% at 100% 100%,#1b0a2a,transparent 60%),#0a0607}

.card{border-width:3px;box-shadow:0 8px 20px -6px #000,0 0 16px -4px var(--rc)}.card:not(.cimg) .art::after{content:'';position:absolute;inset:5px;border:1px solid #ffffff55;border-radius:7px;pointer-events:none}.card .nm{border-top:1px solid var(--rc)}
