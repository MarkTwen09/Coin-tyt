<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>anonimnet</title>
<style>
/* ============================================================
   ANONIMNET — 1:1 Telegram iOS Clone
   ============================================================ */
:root {
  /* Official Telegram Dark Theme Colors */
  --bg-main: #0e1621;
  --bg-panel: #17212b;
  --bg-search: #242f3d;
  --bg-hover: #202b36;
  --bg-active: #2b5278;
  --text-main: #ffffff;
  --text-dim: #7d8e9e;
  --accent: #64b5ef;
  --accent-solid: #3390ec;
  
  /* Bubbles */
  --bubble-in: #182533;
  --bubble-out: #2b5278;
  
  /* Nav */
  --nav-bg: rgba(23, 33, 43, 0.85);
  --nav-border: rgba(255, 255, 255, 0.1);
}

* {
  box-sizing: border-box; margin: 0; padding: 0; 
  -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

[hidden] { display: none !important; }
html, body { 
  height: 100%; 
  height: 100dvh; 
  overflow: hidden; 
  overflow-x: hidden;
  background: var(--bg-main); 
  color: var(--text-main);
  overscroll-behavior: none;
}

button { cursor: pointer; border: none; background: none; color: inherit; outline: none; }
input, textarea { border: none; outline: none; background: none; color: inherit; font-family: inherit; }

.app { 
  position: absolute; inset: 0; 
  display: flex; flex-direction: column; 
  overflow: hidden; width: 100vw;
}

/* ===================== ЭКРАНЫ ===================== */
.view-screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  background: var(--bg-main);
}

.screen-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top));
  min-height: 44px; background: var(--bg-panel); z-index: 10;
}
.header-title { font-size: 17px; font-weight: 600; letter-spacing: -0.4px; }
.btn-text { font-size: 17px; color: var(--accent); font-weight: 400; }
.icon-btn { display: grid; place-items: center; color: var(--accent); padding: 4px; }

/* ===================== СПИСОК ЧАТОВ ===================== */
.search-wrap { padding: 8px 16px; background: var(--bg-panel); }
.search {
  width: 100%; background: var(--bg-search); border-radius: 10px;
  padding: 7px 12px; display: flex; align-items: center; gap: 6px;
}
.search svg { width: 18px; height: 18px; fill: var(--text-dim); }
.search input { width: 100%; font-size: 17px; color: var(--text-main); }
.search input::placeholder { color: var(--text-dim); }

.folders { display: flex; gap: 8px; padding: 8px 16px; background: var(--bg-panel); overflow-x: auto; scrollbar-width: none; }
.folders::-webkit-scrollbar { display: none; }
.folder {
  background: var(--bg-search); padding: 6px 14px; border-radius: 20px;
  font-size: 15px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px;
  cursor: pointer; color: var(--text-main); letter-spacing: -0.2px;
}
.folder.active { background: var(--bg-active); }

.content-scroll { flex: 1; overflow-y: auto; padding-bottom: 120px; background: var(--bg-panel); }
.content-scroll::-webkit-scrollbar { display: none; }

.chat-item {
  display: flex; align-items: center; gap: 12px; padding: 8px 16px;
  cursor: pointer; transition: background 0.1s;
}
.chat-item:active { background: var(--bg-hover); }

.avatar-wrap { position: relative; flex: 0 0 auto; }
.avatar {
  width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 600; font-size: 22px; color: #fff;
}
.avatar-ring {
  position: absolute; inset: -2px; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--accent-solid), #30d158, var(--accent-solid));
  z-index: -1; opacity: 0;
  animation: pulseRing 2s infinite;
}
.avatar-ring.active { opacity: 1; }
.avatar-ring::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--bg-panel); }
@keyframes pulseRing { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.04); opacity: 0.7; } }

.ci-body { flex: 1; min-width: 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; padding-top: 4px; }
.chat-item:last-child .ci-body { border-bottom: none; }

.ci-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
.ci-name { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px; }
.ci-time { font-size: 14px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
.ci-bottom { display: flex; justify-content: space-between; align-items: center; }
.ci-sub { font-size: 15px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
.badge {
  background: var(--accent-solid); color: #fff; border-radius: 11px; font-size: 13px; font-weight: 600;
  padding: 2px 7px; min-width: 22px; text-align: center;
}
.badge.muted { background: var(--text-dim); }

/* ===================== ЧАТ ===================== */
.chat-overlay {
  position: fixed; inset: 0; background: var(--bg-main); z-index: 100;
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
}
.app.chat-open .chat-overlay { transform: translateX(0); }

.chat-header {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  padding-top: calc(8px + env(safe-area-inset-top));
  background: var(--bg-panel); border-bottom: 1px solid rgba(0,0,0,0.2); z-index: 10;
}
.chat-header .avatar { width: 40px; height: 40px; font-size: 16px; }
.chat-title { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;}
.chat-title .name { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
.chat-title .status { font-size: 13px; color: var(--text-dim); }
.chat-title .status.online { color: var(--accent); }

/* Сообщения */
.msgs-wrap { position: relative; flex: 1; overflow: hidden; width: 100%; background: var(--bg-main); }

/* ПЛОТНЫЙ КОСМИЧЕСКИЙ ПАТТЕРН */
.doodle-bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.3; }
.messages {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 16px 100px;
  display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth; z-index: 2;
}
.messages::-webkit-scrollbar { display: none; }

.date-chip {
  align-self: center; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
  color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 500;
  margin: 12px 0;
}

/* ИДЕАЛЬНЫЕ ПУЗЫРИ (Telegram iOS) */
.msg {
  max-width: 82%; padding: 6px 10px 6px; border-radius: 16px;
  font-size: 16px; line-height: 1.35; word-break: break-word; position: relative;
  animation: msgPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes msgPop {
  0% { opacity: 0; transform: scale(0.9) translateY(10px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

/* Хвостики через border-radius (Секрет идеального Telegram) */
.msg.in { 
  align-self: flex-start; background: var(--bubble-in); 
  border-bottom-left-radius: 4px; 
}
.msg.in::before {
  content: ""; position: absolute; left: -6px; bottom: 0; width: 12px; height: 15px;
  background: var(--bubble-in); border-bottom-right-radius: 15px;
}

.msg.out {
  align-self: flex-end; background: var(--bubble-out); 
  border-bottom-right-radius: 4px;
}
.msg.out::after {
  content: ""; position: absolute; right: -6px; bottom: 0; width: 12px; height: 15px;
  background: var(--bubble-out); border-bottom-left-radius: 15px;
}

.msg .text { white-space: pre-wrap; letter-spacing: -0.2px; }
.msg .meta {
  display: flex; align-items: center; justify-content: flex-end; gap: 4px;
  font-size: 12px; margin-top: 3px; color: var(--text-dim);
}
.msg.out .meta { color: rgba(255,255,255,0.6); }
.tick { width: 15px; height: 15px; fill: var(--accent); margin-left: 2px;}

/* Реакции */
.reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.reaction {
  background: rgba(255,255,255,0.1); border-radius: 12px; padding: 2px 8px; font-size: 14px; color: #fff;
  display: flex; align-items: center; gap: 4px; border: 1px solid transparent;
}
.reaction.mine { background: rgba(100, 181, 239, 0.2); border-color: rgba(100, 181, 239, 0.4); }

/* Голосовые */
.voice-msg { display: flex; align-items: center; gap: 10px; min-width: 180px; }
.play-btn { width: 32px; height: 32px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; font-size: 12px; padding-left: 2px;}
.msg.in .play-btn { background: var(--accent-solid); color: #fff; }
.wave { display: flex; align-items: center; gap: 2px; height: 24px; flex: 1; }
.wave span { width: 3px; border-radius: 2px; background: rgba(255,255,255,0.3); }
.wave span.played { background: #fff; }

/* ===================== COMPOSER (Liquid Glass) ===================== */
.composer-container {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 16px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(14,22,33,0.95) 0%, rgba(14,22,33,0) 100%);
  z-index: 20; pointer-events: none;
}
.composer-glass {
  pointer-events: auto; display: flex; align-items: flex-end; gap: 6px;
  background: rgba(36, 47, 61, 0.7);
  backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 22px; padding: 5px 6px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.1);
}
.attach-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--text-dim); }
.attach-btn svg { width: 24px; height: 24px; fill: currentColor; }
.input-wrap { flex: 1; display: flex; align-items: flex-end; padding: 0 4px 0 0; }
#input {
  width: 100%; resize: none; max-height: 120px; font-size: 17px;
  padding: 7px 0; color: var(--text-main); line-height: 1.3;
}
#input::placeholder { color: var(--text-dim); }
.send-btn {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-solid); color: #fff;
  flex: 0 0 auto;
}
.send-btn.mic { background: transparent; color: var(--text-dim); }
.send-btn svg { width: 20px; height: 20px; fill: currentColor; }

/* ===================== НИЖНЯЯ НАВИГАЦИЯ (СТРОГО GRID) ===================== */
.bottom-nav-wrapper {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
  padding: 0 16px 20px 16px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s;
  pointer-events: none;
}
.app.chat-open .bottom-nav-wrapper { transform: translateY(150px); opacity: 0; }

.bottom-nav {
  pointer-events: auto;
  position: relative;
  background: var(--nav-bg); 
  backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid var(--nav-border); border-radius: 35px;
  display: grid; 
  grid-template-columns: 1fr 1fr 1fr 1fr; /* ЖЕСТКАЯ СЕТКА, НИКАКОГО РАСТЯГИВАНИЯ */
  padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  overflow: hidden;
}

.nav-indicator {
  position: absolute; top: 6px; bottom: 6px;
  width: calc(25% - 3px); left: 6px; 
  background: rgba(255, 255, 255, 0.1);
  border-radius: 25px;
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 1; pointer-events: none;
}

.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 500; color: var(--text-dim); padding: 6px 0;
  position: relative; z-index: 2; letter-spacing: -0.1px;
}
.nav-item.active { color: var(--accent); }
.nav-item.active svg { fill: var(--accent); }
.nav-item svg { width: 24px; height: 24px; fill: currentColor; }

/* Меню */
.ctx {
  position: fixed; z-index: 200; background: #1c2733; 
  border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); min-width: 200px; padding: 6px;
  border: 1px solid rgba(255,255,255,0.1); animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
.ctx-emojis { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 4px; }
.ctx-emoji { font-size: 22px; padding: 4px; border-radius: 50%; }
.ctx-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; font-size: 16px; border-radius: 10px; color: var(--text-main); }
.ctx-item:active { background: rgba(255,255,255,0.1); }
.ctx-item.danger { color: #ff453a; }
.ctx-item svg { width: 20px; height: 20px; fill: currentColor; }

/* Эмодзи */
.emoji-panel {
  position: fixed; z-index: 150; background: #1c2733; 
  border-radius: 16px; padding: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
  border: 1px solid rgba(255,255,255,0.1); display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
  animation: popIn 0.2s;
}
.emoji-panel button { font-size: 24px; padding: 4px; }

.toast {
  position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1c2733; border: 1px solid rgba(255,255,255,0.1);
  color: #fff; padding: 12px 20px; border-radius: 20px; font-size: 14px;
  opacity: 0; transition: 0.3s; pointer-events: none; z-index: 300;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const nid = () => 'm' + Date.now() + Math.random().toString(36).substr(2, 5);
const nowTime = () => {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};
const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2000);
}

const EMOJIS = ['👍','❤️','🔥','😂','😮','😢','🎉','👏','🤔','💩','😍','🥰','😎','🤯','🙏','💯'];
const SVG_PIN = `<svg class="icon-svg" style="width:14px; height:14px; fill:#7d8e9e;" viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>`;
const SVG_MUTE = `<svg class="icon-svg" style="width:14px; height:14px; fill:#7d8e9e;" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;
const SVG_DOUBLE_CHECK = `<svg class="tick" viewBox="0 0 24 24"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/></svg>`;
const SVG_MIC = `<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>`;
const SVG_SEND = `<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>`;
const SVG_TRASH = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;
const SVG_COPY = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
const AVATAR_LOCK = `<svg viewBox="0 0 24 24" width="26" height="26" fill="#fff"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>`;
const AVATAR_TEAM = `<svg viewBox="0 0 24 24" width="26" height="26" fill="#fff"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>`;

const chats = [
  {
    id: 'anonym', name: 'anonimnet', avatar: 'A', color: '#3390ec',
    status: 'в сети', time: '12:02', unread: 0, pinned: true, muted: false,
    messages: [
      {id:nid(), out:false, type:'text', time:'11:58', text:'Привет 👋 Добро пожаловать в anonimnet!', reactions:{}, mine:{}},
      {id:nid(), out:false, type:'text', time:'11:59', text:'Оцени премиальный дизайн 🚀', reactions:{'🔥':3}, mine:{}},
      {id:nid(), out:true, type:'text', time:'12:02', text:'Вот это уровень! Кайф!', reactions:{}, mine:{}}
    ]
  },
  {
    id: 'secret', name: 'Секретный чат', avatar: 'svg-lock', color: '#30d158',
    status: 'был(а) недавно', time: '10:13', unread: 2, pinned: false, muted: false,
    messages: [
      {id:nid(), out:false, type:'text', time:'10:12', text:'Этот чат шифруется 🛡️', reactions:{}, mine:{}},
      {id:nid(), out:false, type:'voice', time:'10:13', reactions:{'❤️':1}, mine:{}, voice:{url:null, duration:6, bars:Array.from({length:30},()=>Math.random()*0.8+0.2)}}
    ]
  },
  {
    id: 'team', name: 'Команда', avatar: 'svg-team', color: '#ff9f0a',
    status: 'Вы: Привет', time: '12:58', unread: 0, pinned: false, muted: true,
    messages: [
      {id:nid(), out:false, type:'text', time:'09:30', text:'Собираем релиз в пятницу 🚀', reactions:{'👍':5}, mine:{}},
      {id:nid(), out:true, type:'text', time:'12:58', text:'Привет', reactions:{}, mine:{}}
    ]
  }
];

let activeId = 'anonym';
const activeChat = () => chats.find(c => c.id === activeId);

const navItems = $$('.nav-item');
const navIndicator = $('#navIndicator');
const views = {
  chats: $('#view-chats'),
  contacts: $('#view-contacts'),
  calls: $('#view-calls'),
  settings: $('#view-settings')
};

function updateIndicator(index) {
  navIndicator.style.transform = `translateX(${index * 100}%)`;
}
updateIndicator(2);

navItems.forEach((item, index) => {
  item.onclick = () => {
    updateIndicator(index);
    navItems.forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    Object.values(views).forEach(v => v.hidden = true);
    views[item.dataset.tab].hidden = false;
  };
});

function renderChatList(filter = '') {
  const list = $('#chatList');
  list.innerHTML = '';
  chats.filter(c => c.name.toLowerCase().includes(filter.toLowerCase())).forEach(c => {
    const el = document.createElement('div');
    el.className = 'chat-item';
    const ringHTML = c.status === 'в сети' ? `<div class="avatar-ring active"></div>` : '';
    let rightIcon = c.pinned ? SVG_PIN : (c.muted ? SVG_MUTE : '');
    let badge = c.unread > 0 ? `<div class="badge ${c.muted ? 'muted' : 'unread'}">${c.unread}</div>` : '';
    let avatarContent = c.avatar;
    if (c.avatar === 'svg-lock') avatarContent = AVATAR_LOCK;
    if (c.avatar === 'svg-team') avatarContent = AVATAR_TEAM;

    el.innerHTML = `
      <div class="avatar-wrap">${ringHTML}<div class="avatar" style="background:${c.color}">${avatarContent}</div></div>
      <div class="ci-body">
        <div class="ci-top">
          <div class="ci-name">${c.name} ${c.muted ? SVG_MUTE : ''}</div>
          <div class="ci-time">${c.time} ${rightIcon}</div>
        </div>
        <div class="ci-bottom">
          <div class="ci-sub">${c.status}</div>
          ${badge}
        </div>
      </div>
    `;
    el.onclick = () => switchChat(c.id);
    list.appendChild(el);
  });
}

function switchChat(id) {
  activeId = id;
  const c = activeChat();
  c.unread = 0;
  
  $('#chatName').textContent = c.name;
  $('#chatStatus').textContent = c.status;
  $('#chatStatus').classList.toggle('online', c.status === 'в сети');
  
  const av = $('#chatAvatar');
  if (c.avatar === 'svg-lock') { av.innerHTML = AVATAR_LOCK; av.style.background = c.color; }
  else if (c.avatar === 'svg-team') { av.innerHTML = AVATAR_TEAM; av.style.background = c.color; }
  else { av.textContent = c.avatar; av.style.background = c.color; }

  renderMessages();
  renderChatList($('#searchInput').value);
  
  $('#app').classList.add('chat-open');
  closeEmojiPanel();
  closeContext();
}

function renderMessages() {
  const box = $('#messages');
  box.innerHTML = '';
  const msgs = activeChat().messages;
  if (msgs.length) {
    const chip = document.createElement('div');
    chip.className = 'date-chip';
    chip.textContent = 'Сегодня';
    box.appendChild(chip);
  }
  msgs.forEach(m => box.appendChild(messageEl(m)));
  scrollToBottom(true);
}

function scrollToBottom(instant) {
  const box = $('#messages');
  requestAnimationFrame(() => {
    box.scrollTo({ top: box.scrollHeight, behavior: instant ? 'auto' : 'smooth' });
  });
}

function messageEl(m) {
  const el = document.createElement('div');
  el.className = `msg ${m.out ? 'out' : 'in'}`;
  el.dataset.id = m.id;

  if (m.type === 'text') {
    const t = document.createElement('div');
    t.className = 'text';
    t.textContent = m.text;
    el.appendChild(t);
  } else {
    el.appendChild(voiceEl(m));
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<span>${m.time}</span>` + (m.out ? SVG_DOUBLE_CHECK : '');
  el.appendChild(meta);

  const react = document.createElement('div');
  react.className = 'reactions';
  el.appendChild(react);
  renderReactions(react, m);

  attachContext(el, m);
  el.addEventListener('dblclick', e => {
    if(window.getSelection().toString()) return;
    e.preventDefault();
    toggleReaction(m, '❤️');
  });

  return el;
}

let currentAudio = null;
function voiceEl(m) {
  const v = m.voice;
  const wrap = document.createElement('div');
  wrap.className = 'voice-msg';
  const btn = document.createElement('button');
  btn.className = 'play-btn';
  btn.innerHTML = '▶';
  wrap.appendChild(btn);
  const wave = document.createElement('div');
  wave.className = 'wave';
  v.bars.forEach(h => {
    const b = document.createElement('span');
    b.style.height = Math.round(h * 100) + '%';
    wave.appendChild(b);
  });
  wrap.appendChild(wave);
  const dur = document.createElement('span');
  dur.style.fontSize = '12px';
  dur.textContent = fmt(v.duration);
  wrap.appendChild(dur);
  const bars = [...wave.children];

  if(!v.url) { btn.onclick = e => { e.stopPropagation(); toast('Демо голосовое'); }; return wrap; }
  
  const audio = new Audio(v.url);
  btn.onclick = e => {
    e.stopPropagation();
    if(currentAudio && currentAudio !== audio) { currentAudio.pause(); currentAudio.dispatchEvent(new Event('pause')); }
    if(audio.paused) { audio.play(); btn.innerHTML = '❚❚'; currentAudio = audio; } 
    else { audio.pause(); btn.innerHTML = '▶'; }
  };
  audio.ontimeupdate = () => {
    const p = audio.duration ? audio.currentTime / audio.duration : 0;
    bars.forEach((b,i) => b.classList.toggle('played', i / bars.length < p));
    dur.textContent = fmt(Math.max(0, audio.duration - audio.currentTime));
  };
  audio.onended = () => { btn.innerHTML = '▶'; bars.forEach(b=>b.classList.remove('played')); dur.textContent = fmt(v.duration); currentAudio = null; };
  audio.onpause = () => { btn.innerHTML = '▶'; };
  return wrap;
}

function renderReactions(container, m) {
  container.innerHTML = '';
  Object.entries(m.reactions).filter(([,c]) => c > 0).forEach(([emoji, count]) => {
    const chip = document.createElement('button');
    chip.className = 'reaction' + (m.mine[emoji] ? ' mine' : '');
    chip.innerHTML = `<span>${emoji}</span><b>${count}</b>`;
    chip.onclick = e => { e.stopPropagation(); toggleReaction(m, emoji); };
    container.appendChild(chip);
  });
}

function toggleReaction(m, emoji) {
  if(m.mine[emoji]) {
    m.reactions[emoji]--;
    if(m.reactions[emoji] <= 0) delete m.reactions[emoji];
    delete m.mine[emoji];
  } else {
    m.reactions[emoji] = (m.reactions[emoji] || 0) + 1;
    m.mine[emoji] = true;
  }
  const box = document.querySelector(`.msg[data-id="${m.id}"] .reactions`);
  if(box) renderReactions(box, m);
}

let ctxEl = null;
function closeContext() { if(ctxEl) { ctxEl.remove(); ctxEl = null; } }
document.addEventListener('click', closeContext);
document.addEventListener('contextmenu', e => { if (!e.target.closest('.msg')) closeContext(); });

function openContext(x, y, m) {
  closeContext();
  const menu = document.createElement('div');
  menu.className = 'ctx';
  const row = document.createElement('div');
  row.className = 'ctx-emojis';
  EMOJIS.slice(0, 7).forEach(em => {
    const b = document.createElement('button');
    b.className = 'ctx-emoji';
    b.textContent = em;
    b.onclick = e => { e.stopPropagation(); toggleReaction(m, em); closeContext(); };
    row.appendChild(b);
  });
  menu.appendChild(row);

  const copy = document.createElement('button');
  copy.className = 'ctx-item';
  copy.innerHTML = `${SVG_COPY} Копировать`;
  copy.onclick = e => { e.stopPropagation(); if(m.type === 'text') navigator.clipboard.writeText(m.text); toast('Скопировано'); closeContext(); };
  menu.appendChild(copy);

  const del = document.createElement('button');
  del.className = 'ctx-item danger';
  del.innerHTML = `${SVG_TRASH} Удалить`;
  del.onclick = e => { e.stopPropagation(); deleteMessage(m.id); closeContext(); };
  menu.appendChild(del);

  document.body.appendChild(menu);
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(10, Math.min(x, window.innerWidth - r.width - 10)) + 'px';
  menu.style.top = Math.max(10, Math.min(y, window.innerHeight - r.height - 10)) + 'px';
  ctxEl = menu;
}

function attachContext(el, m) {
  el.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); openContext(e.clientX, e.clientY, m); });
  let timer;
  el.addEventListener('touchstart', e => { const touch = e.touches[0]; timer = setTimeout(() => openContext(touch.clientX, touch.clientY, m), 450); }, {passive: true});
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev => el.addEventListener(ev, () => clearTimeout(timer), {passive: true}));
}

function deleteMessage(id) {
  const chat = activeChat();
  const idx = chat.messages.findIndex(m => m.id === id);
  if(idx < 0) return;
  const el = document.querySelector(`.msg[data-id="${id}"]`);
  if(el) {
    el.style.transform = 'scale(0.8) translateY(10px)';
    el.style.opacity = '0';
    setTimeout(() => { chat.messages.splice(idx, 1); renderMessages(); toast('Удалено'); }, 200);
  }
}

const input = $('#input');
const sendBtn = $('#sendBtn');

function updateComposer() {
  if(input.value.trim().length > 0) {
    sendBtn.classList.remove('mic');
    sendBtn.innerHTML = SVG_SEND;
  } else {
    sendBtn.classList.add('mic');
    sendBtn.innerHTML = SVG_MIC;
  }
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  updateComposer();
});

input.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });
sendBtn.onclick = (e) => { e.preventDefault(); if(input.value.trim()) sendText(); else startRecording(); };

function sendText() {
  const text = input.value.trim();
  if(!text) return;
  const chat = activeChat();
  const m = { id: nid(), out: true, type: 'text', text, time: nowTime(), reactions: {}, mine: {} };
  chat.messages.push(m);
  $('#messages').appendChild(messageEl(m));
  input.value = '';
  input.style.height = 'auto';
  updateComposer();
  scrollToBottom();
  chat.status = 'Вы: ' + text;
  chat.time = nowTime();
  renderChatList($('#searchInput').value);
}

let mediaRecorder, chunks = [], recStart = 0, recTimerId, recStream, recSendFlag = false;
async function startRecording() {
  if(!navigator.mediaDevices?.getUserMedia) return toast('Запись недоступна');
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { return toast('Нет доступа к микрофону'); }
  chunks = [];
  mediaRecorder = new MediaRecorder(recStream);
  mediaRecorder.ondataavailable = e => chunks.push(e.data);
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start();
  recStart = Date.now();
  recSendFlag = false;
  $('#normalPanel').hidden = true;
  $('#recPanel').hidden = false;
  $('#recTime').textContent = '0:00';
  recTimerId = setInterval(() => { $('#recTime').textContent = fmt((Date.now() - recStart) / 1000); }, 200);
}

function stopRecording(send) {
  if(!mediaRecorder) return;
  recSendFlag = send;
  mediaRecorder.stop();
  clearInterval(recTimerId);
  if(recStream) recStream.getTracks().forEach(t => t.stop());
  $('#recPanel').hidden = true;
  $('#normalPanel').hidden = false;
}

function onRecordingStop() {
  const duration = Math.max(1, Math.round((Date.now() - recStart) / 1000));
  if(!recSendFlag || !chunks.length) return;
  const blob = new Blob(chunks, { type: chunks[0].type || 'audio/webm' });
  const url = URL.createObjectURL(blob);
  const chat = activeChat();
  const m = { id: nid(), out: true, type: 'voice', time: nowTime(), reactions: {}, mine: {}, voice: { url, duration, bars: Array.from({length:30},()=>Math.random()*0.8+0.2) } };
  chat.messages.push(m);
  $('#messages').appendChild(messageEl(m));
  scrollToBottom();
  chat.status = '🎤 Голосовое сообщение';
  chat.time = nowTime();
  renderChatList($('#searchInput').value);
}

$('#recCancel').onclick = () => stopRecording(false);
$('#recSend').onclick = () => stopRecording(true);

let emojiPanel = null;
function closeEmojiPanel() { if(emojiPanel) { emojiPanel.remove(); emojiPanel = null; } }
$('#emojiBtn').onclick = e => {
  e.stopPropagation();
  if(emojiPanel) return closeEmojiPanel();
  const r = $('#composerGlass').getBoundingClientRect();
  const panel = document.createElement('div');
  panel.className = 'emoji-panel';
  panel.style.left = '16px';
  panel.style.bottom = (window.innerHeight - r.top + 8) + 'px';
  EMOJIS.concat(['😀','😂','🥰','😎','🤔','🙃','😴','🤯','🥳','😭','😡','🤝','✌️','💪','🌟','✨']).forEach(em => {
    const b = document.createElement('button');
    b.textContent = em;
    b.onclick = (ev) => { ev.stopPropagation(); input.value += em; input.focus(); updateComposer(); input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; };
    panel.appendChild(b);
  });
  document.body.appendChild(panel);
  emojiPanel = panel;
};

document.addEventListener('click', e => { if(emojiPanel && !emojiPanel.contains(e.target) && e.target.id !== 'emojiBtn') closeEmojiPanel(); });
$('#backBtn').onclick = () => $('#app').classList.remove('chat-open');
$('#searchInput').addEventListener('input', e => renderChatList(e.target.value));

updateComposer();
renderChatList();
switchChat('anonym');
$('#app').classList.remove('chat-open');
</script>
</body>
