<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090e1b">
<title>Gift Lab — Studio</title>
<style>
:root{color-scheme:dark;--bg:#090e1b;--text:#f2f5fc;--muted:#929fb9;--glass:linear-gradient(135deg,#ffffff0e,#ffffff03);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--text);background:radial-gradient(ellipse at 0 0,#77608f2b,transparent 45%),radial-gradient(ellipse at 100% 30%,#367c891a,transparent 45%),var(--bg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{color:inherit;border:0;cursor:pointer;touch-action:manipulation;transition:transform .2s,background .2s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
h1,h2,h3,p{margin-top:0}
h1{font-size:42px;line-height:1.05;letter-spacing:-1.6px}
h2{font-size:21px;margin-bottom:0}
h3{font-size:14px;margin-bottom:6px}
p{color:var(--muted);line-height:1.8}
.app{max-width:1140px;margin:auto;padding:20px 18px 125px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo{display:grid;place-items:center;width:42px;height:42px;border:1px solid #ffffff55;border-radius:14px;background:linear-gradient(135deg,#baa8d9aa,#7387b477);font-weight:800}
.balance{margin-left:auto;font-weight:750;border:1px solid #ffffff25;border-radius:14px;padding:11px 14px;background:var(--glass)}
.panel{padding:20px;border:1px solid #ffffff1b;border-radius:22px;background:var(--glass);margin-bottom:15px}
.hero{position:relative;overflow:hidden;border:1px solid #ffffff2b;border-radius:26px;background:radial-gradient(ellipse at 90% 0%,#9b7fac30,transparent 65%),var(--glass);padding:30px}
.hero p{margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:45px;padding:13px 17px;border:1px solid #ffffff3b;border-radius:14px;background:linear-gradient(125deg,#baa7dc,#8194c7);font-size:12px;font-weight:750}
.btn.secondary{background:var(--glass)}
.btn.danger{background:#a5637d25;border-color:#dc9bb133}
.btn.full{width:100%}
.btn.mini{min-height:33px;padding:8px 11px;border-radius:10px;font-size:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gift{position:relative;overflow:hidden;padding:0;text-align:left;border:1px solid #ffffff25;border-radius:20px;background:var(--glass)}
.gift-stage{padding:10px;background:radial-gradient(ellipse at 40% 10%,var(--a),var(--b))}
.media{position:relative;overflow:hidden;width:100%;aspect-ratio:1;border:1px solid #ffffff44;border-radius:14px;background:#182030}
.photo{width:100%;height:100%;object-fit:cover;display:block}
.gift-body{padding:11px}
.gift-name{font-size:13px;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gift-sub{font-size:9px;color:#929db6;margin-bottom:8px}
.price{font-weight:750;font-size:13px}
.badge{position:absolute;top:7px;left:7px;z-index:3;padding:4px 6px;border:1px solid #ffffff2b;border-radius:7px;background:#222034c4;font-size:8px}
.nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);display:flex;gap:4px;width:min(690px,100%);padding:9px 8px calc(9px + env(safe-area-inset-bottom,0px));border:1px solid #ffffff35;border-bottom:0;border-radius:24px 24px 0 0;background:linear-gradient(135deg,#3c465eaf,#171f32e8);backdrop-filter:blur(20px)}
.nav button{flex:1;padding:10px 2px;border-radius:14px;background:transparent;color:#939db3;font-size:10px}
.nav button.active{border:1px solid #ffffff22;background:#c6b8ff20;color:#e6dcf9}
.toolbar{display:flex;gap:8px;margin:15px 0}
input,select,textarea{min-width:0;padding:12px;border:1px solid #ffffff22;border-radius:12px;background:#1c263bd9;color:var(--text)}
textarea{resize:vertical;min-height:80px;width:100%}
.toolbar input{flex:1}
.chips{display:flex;gap:7px;overflow:auto;padding-bottom:12px}
.chips button{padding:9px 12px;border:1px solid #ffffff17;border-radius:11px;background:#ffffff06;color:var(--muted);font-size:11px;white-space:nowrap}
.chips button.on{border-color:#c2b2ff55;background:#bbaaff1b;color:#e2d6f5}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:#060913cc}
.sheet{position:relative;overflow:auto;width:100%;max-width:480px;max-height:90vh;border:1px solid #ffffff35;border-radius:24px;background:#182033f5;padding:22px}
.close{position:absolute;top:10px;right:10px;width:34px;height:34px;border:1px solid #ffffff33;border-radius:50%;background:#202737dd}
.toast-area{position:fixed;z-index:100;bottom:100px;left:50%;width:min(400px,90%);transform:translateX(-50%);pointer-events:none}
.toast{margin-top:8px;padding:12px 14px;border:1px solid #ffffff35;border-radius:14px;background:#34415be8;font-size:12px}
.particles{position:fixed;inset:0;z-index:80;overflow:hidden;pointer-events:none}
.particle{position:absolute;width:5px;height:5px;border-radius:2px;background:#d9c7ef;animation:particle 1.2s ease-out forwards}
.profile-cover{position:relative;height:150px;overflow:hidden;background:linear-gradient(135deg,var(--cover,#8977aa),#334560)}
.profile-info{padding:0 18px 18px}
.profile-avatar{margin-top:-42px;position:relative;z-index:2;border:4px solid #20283b;width:86px;height:86px;font-size:30px;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:linear-gradient(135deg,var(--avatar,#a396ce),#53627f)}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-title{margin:14px 0 4px;font-size:25px}
.reels{display:flex;justify-content:center;gap:9px;margin:20px 0;padding:12px;border:1px solid #ffffff22;border-radius:20px;background:var(--glass)}
.reel{position:relative;overflow:hidden;flex:1;max-width:100px;height:120px;border:1px solid #ffffff2b;border-radius:15px;background:#111a2b}
.reel-strip{position:absolute;top:0;left:0;right:0}
.reel-cell{height:84px;display:grid;place-items:center}
.slot-symbol{display:grid;place-items:center;overflow:hidden;width:60px;height:60px;border:1px solid #ffffff33;border-radius:12px}
.slot-symbol img{width:100%;height:100%;object-fit:cover}
.bets{display:flex;gap:7px;margin:15px 0}
.bets button{flex:1;padding:10px 5px;border:1px solid #ffffff19;border-radius:11px;background:#ffffff07;font-size:11px}
.bets button.on{border-color:#d2c2ff77;background:#b5a4ff22}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}
.memory-card{position:relative;aspect-ratio:1;overflow:hidden;min-width:0;padding:0;border:1px solid #ffffff22;border-radius:14px;background:#222b3d}
.memory-card img{width:100%;height:100%;object-fit:cover}
.memory-card.matched{border-color:#a8d7c166;opacity:.75}
.aim-stage{position:relative;overflow:hidden;height:320px;margin-top:15px;border:1px solid #ffffff25;border-radius:20px;background:radial-gradient(ellipse at 50% 0%,#7d5fa820,transparent 65%),#101828;cursor:crosshair}
.aim-target{position:absolute;width:60px;height:60px;padding:0;overflow:hidden;border:2px solid #e0ceff;border-radius:50%;background:#6d608e}
.aim-target img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.aim-target:active{transform:scale(.9)}
.rules-table{width:100%;border-collapse:collapse;margin-top:15px;font-size:11px}
.rules-table td,.rules-table th{text-align:left;padding:10px 4px;border-bottom:1px solid #ffffff0d;color:var(--muted);line-height:1.7}
.rules-table th{color:#d2d7e6;font-weight:600}
@keyframes particle{to{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:650px){.app{padding:15px 13px 115px}h1{font-size:30px}.hero{padding:22px}.grid{gap:10px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">G</div>
    <div class="balance" id="balance">0</div>
    <button id="sound">♪</button>
    <button id="profileButton">G</button>
  </header>
  <main id="main"></main>
</div>
<nav class="nav" id="nav"></nav>
<div id="modal"></div>
<div class="particles" id="particles"></div>
<div class="toast-area" id="toasts"></div>

<script>
(function(){
"use strict";

const KEY="gift-lab-studio-v1";
const PROFILE_KEY="gift-lab-profile-v1";
const FEE=.05;

const D=[
["Loot Bag","lootbag",25,0],["Love Potion","lovepotion",40,0],["Toy Bear","toybear",65,0],
["Eternal Rose","eternalrose",120,1],["Scared Cat","scaredcat",180,1],["Top Hat","tophat",300,2],
["Swiss Watch","swisswatch",360,2],["Chill Flame","chillflame",440,2],["Precious Peach","preciouspeach",800,3],
["Diamond Ring","diamondring",1050,3],["Heart Locket","heartlocket",2300,3],["Durov's Cap","durovscap",3400,4],
["Plush Pepe","plushpepe",6500,4],["Kissed Frog","kissedfrog",220,1],["Magic Potion","magicpotion",950,3],
["Vintage Cigar","vintagecigar",580,2],["Crystal Ball","crystalball",260,1],["Gem Signet","gemsignet",1400,3],
["Astral Shard","astralshard",4200,4],["Signet Ring","signetring",700,2],["Evil Eye","evileye",150,1],
["Jelly Bunny","jellybunny",190,1],["Lunar Snake","lunarsnake",110,1],["Snow Globe","snowglobe",500,2],
["Hex Pot","hexpot",380,2],["Perfume Bottle","perfumebottle",900,3],["Berry Box","berrybox",160,1],
["Spiced Wine","spicedwine",90,0],["Santa Hat","santahat",130,1],["Hypno Lollipop","hypnolollipop",240,1],
["Genie Lamp","genielamp",1800,3],["Flying Broom","flyingbroom",620,2]
];

const CASES=[
["First Drop",80,"#5f668b",2,[[0,25],[1,23],[2,23],[27,12],[26,9],[28,6],[7,2]]],
["Mint Garden",180,"#407568",21,[[1,18],[2,17],[3,18],[4,12],[13,13],[21,10],[26,8],[8,3.8],[12,.2]]],
["Purple Vault",450,"#79558f",5,[[3,15],[4,15],[5,15],[6,12],[7,12],[24,10],[16,10],[8,5],[9,3],[19,1],[11,1.5],[12,.5]]],
["Alchemy Room",700,"#477c88",24,[[1,15],[13,12],[16,15],[24,20],[20,10],[14,12],[31,8],[9,4],[30,3],[12,1]]],
["Frozen Orbit",1000,"#487a9f",23,[[16,20],[23,24],[6,18],[19,15],[7,10],[9,7],[17,4],[18,1.5],[12,.5]]],
["Royal Reserve",2000,"#8c704e",10,[[5,12],[6,12],[7,12],[15,10],[19,14],[8,10],[9,10],[25,7],[17,6],[10,3],[11,2],[18,1],[12,1]]],
["Astral Archive",3000,"#6e589c",18,[[16,18],[19,22],[17,25],[9,15],[14,8],[10,6],[18,4],[12,2]]],
["Pepe Archive",4500,"#587965",12,[[8,20],[9,20],[14,15],[17,15],[10,12],[11,8],[18,6],[12,4]]],
["Midnight Atelier",600,"#745879",24,[[27,20],[26,18],[29,20],[24,18],[31,12],[25,8],[30,3],[18,1]]],
["Genie Reserve",1500,"#8b7450",30,[[16,20],[19,20],[24,15],[31,15],[25,12],[17,8],[30,7],[18,2],[12,1]]]
];

const BG=[["Lavender","#76678e","#34334e"],["Ocean","#55759b","#263d5b"],["Mint","#4b8277","#243f42"],["Rose","#925f7e","#4d304c"],["Honey","#968151","#4f402e"],["Midnight","#575d8c","#282d48"],["Ice","#7297ab","#3b526c"],["Sunset","#a27669","#563c4d"],["Aurora","#587e87","#3e3d6b"],["Graphite","#657183","#2d3649"]];
const RAR=["Обычный","Необычный","Редкий","Эпический","Легендарный"];
const COLORS=["#aa98df","#7ca1d2","#72b3a0","#c88eac","#c4a470"];

const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString("ru-RU");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>Date.now();
const rng=()=>Math.random();
const int=(a,b)=>Math.floor(rng()*(b-a+1))+a;
const uid=()=>now().toString(36)+Math.random().toString(36).slice(2);
const maxEnergy=()=>150+(S.level-1)*10;

let tab="home",busy=false,activeRoll=null,caseId=0,slotBet=10,gameBet=0,arcade="slot";
let memory=null,memoryTimer=null,aim=null,aimTimer=null;
let S=JSON.parse(localStorage.getItem(KEY)||"null")||fresh();
let profile=JSON.parse(localStorage.getItem(PROFILE_KEY)||"null")||null;

function fresh(){
  return {
    coins:120,level:1,energy:150,energyAt:now(),bonusProgress:0,dailyAt:0,
    inventory:[],listings:[],market:[],prices:D.map(d=>d[2]),previous:D.map(d=>d[2]),
    stats:{taps:0,opened:0,bought:0,sold:0,forged:0,aimBest:0},
    seen:[],history:[],memoryRewardAt:0,aimRewardAt:0,pendingCase:null,
    arcadeRound:null,lastGame:null
  };
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(S));
    if(profile)localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));
  }catch(e){}
}

function log(t){
  S.history.unshift(new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})+" · "+t);
  S.history=S.history.slice(0,30);
}

function toast(t){
  const e=document.createElement("div");
  e.className="toast";e.textContent=t;
  $("toasts").append(e);
  setTimeout(()=>e.remove(),4000);
}

function makeItem(id){
  return {uid:uid(),id,bg:int(0,9),serial:int(1000,999999),ref:1,upgrade:0};
}

function itemValue(i){
  return Math.round(S.prices[i.id]*(1+.1*(i.upgrade||0)));
}

function stars(n){
  return "★ "+fmt(n);
}

function asset(id,ref=1){
  return "https://nft.fragment.com/gift/"+D[id][1]+"-"+ref+".webp";
}

function media(id,ref=1){
  return `<div class="media"><img class="photo" src="${asset(id,ref)}" alt="${esc(D[id][0])}" referrerpolicy="no-referrer"></div>`;
}

function theme(i){
  return `--a:${BG[i.bg][1]};--b:${BG[i.bg][2]}`;
}

function pick(w){
  let r=rng()*w.reduce((a,x)=>a+x[1],0);
  for(const x of w){
    r-=x[1];
    if(r<0)return x[0];
  }
  return w[w.length-1][0];
}

function replenish(){
  const n=Math.floor(Math.max(0,now()-S.energyAt)/1000);
  if(n>0){
    S.energy=Math.min(maxEnergy(),S.energy+n);
    S.energyAt+=n*1000;
  }
}

function balance(){
  $("balance").textContent=stars(S.coins);
}

function particles(x,y){
  for(let i=0;i<14;i++){
    const e=document.createElement("i");
    e.className="particle";
    const a=Math.random()*6.28,d=30+Math.random()*90;
    e.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-20}px`;
    $("particles").append(e);
    setTimeout(()=>e.remove(),1200);
  }
}

function nav(){
  const a=[["home","Кейсы"],["market","Маркет"],["earn","Звёзды"],["games","Аркада"],["inventory","Коллекция"]];
  $("nav").innerHTML=a.map(x=>`<button data-tab="${x[0]}" class="${tab===x[0]?"active":""}">${x[1]}</button>`).join("");
}

function render(){
  replenish();balance();nav();
  const views={home:homeView,market:marketView,earn:earnView,games:gamesView,inventory:inventoryView};
  $("main").innerHTML=(views[tab]||homeView)();
}

function go(t){
  tab=t;render();window.scrollTo(0,0);
}

function homeView(){
  return `<section class="hero"><h1>Открывай.<br>Собирай. Улучшай.</h1>
  <p>32 уникальные коллекции. Кейсы, маркет, ателье и аркада.</p>
  <button class="btn" data-action="goEarn">В мастерскую ★</button></section>
  <div class="panel"><h2>Коллекции кейсов</h2></div>
  <div class="grid">${CASES.map((c,n)=>`
    <button class="gift" data-action="case" data-id="${n}">
    <div class="gift-stage" style="--a:${c[2]};--b:#1b2335">${media(c[3])}
    <span class="badge">COLLECTION ${n+1}</span></div>
    <div class="gift-body"><div class="gift-name">${c[0]}</div>
    <div class="gift-sub">${c[4].length} возможных находок</div>
    <div class="price">${stars(c[1])}</div></div></button>`).join("")}</div>
  <div class="panel"><h3>Журнал</h3>${S.history.length?S.history.slice(0,6).map(t=>`<div>${esc(t)}</div>`).join(""):"<p>Начни с First Drop.</p>"}</div>`;
}

function marketView(){
  if(S.market.length<20)for(let i=0;i<20;i++)S.market.push(makeItem(int(0,D.length-1)));
  return `<div class="panel"><h2>Маркет подарков</h2><p class="small">Локальные боты. Предметы виртуальные.</p></div>
  <div class="grid">${S.market.slice(0,20).map(i=>`
    <button class="gift" data-action="previewBuy" data-id="${i.uid}">
    <div class="gift-stage" style="${theme(i)}">${media(i.id)}
    <span class="badge">${RAR[D[i.id][3]]}</span></div>
    <div class="gift-body"><div class="gift-name">${D[i.id][0]}</div>
    <div class="gift-sub">Демо №${fmt(i.serial)}</div>
    <div class="price">${stars(itemValue(i))}</div></div></button>`).join("")}</div>`;
}

function earnView(){
  return `<div class="panel"><h2>Мастерская звёзд</h2>
  <p class="small">Уровень ${S.level} · энергия ${S.energy}/${maxEnergy()}</p>
  <button class="btn full" data-action="tap">Получить ★ ${S.level}</button>
  <p class="small">Каждые 25 нажатий: бонус +5. Сейчас ${S.bonusProgress}/25.</p>
  <button class="btn secondary full" data-action="upgrade">Улучшить за ★ ${Math.round(60*Math.pow(1.45,S.level-1)/5)*5}</button>
  <button class="btn secondary full" data-action="daily">Ежедневный бонус ★ 50</button>
  </div><div class="panel"><h3>Достижения</h3>
  <p class="small">100 нажатий, 3 кейса, 5 коллекций, 10 попаданий в Aim Lab.</p></div>`;
}

function gamesView(){
  return `<div class="panel"><h2>Аркада</h2>
  <div class="chips">
  <button data-action="arcade" data-id="slot" class="${arcade==="slot"?"on":""}">Три в ряд</button>
  <button data-action="arcade" data-id="memory" class="${arcade==="memory"?"on":""}">Memory Lab</button>
  <button data-action="arcade" data-id="aim" class="${arcade==="aim"?"on":""}">Aim Lab</button>
  </div>
  ${arcade==="slot"?slotView():arcade==="memory"?memoryView():aimView()}</div>`;
}

function slotView(){
  return `<div class="grid">
  <div class="panel"><h3>Три в ряд</h3><p class="small">Три ленты, 5 символов.</p>
  <div class="bets">${[5,10,25].map(n=>`<button data-action="slotBet" data-id="${n}" class="${slotBet===n?"on":""}">${stars(n)}</button>`).join("")}</div>
  <button class="btn full" data-action="spin">Играть · ${stars(slotBet)}</button></div>
  <div class="panel"><h3>Выплаты</h3><p class="small">Три одинаковых — ×10. Пара — ×1. Все разные — 0. Теоретический возврат 88%.</p></div></div>`;
}

function memoryView(){
  if(!memory)return `<div class="panel"><h3>Memory Lab</h3>
  <p class="small">8 пар, лимит 30 ходов. Тренировка — бесплатно, бонус ★30 раз в 15 минут.</p>
  <div class="bets">${[0,5,10,25].map(n=>`<button data-action="gameBet" data-id="${n}" class="${gameBet===n?"on":""}">${n?stars(n):"Тренировка"}</button>`).join("")}</div>
  <button class="btn full" data-action="startMemory">${gameBet?"Начать · списать "+stars(gameBet):"Начать тренировку"}</button></div>`;
  return `<div class="panel"><h3>Memory Lab</h3><p class="small">Пары ${memory.matches}/8 · ходы ${memory.moves}/30</p>
  <div class="memory-grid">${memory.cards.map((c,n)=>`<button class="memory-card" data-action="memoryFlip" data-id="${n}">${media(c.id)}</button>`).join("")}</div></div>`;
}

function aimView(){
  if(!aim)return `<div class="panel"><h3>Aim Lab</h3>
  <p class="small">30 секунд. Попадание +1, промах −1. Тренировка — бесплатно, бонус ★20 за 10 попаданий раз в 10 минут.</p>
  <div class="bets">${[0,5,10,25].map(n=>`<button data-action="gameBet" data-id="${n}" class="${gameBet===n?"on":""}">${n?stars(n):"Тренировка"}</button>`).join("")}</div>
  <button class="btn full" data-action="startAim">${gameBet?"Начать · списать "+stars(gameBet):"Начать тренировку"}</button></div>`;
  return `<div class="panel"><h3>Aim Lab</h3><p class="small">Очки ${aim.score} · время ${aim.time} с</p>
  <div class="aim-stage" data-action="aimHit"><div class="aim-target" style="left:40%;top:40%">${media(12)}</div></div>
  <button class="btn full" data-action="aimHit">Поймать подарок</button></div>`;
}

function inventoryView(){
  return `<div class="panel"><h2>Моя коллекция</h2><p class="small">${S.inventory.length} предметов</p></div>
  <div class="grid">${S.inventory.slice().reverse().map(i=>`
    <button class="gift" data-action="previewItem" data-id="${i.uid}">
    <div class="gift-stage" style="${theme(i)}">${media(i.id)}
    <span class="badge">${RAR[D[i.id][3]]}</span></div>
    <div class="gift-body"><div class="gift-name">${D[i.id][0]}</div>
    <div class="gift-sub">Демо №${fmt(i.serial)}</div>
    <div class="price">${stars(itemValue(i))}</div></div></button>`).join("")}</div>`;
}

function caseModal(n){
  caseId=n;
  $("modal").innerHTML=`<div class="overlay"><div class="sheet">
  <button class="close" data-action="close">×</button>
  <h2>${CASES[n][0]}</h2><p class="small">Рулетка остановится на твоём предмете.</p>
  <div id="caseStatus">Готово к открытию</div>
  <button class="btn full" data-action="openCase">Открыть за ${stars(CASES[n][1])}</button>
  </div></div>`;
}

function openCase(){
  const c=CASES[caseId];
  if(S.coins<c[1])return toast("Не хватает звёзд.");
  const winner=makeItem(pick(c[4]));
  S.coins-=c[1];S.inventory.push(winner);S.stats.opened++;
  if(!S.seen.includes(winner.id))S.seen.push(winner.id);
  log("Кейс "+c[0]+": "+D[winner.id][0]);
  save();balance();
  $("caseStatus").innerHTML=`<h3>${D[winner.id][0]}</h3><p class="small">Предмет в коллекции.</p>`;
  $("modal").querySelector('[data-action="openCase"]').remove();
  particles(window.innerWidth/2,window.innerHeight/2);
}

function previewBuy(id){
  const i=S.market.find(i=>i.uid===id);
  if(!i)return;
  $("modal").innerHTML=`<div class="overlay"><div class="sheet">
  <button class="close" data-action="close">×</button>
  <div class="gift-stage" style="${theme(i)}">${media(i.id)}</div>
  <h2>${D[i.id][0]}</h2><p class="small">Демо №${fmt(i.serial)} · не настоящий NFT</p>
  <p class="price">${stars(itemValue(i))}</p>
  <button class="btn full" data-action="buy" data-id="${id}">Купить</button>
  <a class="btn secondary full" href="https://t.me/nft/${D[i.id][1]}-${i.ref}" target="_blank" rel="noopener">Референс в Telegram</a>
  </div></div>`;
}

function buy(id){
  const n=S.market.findIndex(i=>i.uid===id);
  if(n<0)return;
  const i=S.market[n];
  if(S.coins<itemValue(i))return toast("Не хватает звёзд.");
  S.coins-=itemValue(i);S.market.splice(n,1);S.inventory.push(i);
  if(!S.seen.includes(i.id))S.seen.push(i.id);
  S.stats.bought++;save();closeModal();balance();render();
  toast("Предмет добавлен в коллекцию.");
}

function previewItem(id){
  const i=S.inventory.find(i=>i.uid===id);
  if(!i)return;
  $("modal").innerHTML=`<div class="overlay"><div class="sheet">
  <button class="close" data-action="close">×</button>
  <div class="gift-stage" style="${theme(i)}">${media(i.id)}</div>
  <h2>${D[i.id][0]}</h2><p class="small">Демо №${fmt(i.serial)} · ателье +${i.upgrade}</p>
  <p class="price">${stars(itemValue(i))}</p>
  <button class="btn full" data-action="forge" data-id="${id}">Улучшить</button>
  <button class="btn secondary full" data-action="list" data-id="${id}">Выставить на маркет</button>
  <button class="btn secondary full" data-action="pinGift" data-id="${id}">Закрепить в профиле</button>
  <a class="btn secondary full" href="https://t.me/nft/${D[i.id][1]}-${i.ref}" target="_blank" rel="noopener">Референс в Telegram</a>
  </div></div>`;
}

function forge(id){
  const i=S.inventory.find(i=>i.uid===id);
  if(!i)return;
  const cost=Math.max(25,Math.round(S.prices[i.id]*.12*((i.upgrade||0)+1)));
  if(S.coins<cost)return toast("Не хватает звёзд.");
  S.coins-=cost;i.upgrade++;S.stats.forged++;
  log("Ателье: "+D[i.id][0]+" +"+i.upgrade);
  save();balance();previewItem(id);
}

function listItem(id){
  const n=S.inventory.findIndex(i=>i.uid===id);
  if(n<0)return;
  const i=S.inventory.splice(n,1)[0];
  S.listings.push({uid:i.uid,item:i,price:itemValue(i),expires:now()+1800000});
  save();closeModal();render();toast("Лот размещён.");
}

function tap(){
  replenish();
  if(S.energy<1)return toast("Энергия восстанавливается.");
  S.energy--;S.stats.taps++;S.bonusProgress++;
  let bonus=0;
  if(S.bonusProgress>=25){S.bonusProgress-=25;bonus=5;}
  S.coins+=S.level+bonus;balance();save();render();
  particles(window.innerWidth/2,window.innerHeight/2);
}

function upgrade(){
  const cost=Math.round(60*Math.pow(1.45,S.level-1)/5)*5;
  if(S.coins<cost)return toast("Не хватает звёзд.");
  S.coins-=cost;S.level++;S.energy=Math.min(maxEnergy(),S.energy+10);
  save();balance();render();
}

function daily(){
  if(now()-S.dailyAt<86400000)return toast("Бонус будет позже.");
  S.dailyAt=now();S.coins+=50;save();balance();render();
}

function spin(){
  if(S.coins<slotBet)return toast("Не хватает звёзд.");
  const a=[int(0,4),int(0,4),int(0,4)];
  const count=new Set(a).size,mult=count===1?10:count===2?1:0;
  S.coins+=slotBet*mult-slotBet;
  log("Три в ряд: ставка "+slotBet+", выплата "+slotBet*mult);
  save();balance();render();
  toast(mult===10?"Три одинаковых! Выплата "+fmt(slotBet*mult):mult===1?"Пара. Ставка возвращена.":"Все разные. Выплата 0.");
}

function startMemory(){
  if(S.coins<gameBet)return toast("Не хватает звёзд.");
  S.coins-=gameBet;
  const ids=[];for(let i=0;i<8;i++)ids.push(int(0,D.length-1));
  memory={cards:ids.flatMap(id=>[{id},{id}]),open:[],matches:0,moves:0,stake:gameBet};
  for(let i=memory.cards.length-1;i>0;i--){const j=int(0,i);[memory.cards[i],memory.cards[j]]=[memory.cards[j],memory.cards[i]];}
  save();balance();arcade="memory";render();
}

function memoryFlip(n){
  if(!memory||memory.open.includes(n))return;
  memory.open.push(n);
  if(memory.open.length===2){
    memory.moves++;
    const [a,b]=memory.open;
    if(memory.cards[a].id===memory.cards[b].id){
      memory.matches++;memory.open=[];
      if(memory.matches===8){
        if(now()-S.memoryRewardAt>=900000){S.coins+=30;S.memoryRewardAt=now();}
        log("Memory Lab: альбом собран");
        memory=null;
      }
    }else{
      memoryTimer=setTimeout(()=>{memory.open=[];render();},800);
    }
  }
  save();render();
}

function startAim(){
  if(S.coins<gameBet)return toast("Не хватает звёзд.");
  S.coins-=gameBet;
  aim={score:0,time:30,stake:gameBet};
  save();balance();arcade="aim";render();
  aimTimer=setInterval(()=>{
    if(!aim)return;
    aim.time--;
    if(aim.time<=0){
      clearInterval(aimTimer);
      if(aim.score>=10&&now()-S.aimRewardAt>=600000){S.coins+=20;S.aimRewardAt=now();}
      log("Aim Lab: "+aim.score+" попаданий");
      aim=null;save();balance();render();
    }else render();
  },1000);
}

function aimHit(){
  if(!aim)return;
  aim.score++;save();balance();render();
}

function action(a,id,e){
  if(a==="close")return closeModal();
  if(a==="goEarn")return go("earn");
  if(a==="case")return caseModal(+id);
  if(a==="openCase")return openCase();
  if(a==="previewBuy")return previewBuy(id);
  if(a==="buy")return buy(id);
  if(a==="previewItem")return previewItem(id);
  if(a==="forge")return forge(id);
  if(a==="list")return listItem(id);
  if(a==="pinGift")return toast("Профиль закреплён локально.");
  if(a==="tap")return tap();
  if(a==="upgrade")return upgrade();
  if(a==="daily")return daily();
  if(a==="spin")return spin();
  if(a==="slotBet")return slotBet=+id,render();
  if(a==="gameBet")return gameBet=+id,render();
  if(a==="startMemory")return startMemory();
  if(a==="memoryFlip")return memoryFlip(+id);
  if(a==="startAim")return startAim();
  if(a==="aimHit")return aimHit();
  if(a==="arcade")return arcade=id,render();
}

function closeModal(){$("modal").innerHTML="";}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b)return;
  if(b.dataset.tab)return go(b.dataset.tab);
  if(b.dataset.action)return action(b.dataset.action,b.dataset.id,e);
  if(e.target.classList.contains("overlay"))closeModal();
});

window.addEventListener("error",e=>{
  if(!e.message)return;
  document.body.insertAdjacentHTML("beforeend",
  `<div class="panel" style="border-color:#ef9bb833;background:#502838">Ошибка: ${esc(e.message)}</div>`);
});

S.market=S.market||[];
while(S.market.length<20)S.market.push(makeItem(int(0,D.length-1)));
replenish();balance();render();
})();
</script>
</body>
</html>
