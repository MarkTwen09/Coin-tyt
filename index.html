<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>anonimnet AI</title>
<style>
/* ============================================================
   ANONIMNET — Smart AI Assistant (Premium Telegram Style)
   ============================================================ */
:root {
  --tg-bg: #0e1621;
  --tg-panel: #17212b;
  --tg-search: #242f3d;
  --tg-hover: #202b36;
  --tg-active: #2b5278;
  --tg-text: #ffffff;
  --tg-text-dim: #7d8e9e;
  --tg-accent: #64b5ef;
  --tg-blue: #3390ec;
  
  --tg-bubble-in: #182533;
  --tg-bubble-out: #2b5278;
  
  --tg-border: rgba(255, 255, 255, 0.08);
  --glass-bg: rgba(23, 33, 43, 0.75);
}

* {
  box-sizing: border-box; margin: 0; padding: 0; 
  -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

[hidden] { display: none !important; }
html, body { 
  height: 100%; height: 100dvh; overflow: hidden; 
  background: var(--tg-bg); color: var(--tg-text);
  overscroll-behavior: none;
}

button { 
  cursor: pointer; border: none; background: none; color: inherit; outline: none; 
  transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
}
button:active { transform: scale(0.85); }
input, textarea { border: none; outline: none; background: none; color: inherit; font-family: inherit; }

.app { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; width: 100vw; }

/* ===================== ЭКРАНЫ ===================== */
.view-screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  background: var(--tg-bg); animation: viewFade 0.3s ease;
}
@keyframes viewFade { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

.screen-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top));
  min-height: 44px; background: var(--tg-panel); z-index: 10;
}
.header-title { font-size: 17px; font-weight: 600; letter-spacing: -0.4px; }
.btn-text { font-size: 17px; color: var(--tg-accent); font-weight: 400; }
.icon-btn { display: grid; place-items: center; color: var(--tg-accent); padding: 4px; }

.content-scroll { flex: 1; overflow-y: auto; padding-bottom: 120px; background: var(--tg-panel); }
.content-scroll::-webkit-scrollbar { display: none; }

/* ===================== СПИСОК ЧАТОВ ===================== */
.search-wrap { padding: 8px 16px; background: var(--tg-panel); }
.search {
  width: 100%; background: var(--tg-search); border-radius: 10px;
  padding: 7px 12px; display: flex; align-items: center; gap: 6px;
}
.search svg { width: 18px; height: 18px; fill: var(--tg-text-dim); }
.search input { width: 100%; font-size: 17px; color: var(--tg-text); }
.search input::placeholder { color: var(--tg-text-dim); }

.folders { display: flex; gap: 8px; padding: 8px 16px; background: var(--tg-panel); overflow-x: auto; scrollbar-width: none; }
.folders::-webkit-scrollbar { display: none; }
.folder {
  background: var(--tg-search); padding: 6px 14px; border-radius: 20px;
  font-size: 15px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px;
  cursor: pointer; color: var(--tg-text);
}
.folder.active { background: var(--tg-active); }

.chat-item { display: flex; align-items: center; gap: 12px; padding: 8px 16px; cursor: pointer; }
.chat-item:active { background: var(--tg-hover); }

.avatar-wrap { position: relative; flex: 0 0 auto; }
.avatar {
  width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 600; font-size: 22px; color: #fff;
}
.avatar-ring {
  position: absolute; inset: -2px; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--tg-blue), #30d158, var(--tg-blue));
  z-index: -1; opacity: 0; animation: pulseRing 2s infinite;
}
.avatar-ring.active { opacity: 1; }
.avatar-ring::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--tg-panel); }
@keyframes pulseRing { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.04); opacity: 0.7; } }

.ci-body { flex: 1; min-width: 0; border-bottom: 1px solid var(--tg-border); padding-bottom: 8px; padding-top: 4px; }
.chat-item:last-child .ci-body { border-bottom: none; }
.ci-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
.ci-name { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px; }
.ci-time { font-size: 14px; color: var(--tg-text-dim); display: flex; align-items: center; gap: 4px; }
.ci-bottom { display: flex; justify-content: space-between; align-items: center; }
.ci-sub { font-size: 15px; color: var(--tg-text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
.badge { background: var(--tg-blue); color: #fff; border-radius: 11px; font-size: 13px; font-weight: 600; padding: 2px 7px; min-width: 22px; text-align: center; }

/* ===================== ЧАТ ===================== */
.chat-overlay {
  position: fixed; inset: 0; background: var(--tg-bg); z-index: 100;
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
}
.app.chat-open .chat-overlay { transform: translateX(0); }

.chat-header {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  padding-top: calc(8px + env(safe-area-inset-top));
  background: var(--tg-panel); border-bottom: 1px solid var(--tg-border); z-index: 10;
}
.chat-header .avatar { width: 40px; height: 40px; font-size: 18px; }
.chat-title { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;}
.chat-title .name { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; display: flex; align-items: center; gap: 4px; }
.chat-title .status { font-size: 13px; color: var(--tg-text-dim); }
.chat-title .status.online { color: var(--tg-accent); }

/* Сообщения */
.msgs-wrap { position: relative; flex: 1; overflow: hidden; width: 100%; background: var(--tg-bg); }

/* ПАТТЕРН */
.doodle-bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.25; }
.messages {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 16px 100px;
  display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; z-index: 2;
}
.messages::-webkit-scrollbar { display: none; }

.date-chip {
  align-self: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
  color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 500; margin: 12px 0;
}

/* ПУЗЫРИ */
.msg {
  max-width: 85%; padding: 7px 12px 6px; border-radius: 16px;
  font-size: 16px; line-height: 1.35; word-break: break-word; position: relative;
  animation: msgPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
@keyframes msgPop { 0% { opacity: 0; transform: scale(0.85) translateY(15px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

.msg.in { align-self: flex-start; background: var(--tg-bubble-in); border-bottom-left-radius: 4px; }
.msg.out { align-self: flex-end; background: var(--tg-bubble-out); border-bottom-right-radius: 4px; }

.msg .text { white-space: pre-wrap; letter-spacing: -0.2px; }
.msg .text pre { background: rgba(0,0,0,0.4); padding: 8px; border-radius: 8px; font-family: monospace; font-size: 14px; margin-top: 6px; overflow-x: auto; }
.msg .meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 12px; margin-top: 3px; color: var(--tg-text-dim); }
.msg.out .meta { color: rgba(255,255,255,0.6); }
.tick { width: 15px; height: 15px; fill: var(--tg-accent); margin-left: 2px;}

/* Анимация печати */
.typing-indicator { display: flex; align-items: center; gap: 4px; height: 20px; padding: 0 4px; }
.typing-indicator span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--tg-text-dim);
  animation: typingBounce 1.4s infinite ease-in-out both;
}
.typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
.typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
@keyframes typingBounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

/* Реакции */
.reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.reaction {
  background: rgba(255,255,255,0.1); border-radius: 12px; padding: 2px 8px; font-size: 14px; color: #fff;
  display: flex; align-items: center; gap: 4px; border: 1px solid transparent;
}
.reaction.mine { background: rgba(100, 181, 239, 0.2); border-color: rgba(100, 181, 239, 0.4); }

/* ===================== COMPOSER ===================== */
.composer-container {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 16px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--tg-bg) 20%, rgba(14,22,33,0) 100%);
  z-index: 20; pointer-events: none;
}
.composer-glass {
  pointer-events: auto; display: flex; align-items: flex-end; gap: 6px;
  background: var(--glass-bg);
  backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
  border: 1px solid var(--tg-border);
  border-radius: 22px; padding: 5px 6px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}
.composer-glass:focus-within {
  border-color: rgba(100, 181, 239, 0.4);
  box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
  transform: translateY(-2px);
}
.attach-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--tg-text-dim); }
.attach-btn svg { width: 24px; height: 24px; fill: currentColor; }
.input-wrap { flex: 1; display: flex; align-items: flex-end; padding: 0 4px 0 0; }
#input { width: 100%; resize: none; max-height: 120px; font-size: 17px; padding: 7px 0; color: var(--tg-text); line-height: 1.3; }
#input::placeholder { color: var(--tg-text-dim); }
.send-btn { 
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; 
  background: var(--tg-blue); color: #fff; flex: 0 0 auto;
  box-shadow: 0 2px 10px rgba(51, 144, 236, 0.4);
}
.send-btn.mic { background: transparent; box-shadow: none; color: var(--tg-text-dim); }
.send-btn svg { width: 20px; height: 20px; fill: currentColor; }

/* ===================== НАВИГАЦИЯ ===================== */
.bottom-nav-wrapper {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
  padding: 0 16px 20px 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom));
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s; pointer-events: none;
}
.app.chat-open .bottom-nav-wrapper { transform: translateY(150px); opacity: 0; }

.bottom-nav {
  pointer-events: auto; position: relative; background: var(--glass-bg); 
  backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid var(--tg-border); border-radius: 35px;
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden;
}
.nav-indicator {
  position: absolute; top: 6px; bottom: 6px; width: calc(25% - 3px); left: 6px; 
  background: rgba(255, 255, 255, 0.1); border-radius: 25px;
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 1; pointer-events: none;
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; color: var(--tg-text-dim); padding: 6px 0; position: relative; z-index: 2; }
.nav-item.active { color: var(--tg-accent); }
.nav-item.active svg { fill: var(--tg-accent); }
.nav-item svg { width: 24px; height: 24px; fill: currentColor; }

/* Меню */
.ctx {
  position: fixed; z-index: 200; background: #1c2733; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); min-width: 200px; padding: 6px;
  border: 1px solid var(--tg-border); animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
.ctx-emojis { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--tg-border); margin-bottom: 4px; }
.ctx-emoji { font-size: 22px; padding: 4px; border-radius: 50%; }
.ctx-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; font-size: 16px; border-radius: 10px; color: var(--tg-text); }
.ctx-item:active { background: rgba(255,255,255,0.1); }
.ctx-item.danger { color: #ff453a; }
.ctx-item svg { width: 20px; height: 20px; fill: currentColor; }

.emoji-panel {
  position: fixed; z-index: 150; background: #1c2733; border-radius: 16px; padding: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
  border: 1px solid var(--tg-border); display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; animation: popIn 0.2s;
}
.emoji-panel button { font-size: 24px; padding: 4px; }

.toast {
  position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1c2733; border: 1px solid var(--tg-border); color: #fff; padding: 12px 20px; border-radius: 20px; font-size: 14px;
  opacity: 0; transition: 0.3s; pointer-events: none; z-index: 300; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const nid = () => 'm' + Date.now() + Math.random().toString(36).substr(2, 5);
const nowTime = () => { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

function toast(text) {
  const t = $('#toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2000);
}

const EMOJIS = ['👍','❤️','🔥','😂','😮','😢','🎉','👏','🤔','💩','😍','🥰','😎','🤯','🙏','💯'];
const SVG_DOUBLE_CHECK = `<svg class="tick" viewBox="0 0 24 24"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/></svg>`;
const SVG_MIC = `<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>`;
const SVG_SEND = `<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>`;
const SVG_TRASH = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;
const SVG_COPY = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;

const chats = [
  {
    id: 'ai', name: 'anonimnet AI', avatar: '🤖', color: '#3390ec',
    status: 'онлайн', time: nowTime(), unread: 0, pinned: true, muted: false,
    messages: [
      {id:nid(), out:false, type:'text', time:nowTime(), text:'Привет! Я — твой персональный ИИ-ассистент. 🤖\n\nЯ умею:\n• Решать математику (даже словами: "5 умножить на 10")\n• Говорить время и дату\n• Рассказывать шутки и факты\n• Давать советы\n\nСпроси меня о чем-нибудь!', reactions:{}, mine:{}}
    ]
  }
];

let activeId = 'ai';
const activeChat = () => chats.find(c => c.id === activeId);
let isBotTyping = false;
let botState = { lastIntent: null };

const navItems = $$('.nav-item');
const navIndicator = $('#navIndicator');
const views = { chats: $('#view-chats'), contacts: $('#view-contacts'), calls: $('#view-calls'), settings: $('#view-settings') };
function updateIndicator(index) { navIndicator.style.transform = `translateX(${index * 100}%)`; }
updateIndicator(2);

navItems.forEach((item, index) => {
  item.onclick = () => {
    updateIndicator(index);
    navItems.forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    Object.values(views).forEach(v => v.hidden = true);
    views[item.dataset.tab].hidden = false;
  };
});

function renderChatList(filter = '') {
  const list = $('#chatList'); list.innerHTML = '';
  chats.filter(c => c.name.toLowerCase().includes(filter.toLowerCase())).forEach(c => {
    const el = document.createElement('div'); el.className = 'chat-item';
    const ringHTML = `<div class="avatar-ring active"></div>`;
    let lastMsg = c.messages[c.messages.length - 1];
    let sub = lastMsg ? (lastMsg.out ? 'Вы: ' : '') + (lastMsg.type === 'text' ? lastMsg.text : '🎤 Голосовое') : 'Нет сообщений';
    if(sub.length > 35) sub = sub.substring(0, 35) + '...';

    el.innerHTML = `
      <div class="avatar-wrap">${ringHTML}<div class="avatar" style="background:${c.color}">${c.avatar}</div></div>
      <div class="ci-body">
        <div class="ci-top"><div class="ci-name">${c.name}</div><div class="ci-time">${c.time}</div></div>
        <div class="ci-bottom"><div class="ci-sub">${sub}</div></div>
      </div>
    `;
    el.onclick = () => switchChat(c.id);
    list.appendChild(el);
  });
}

function switchChat(id) {
  activeId = id; const c = activeChat(); c.unread = 0;
  $('#chatName').textContent = c.name; $('#chatStatus').textContent = c.status;
  $('#chatAvatar').textContent = c.avatar; $('#chatAvatar').style.background = c.color;
  renderMessages(); renderChatList($('#searchInput').value);
  $('#app').classList.add('chat-open'); closeEmojiPanel(); closeContext();
}

function renderMessages() {
  const box = $('#messages'); box.innerHTML = '';
  const msgs = activeChat().messages;
  if (msgs.length) {
    const chip = document.createElement('div'); chip.className = 'date-chip'; chip.textContent = 'Сегодня'; box.appendChild(chip);
  }
  msgs.forEach(m => box.appendChild(messageEl(m)));
  scrollToBottom(true);
}

function scrollToBottom(instant) {
  const box = $('#messages');
  requestAnimationFrame(() => { box.scrollTo({ top: box.scrollHeight, behavior: instant ? 'auto' : 'smooth' }); });
}

function messageEl(m) {
  const el = document.createElement('div');
  el.className = `msg ${m.out ? 'out' : 'in'}`; el.dataset.id = m.id;

  if (m.type === 'text') {
    const t = document.createElement('div'); t.className = 'text';
    t.innerHTML = m.text.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
    el.appendChild(t);
  } else {
    el.appendChild(voiceEl(m));
  }

  const meta = document.createElement('div'); meta.className = 'meta';
  meta.innerHTML = `<span>${m.time}</span>` + (m.out ? SVG_DOUBLE_CHECK : '');
  el.appendChild(meta);

  const react = document.createElement('div'); react.className = 'reactions'; el.appendChild(react); renderReactions(react, m);
  attachContext(el, m);
  
  el.addEventListener('dblclick', e => { if(window.getSelection().toString()) return; e.preventDefault(); toggleReaction(m, '❤️'); });
  return el;
}

function renderReactions(container, m) {
  container.innerHTML = '';
  Object.entries(m.reactions).filter(([,c]) => c > 0).forEach(([emoji, count]) => {
    const chip = document.createElement('button');
    chip.className = 'reaction' + (m.mine[emoji] ? ' mine' : '');
    chip.innerHTML = `<span>${emoji}</span><b>${count}</b>`;
    chip.onclick = e => { e.stopPropagation(); toggleReaction(m, emoji); };
    container.appendChild(chip);
  });
}

function toggleReaction(m, emoji) {
  if(m.mine[emoji]) { m.reactions[emoji]--; if(m.reactions[emoji] <= 0) delete m.reactions[emoji]; delete m.mine[emoji]; } 
  else { m.reactions[emoji] = (m.reactions[emoji] || 0) + 1; m.mine[emoji] = true; }
  const box = document.querySelector(`.msg[data-id="${m.id}"] .reactions`);
  if(box) renderReactions(box, m);
}

// ==========================================
// ПРОДВИНУТЫЙ ИИ-ДВИЖОК
// ==========================================
function getJoke() {
  const jokes = [
    "— Почему программисты путают Хэллоуин и Рождество?\n— Потому что Oct 31 == Dec 25.",
    "— Сколько нужно программистов, чтобы вкрутить лампочку?\n— Ни одного, это проблема железа.",
    "— Как называется страх перед нейросетями?\n— Искусственный интеллект-фобия. (Ладно, это было плохо 😅)",
    "— Что говорит один байт другому?\n— Мне не хватает бита до полного счастья.",
    "— Почему у программистов путаются день и ночь?\n— Потому что они живут в 24/7.",
    "— Как программист объясняет любовь?\n— Это бесконечный цикл с break по требованию.",
    "— Что делает программист, когда замерзает?\n— Надевает свитер и закрывает все окна. (Windows)",
    "— Что сказал ноль единице?\n— Ты такая толстая! (Шучу, ты просто больше меня в 1 раз)"
  ];
  return jokes[Math.floor(Math.random() * jokes.length)];
}

function getFact() {

    "Знаешь ли ты, что первый компьютерный баг был настоящим насекомым (мотыльком), застрявшим в реле компьютера в 1947 году? 🐛",

    "Группа The Beatles изначально называлась The Quarrymen. 🎸",

function getAdvice() {
  const advices = [
    "Мой совет: не откладывай на завтра то, что можно сделать сегодня. Но и не забывай отдыхать! 🛌",
    "Если чувствуешь усталость — сделай перерыв. Выпей воды, разомнись. Твой мозг скажет спасибо. 💧",

    "Улыбнись! Даже если грустно. Мозг воспринимает улыбку как сигнал, что всё хорошо. 😊",

  return advices[Math.floor(Math.random() * advices.length)];
}

function getBotResponse(inputText) {
  const t = inputText.toLowerCase().trim();
  
  // 1. Математика (умная обработка слов)
  let mathText = t.replace(/плюс/g, '+').replace(/минус/g, '-').replace(/умножить на/g, '*').replace(/умножить/g, '*').replace(/разделить на/g, '/').replace(/разделить/g, '/').replace(/х/g, '*');
  const mathRegex = /(-?\d+(?:\.\d+)?)\s*([\+\-\*\/])\s*(-?\d+(?:\.\d+)?)/;
  const mathMatch = mathText.match(mathRegex);
  if (mathMatch) {
    const a = parseFloat(mathMatch[1]);
    const op = mathMatch[2];
    const b = parseFloat(mathMatch[3]);
    let result;
    if (op === '+') result = a + b;
    else if (op === '-') result = a - b;
    else if (op === '*') result = a * b;
    else if (op === '/') result = b !== 0 ? (a / b) : 'на ноль делить нельзя! 🤦‍♂️';
    
    if (typeof result === 'number') {
      result = Number(result.toFixed(4));
      botState.lastIntent = 'math';
      return `Считаю: ${a} ${op} ${b} = **${result}**`;
    }
    return `Считаю: ${a} ${op} ${b} = ${result}`;
  }

  // 2. Контекст "Еще"
  if (t.match(/еще|ещё|давай еще|расскажи еще/)) {
    if (botState.lastIntent === 'joke') return getJoke();
    if (botState.lastIntent === 'fact') return getFact();
    if (botState.lastIntent === 'advice') return getAdvice();
    return "Что именно рассказать еще? Шутку, факт или совет?";
  }

  // 3. Время и Дата
  if (t.match(/время|час|сколько времени/)) {
    botState.lastIntent = 'time';
    return `Сейчас ${nowTime()} по твоему местному времени. ⏰`;
  }
  if (t.match(/какое сегодня число|какая дата|какой сегодня день/)) {
    const d = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    botState.lastIntent = 'date';
    return `Сегодня ${d.toLocaleDateString('ru-RU', options)}. 📅`;
  }

  // 4. Эмпатия и Настроение
  if (t.match(/грустно|плохо|устал|депрессия|тяжело|болит/)) {
    botState.lastIntent = 'empathy';
    const responses = [
      "Мне жаль это слышать... 🫂 Знай, что это временно. Попробуй отвлечься, выпей чаю. Я всегда здесь, если захочешь поговорить.",
      "Плохие дни случаются у всех. Главное — помнить, что после дождя всегда выходит солнце. ☀️ Хочешь, расскажу шутку, чтобы поднять настроение?",
      "Держись! Ты справишься. Иногда нужно просто выдохнуть и дать себе отдохнуть. 💙"
    ];
    return responses[Math.floor(Math.random() * responses.length)];
  }
  if (t.match(/рад|счастлив|отлично|супер|класс/)) {
    botState.lastIntent = 'happy';
    return "Я очень рад за тебя! 🥳 Пусть этот день будет лучшим. Что хорошего случилось?";
  }

  // 5. Шутки / Факты / Советы
  if (t.match(/шутка|анекдот|рассмеши|пошути/)) {
    botState.lastIntent = 'joke';
    return getJoke();
  }
  if (t.match(/факт|интересное|расскажи что-то/)) {
    botState.lastIntent = 'fact';
    return getFact();
  }
  if (t.match(/совет|что делать|подскажи|как поступить/)) {
    botState.lastIntent = 'advice';
    return getAdvice();
  }

  // 6. О боте
  if (t.match(/кто ты|что ты|расскажи о себе|как тебя зовут|твое имя/)) {
    botState.lastIntent = 'about';
    return "Я — anonimnet AI. 🤖 Меня написали на JavaScript. Я живу прямо в твоем браузере, поэтому могу работать даже без интернета! Я умею считать, подсказывать время, рассказывать шутки и давать советы. Чем займемся?";
  }

  // 7. Приветствия
  if (t.match(/привет|здравствуй|хай|ку|доброе утро|добрый день|добрый вечер/)) {
    botState.lastIntent = 'greet';
    const greets = [
      "Привет! 👋 Как сам?",
      "Здравствуй! Рад тебя видеть. Чем могу помочь?",
      "Хай! 😎 Готов к новым вопросам."
    ];
    return greets[Math.floor(Math.random() * greets.length)];
  }
  if (t.match(/пока|до свидания|бай/)) {
    botState.lastIntent = 'bye';
    return "До встречи! Буду скучать. Если что, я всегда онлайн. 👋";
  }
  if (t.match(/как дела|как ты|как настроение/)) {
    botState.lastIntent = 'howareyou';
    return "У меня всё отлично! Я же ИИ, у меня всегда 100% заряд. А у тебя как настроение?";
  }

  // 8. Код
  if (t.match(/код|напиши|программ|javascript|html|css/)) {
    botState.lastIntent = 'code';
    return "Вот простой пример бесконечного цикла в JavaScript (не запускай его в консоли 😉):\n```\nwhile(true) {\n  console.log('Я работаю!');\n}\n```";
  }

  // 9. Умный Fallback
  const fallbacks = [
    "Интересная мысль. Но я пока не умею отвечать на такое. Попробуй спросить про шутку, факт или время!",
    "Я немного туповат для таких сложных материй. 😅 Но я умею считать! Напиши: 500 * 20",
    "Мой создатель пока не научил меня этому. Но я учусь. Может, расскажу шутку?",
    "Хм, дай подумать... Нет, всё равно не знаю. Давай лучше я расскажу тебе факт! 🧠"
  ];
  botState.lastIntent = 'fallback';
  return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

// Отправка
const input = $('#input');
const sendBtn = $('#sendBtn');

function updateComposer() {
  if(input.value.trim().length > 0) { sendBtn.classList.remove('mic'); sendBtn.innerHTML = SVG_SEND; } 
  else { sendBtn.classList.add('mic'); sendBtn.innerHTML = SVG_MIC; }
}

input.addEventListener('input', () => {
  input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; updateComposer();
});

input.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });
sendBtn.onclick = (e) => { e.preventDefault(); if(input.value.trim() && !isBotTyping) sendText(); };

function sendText() {
  const text = input.value.trim();
  if(!text || isBotTyping) return;
  
  const chat = activeChat();
  const m = { id: nid(), out: true, type: 'text', text, time: nowTime(), reactions: {}, mine: {} };
  chat.messages.push(m);
  $('#messages').appendChild(messageEl(m));
  
  input.value = ''; input.style.height = 'auto'; updateComposer(); scrollToBottom();
  chat.time = nowTime(); renderChatList($('#searchInput').value);

  triggerBotReply(text);
}

function triggerBotReply(userText) {
  isBotTyping = true;
  const typingId = 'typing-' + Date.now();
  const el = document.createElement('div');
  el.className = 'msg in'; el.id = typingId;
  el.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
  $('#messages').appendChild(el);
  scrollToBottom();

  // Задержка зависит от длины ответа (имитация набора)
  const delay = 800 + Math.random() * 800;
  setTimeout(() => {
    document.getElementById(typingId)?.remove();
    
    const replyText = getBotResponse(userText);
    const chat = activeChat();
    const m = { id: nid(), out: false, type: 'text', text: replyText, time: nowTime(), reactions: {}, mine: {} };
    chat.messages.push(m);
    
    $('#messages').appendChild(messageEl(m));
    chat.time = nowTime(); renderChatList($('#searchInput').value); scrollToBottom();
    
    isBotTyping = false;
  }, delay);
}

window.clearChat = function() {
  if(confirm("Очистить историю сообщений?")) {
    const chat = activeChat();
    chat.messages = [
      {id:nid(), out:false, type:'text', time:nowTime(), text:'Чат очищен. Чем я могу помочь? 🤖', reactions:{}, mine:{}}
    ];
    renderMessages();
  }
}

// Контекстное меню
let ctxEl = null;
function closeContext() { if(ctxEl) { ctxEl.remove(); ctxEl = null; } }
document.addEventListener('click', closeContext);
document.addEventListener('contextmenu', e => { if (!e.target.closest('.msg')) closeContext(); });

function openContext(x, y, m) {
  closeContext(); const menu = document.createElement('div'); menu.className = 'ctx';
  const row = document.createElement('div'); row.className = 'ctx-emojis';
  EMOJIS.slice(0, 7).forEach(em => {
    const b = document.createElement('button'); b.className = 'ctx-emoji'; b.textContent = em;
    b.onclick = e => { e.stopPropagation(); toggleReaction(m, em); closeContext(); }; row.appendChild(b);
  });
  menu.appendChild(row);
  const copy = document.createElement('button'); copy.className = 'ctx-item'; copy.innerHTML = `${SVG_COPY} Копировать`;
  copy.onclick = e => { e.stopPropagation(); if(m.type === 'text') navigator.clipboard.writeText(m.text); toast('Скопировано'); closeContext(); };
  menu.appendChild(copy);
  const del = document.createElement('button'); del.className = 'ctx-item danger'; del.innerHTML = `${SVG_TRASH} Удалить`;
  del.onclick = e => { e.stopPropagation(); deleteMessage(m.id); closeContext(); };
  menu.appendChild(del);
  document.body.appendChild(menu);
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(10, Math.min(x, window.innerWidth - r.width - 10)) + 'px';
  menu.style.top = Math.max(10, Math.min(y, window.innerHeight - r.height - 10)) + 'px';
  ctxEl = menu;
}

function attachContext(el, m) {
  el.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); openContext(e.clientX, e.clientY, m); });
  let timer;
  el.addEventListener('touchstart', e => { const touch = e.touches[0]; timer = setTimeout(() => openContext(touch.clientX, touch.clientY, m), 450); }, {passive: true});
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev => el.addEventListener(ev, () => clearTimeout(timer), {passive: true}));
}

function deleteMessage(id) {
  const chat = activeChat(); const idx = chat.messages.findIndex(m => m.id === id);
  if(idx < 0) return;
  const el = document.querySelector(`.msg[data-id="${id}"]`);
  if(el) { el.style.transform = 'scale(0.8) translateY(10px)'; el.style.opacity = '0';
    setTimeout(() => { chat.messages.splice(idx, 1); renderMessages(); toast('Удалено'); }, 200); }
}

// Эмодзи
let emojiPanel = null;
function closeEmojiPanel() { if(emojiPanel) { emojiPanel.remove(); emojiPanel = null; } }
$('#emojiBtn').onclick = e => {
  e.stopPropagation(); if(emojiPanel) return closeEmojiPanel();
  const r = $('#composerGlass').getBoundingClientRect(); const panel = document.createElement('div'); panel.className = 'emoji-panel';
  panel.style.left = '16px'; panel.style.bottom = (window.innerHeight - r.top + 8) + 'px';
  EMOJIS.concat(['😀','😂','🥰','😎','🤔','🙃','😴','🤯','🥳','😭','😡','🤝','✌️','💪','🌟','✨']).forEach(em => {
    const b = document.createElement('button'); b.textContent = em;
    b.onclick = (ev) => { ev.stopPropagation(); input.value += em; input.focus(); updateComposer(); input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; };
    panel.appendChild(b);
  });
  document.body.appendChild(panel); emojiPanel = panel;
};
document.addEventListener('click', e => { if(emojiPanel && !emojiPanel.contains(e.target) && e.target.id !== 'emojiBtn') closeEmojiPanel(); });
$('#backBtn').onclick = () => $('#app').classList.remove('chat-open');
$('#searchInput').addEventListener('input', e => renderChatList(e.target.value));

updateComposer();
renderChatList();
switchChat('ai');
$('#app').classList.remove('chat-open');
</script>
