<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Simulator UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #374151;
            cursor: not-allowed;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #1f2937;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #38bdf8;
            transition: width 0.2s linear;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .terminal {
            background: #030712;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            height: 160px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #4ade80;
            display: none;
            flex-direction: column;
            gap: 4px;
        }

        .log-item {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .log-error { color: #f87171; }
        .log-success { color: #4ade80; }
        .log-info { color: #fbbf24; }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚡ Protocol Simulator</h2>
        
        <div class="input-group">
            <label for="phone">Целевой номер</label>
            <input type="text" id="phone" placeholder="+7 (999) 000-00-00">
        </div>

        <div class="input-group">
            <label for="count">Количество пакетов</label>
            <select id="count">
                <option value="10">10 итераций (Тест)</option>
                <option value="25">25 итераций (Стандарт)</option>
                <option value="50">50 итераций (Максимум)</option>
            </select>
        </div>

        <button id="startBtn" onclick="startSimulation()">Запустить симуляцию</button>

        <div class="progress-container" id="progressContainer">
            <div class="stats">
                <span id="statusText">Статус: Выполнение...</span>
                <span id="counterText">0 / 0</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="terminal" id="terminal">
            <div class="log-item log-info">[SYSTEM] Инициализация интерфейса...</div>
        </div>
    </div>

    <script>
        const services = [
            "Auth Service", "API Gateway", "Verification Hub", 
            "SMS Dispatcher", "Notification Core", "Session Manager"
        ];

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function startSimulation() {
            const phone = document.getElementById('phone').value.trim();
            const count = parseInt(document.getElementById('count').value);
            const startBtn = document.getElementById('startBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');
            const counterText = document.getElementById('counterText');
            const terminal = document.getElementById('terminal');

            if (!phone) {
                alert('Пожалуйста, введите номер телефона!');
                return;
            }

            // Сброс интерфейса
            startBtn.disabled = true;
            progressContainer.style.display = 'block';
            terminal.style.display = 'flex';
            terminal.innerHTML = `<div class="log-item log-info">[SYSTEM] Цель задана: ${phone}</div>`;
            
            let current = 0;
            progressBar.style.width = '0%';

            const interval = setInterval(() => {
                current++;
                const percent = Math.round((current / count) * 100);
                
                // Обновление прогресса
                progressBar.style.width = percent + '%';
                counterText.textContent = `${current} / ${count}`;

                // Генерация красивого лога
                const service = getRandomElement(services);
                const isSuccess = Math.random() > 0.15; // 85% успеха
                const time = new Date().toLocaleTimeString();
                
                let logClass = isSuccess ? 'log-success' : 'log-error';
                let logMsg = isSuccess 
                    ? `[${time}] [OK] ${service}: Пакет отправлен успешно (Код 200)` 
                    : `[${time}] [WARN] ${service}: Превышено время ожидания таймаута`;

                const logDiv = document.createElement('div');
                logDiv.className = `log-item ${logClass}`;
                logDiv.textContent = logMsg;
                terminal.appendChild(logDiv);
                terminal.scrollTop = terminal.scrollHeight;

                if (current >= count) {
                    clearInterval(interval);
                    statusText.textContent = 'Статус: Симуляция завершена';
                    const finishDiv = document.createElement('div');
                    finishDiv.className = 'log-item log-info';
                    finishDiv.textContent = `[SYSTEM] Задача выполнена. Успешно передано пакетов: ${count}`;
                    terminal.appendChild(finishDiv);
                    terminal.scrollTop = terminal.scrollHeight;
                    startBtn.disabled = false;
                }
            }, 150); // Скорость анимации (мс)
        }
    </script>
</body>
</html>
