<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken Shoot InOut Night Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030508;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 960px;
            max-height: 680px;
            background: #080c14;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 3px rgba(79, 172, 254, 0.3);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: none; /* Скрываем стандартный курсор */
        }

        /* --- ГЛАВНОЕ МЕНЮ --- */
        .main-menu {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #111a2e 0%, #04070d 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .main-menu.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .logo-title {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 35px rgba(0, 242, 254, 0.4);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .logo-subtitle {
            font-size: 13px;
            color: #7f8fa6;
            margin-bottom: 35px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .menu-btn {
            background: linear-gradient(180deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            color: #fff;
            padding: 16px 50px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.5);
            text-transform: uppercase;
            transition: all 0.2s;
            margin-bottom: 15px;
            width: 260px;
        }

        .menu-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 114, 255, 0.7);
        }

        .rules-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 14px;
            padding: 16px 20px;
            max-width: 400px;
            font-size: 13px;
            color: #95a5a6;
            line-height: 1.6;
            margin-top: 10px;
        }

        /* Top Bar Info */
        .top-bar {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .stat-box {
            background: rgba(8, 12, 20, 0.85);
            backdrop-filter: blur(14px);
            padding: 8px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .stat-label {
            color: #7f8fa6;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .stat-value {
            color: #4cd964;
            font-size: 19px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(76, 217, 100, 0.4);
        }

        /* Bottom Controls */
        .controls-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(6, 9, 15, 0.92);
            backdrop-filter: blur(18px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-label {
            font-size: 10px;
            color: #7f8fa6;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .bet-input-wrapper {
            display: flex;
            align-items: center;
            background: #121824;
            border: 1px solid #232d3f;
            border-radius: 9px;
            padding: 3px;
        }

        .bet-input-wrapper input {
            background: transparent;
            border: none;
            color: #fff;
            width: 65px;
            text-align: center;
            font-size: 16px;
            font-weight: 900;
            outline: none;
        }

        .btn-small {
            background: #1c2536;
            border: none;
            color: #8c9ba8;
            padding: 6px 10px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 800;
            font-size: 11px;
            transition: all 0.15s;
        }

        .btn-small:hover { background: #2a374e; color: #fff; }

        .risk-selector {
            display: flex;
            background: #121824;
            padding: 3px;
            border-radius: 9px;
            gap: 3px;
        }

        .risk-btn {
            background: transparent;
            border: none;
            color: #7f8fa6;
            padding: 7px 11px;
            border-radius: 7px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .risk-btn.active {
            background: linear-gradient(180deg, #00c6ff 0%, #0072ff 100%);
            color: #fff;
            box-shadow: 0 3px 10px rgba(0, 114, 255, 0.5);
        }

        .btn-primary {
            background: linear-gradient(180deg, #ff9500 0%, #e07b00 100%);
            border: none;
            color: #fff;
            padding: 13px 26px;
            font-size: 17px;
            font-weight: 900;
            border-radius: 11px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 149, 0, 0.5);
            text-transform: uppercase;
            flex-grow: 1;
            max-width: 150px;
            transition: all 0.15s;
        }

        .btn-cashout {
            background: linear-gradient(180deg, #34c759 0%, #1c7532 100%);
            box-shadow: 0 5px 20px rgba(52, 199, 89, 0.5);
            display: none;
        }

        .btn-primary:disabled {
            background: #202736;
            color: #555f73;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Ammo Bar */
        .ammo-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.5);
            padding: 7px 12px;
            border-radius: 9px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .bullet {
            width: 10px;
            height: 22px;
            background: linear-gradient(180deg, #ffe066 0%, #f39c12 100%);
            border-radius: 3px 3px 1px 1px;
            border: 1px solid #b37d00;
            box-shadow: 0 0 8px rgba(243, 156, 18, 0.6);
            transition: all 0.2s;
        }

        .bullet.spent {
            background: #222938;
            border-color: #121620;
            box-shadow: none;
            opacity: 0.25;
        }

        /* History */
        .history-bar {
            position: absolute;
            top: 70px;
            left: 14px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .history-tag {
            background: rgba(8, 12, 20, 0.85);
            padding: 4px 10px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 900;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .history-tag.win { color: #4cd964; border-color: rgba(76, 217, 100, 0.4); }
        .history-tag.loss { color: #ff3b30; border-color: rgba(255, 59, 48, 0.4); }

        /* Notification overlay */
        .overlay-msg {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 34px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9), 0 0 30px rgba(0, 198, 255, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 20;
            text-align: center;
            width: 90%;
        }

        .overlay-msg.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.08);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- ГЛАВНОЕ МЕНЮ -->
    <div class="main-menu" id="main-menu">
        <div class="logo-title">Chicken Shoot</div>
        <div class="logo-subtitle">Night Storm Edition 4K</div>
        
        <button class="menu-btn" id="btn-play-game">ИГРАТЬ</button>

        <div class="rules-card">
            <b>Правила игры:</b><br>
            • У вас 3 патрона на раунд.<br>
            • Каждый точный выстрел увеличивает ваш куш.<br>
            • Нажмите **ЗАБРАТЬ**, чтобы сохранить выигрыш!<br>
            • Промах сжигает патрон. Удачи под ночным дождем!
        </div>
    </div>

    <!-- ТОП БАР -->
    <div class="top-bar">
        <div class="stat-box">
            <div class="stat-label">Баланс</div>
            <div class="stat-value" id="balance-val">$100.00</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Куш раунда</div>
            <div class="stat-value" id="win-val" style="color:#ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5);">$0.00</div>
        </div>
    </div>

    <div class="history-bar" id="history-bar"></div>
    <div class="overlay-msg" id="overlay-msg">ОГОНЬ!</div>

    <canvas id="gameCanvas"></canvas>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div class="controls-panel">
        <div class="control-group">
            <span class="control-label">Ставка</span>
            <div class="bet-input-wrapper">
                <button class="btn-small" id="btn-min">MIN</button>
                <input type="number" id="bet-input" value="5" min="1">
                <button class="btn-small" id="btn-max">MAX</button>
                <button class="btn-small" id="btn-x2">x2</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Риск</span>
            <div class="risk-selector">
                <button class="risk-btn" data-risk="low">Low</button>
                <button class="risk-btn active" data-risk="med">Med</button>
                <button class="risk-btn" data-risk="high">High</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Патроны</span>
            <div class="ammo-container" id="ammo-box"></div>
        </div>

        <button class="btn-primary" id="btn-start">СТАРТ</button>
        <button class="btn-primary btn-cashout" id="btn-cashout">ЗАБРАТЬ</button>
    </div>
</div>

<script>
    // --- ЗВУКОВОЙ ДВИЖОК ---
    class SoundEngine {
        constructor() { this.ctx = null; }
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        playShot() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(25, now + 0.16);
            gain.gain.setValueAtTime(0.9, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.16);
        }
        playHit() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(450, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.12);
            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
        }
        playWin() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f, now + i * 0.08);
                gain.gain.setValueAtTime(0.4, now + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + i * 0.08);
                osc.stop(now + i * 0.08 + 0.2);
            });
        }
    }

    const sound = new SoundEngine();

    // --- СОСТОЯНИЕ ИГРЫ ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let balance = 100;
    let currentBet = 5;
    let selectedRisk = 'med';
    let gameState = 'menu';
    let maxAmmo = 3;
    let currentAmmo = 3;
    let roundWin = 0;
    let totalMult = 1.0;

    let mouseX = -100, mouseY = -100;
    let screenShake = 0;

    const balanceEl = document.getElementById('balance-val');
    const winEl = document.getElementById('win-val');
    const betInput = document.getElementById('bet-input');
    const btnStart = document.getElementById('btn-start');
    const btnCashout = document.getElementById('btn-cashout');
    const overlayMsg = document.getElementById('overlay-msg');
    const ammoBox = document.getElementById('ammo-box');
    const historyBar = document.getElementById('history-bar');
    const mainMenu = document.getElementById('main-menu');

    // 4K HiDPI Scaling
    let dpr = window.devicePixelRatio || 1;
    function resizeCanvas() {
        dpr = window.devicePixelRatio || 1;
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let windmillAngle = 0;
    let chickens = [];
    let particles = [];
    let floatingTexts = [];
    let muzzleFlashes = [];
    let rainDrops = [];
    let splashes = [];
    let shells = [];

    // Инициализация дождя
    function initRain() {
        rainDrops = [];
        const count = 120;
        for (let i = 0; i < count; i++) {
            rainDrops.push({
                x: Math.random() * (canvas.width / dpr + 200) - 100,
                y: Math.random() * (canvas.height / dpr),
                length: Math.random() * 18 + 10,
                speed: Math.random() * 12 + 16,
                alpha: Math.random() * 0.4 + 0.2
            });
        }
    }
    initRain();

    const MULTIPLIERS = [
        { mult: 1.2, bg: '#4cd964', scale: 0.8, speed: 2.3, chance: 0.45 },
        { mult: 1.5, bg: '#34a853', scale: 0.75, speed: 2.7, chance: 0.28 },
        { mult: 2.5, bg: '#007aff', scale: 0.7, speed: 3.2, chance: 0.15 },
        { mult: 5.0, bg: '#5856d6', scale: 0.65, speed: 3.8, chance: 0.07 },
        { mult: 12.0, bg: '#ff9500', scale: 0.6, speed: 4.5, chance: 0.04 },
        { mult: 40.0, bg: '#ff3b30', scale: 0.5, speed: 5.4, chance: 0.01 }
    ];

    // --- КУРИЦА ---
    class Chicken {
        constructor(laneIndex) {
            this.lane = laneIndex;
            this.reset(true);
        }

        reset(initial = false) {
            const rand = Math.random();
            let type = MULTIPLIERS[0];
            let acc = 0;
            for (let m of MULTIPLIERS) {
                acc += m.chance;
                if (rand <= acc) { type = m; break; }
            }

            this.mult = type.mult;
            this.bg = type.bg;
            this.scale = type.scale;
            this.speed = type.speed * (selectedRisk === 'high' ? 1.35 : selectedRisk === 'low' ? 0.75 : 1.0);
            
            this.dir = Math.random() > 0.5 ? 1 : -1;
            
            const renderW = canvas.width / dpr;
            const renderH = canvas.height / dpr;
            const laneY = renderH * 0.18 + (this.lane * (renderH * 0.09));
            
            this.y = laneY;
            this.x = initial 
                ? Math.random() * (renderW - 140) + 70 
                : (this.dir === 1 ? -100 - Math.random() * 120 : renderW + 100 + Math.random() * 120);

            this.time = Math.random() * 100;
            this.wingPhase = Math.random() * Math.PI * 2;
            this.alive = true;
        }

        update() {
            const renderW = canvas.width / dpr;
            this.x += this.speed * this.dir;
            this.time += 0.04;
            this.wingPhase += 0.2;

            this.currentY = this.y + Math.sin(this.time) * 10;

            if (this.dir === 1 && this.x > renderW + 120) this.reset(false);
            else if (this.dir === -1 && this.x < -120) this.reset(false);
        }

        draw(ctx) {
            if (!this.alive) return;

            ctx.save();
            ctx.translate(this.x, this.currentY);
            if (this.dir === -1) ctx.scale(-1, 1);
            ctx.scale(this.scale, this.scale);

            // Крыло заднее
            ctx.fillStyle = '#4a250d';
            ctx.beginPath();
            ctx.ellipse(-16, -12, 14, 8, -0.4, 0, Math.PI * 2);
            ctx.fill();

            // Тело
            ctx.fillStyle = '#7a3e18';
            ctx.beginPath();
            ctx.arc(0, 0, 26, 0, Math.PI * 2);
            ctx.fill();

            // Хвост
            ctx.fillStyle = '#3a1b08';
            ctx.beginPath();
            ctx.moveTo(-20, -5);
            ctx.lineTo(-38, -22);
            ctx.lineTo(-28, 5);
            ctx.closePath();
            ctx.fill();

            // Голова
            ctx.fillStyle = '#7a3e18';
            ctx.beginPath();
            ctx.arc(18, -20, 16, 0, Math.PI * 2);
            ctx.fill();

            // Гребешок
            ctx.fillStyle = '#d63031';
            ctx.beginPath();
            ctx.arc(12, -34, 6, 0, Math.PI * 2);
            ctx.arc(20, -37, 7, 0, Math.PI * 2);
            ctx.arc(28, -32, 5, 0, Math.PI * 2);
            ctx.fill();

            // Бородка
            ctx.beginPath();
            ctx.arc(28, -4, 5, 0, Math.PI * 2);
            ctx.fill();

            // Клюв
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.moveTo(30, -22);
            ctx.lineTo(46, -17);
            ctx.lineTo(31, -11);
            ctx.closePath();
            ctx.fill();

            // Крыло переднее
            const wingAngle = Math.sin(this.wingPhase) * 0.35;
            ctx.save();
            ctx.translate(-2, 0);
            ctx.rotate(wingAngle);
            ctx.fillStyle = '#8e4a1e';
            ctx.beginPath();
            ctx.ellipse(-4, 2, 16, 10, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Глаза
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(16, -24, 8, 0, Math.PI * 2);
            ctx.arc(27, -24, 9, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(18, -23, 3, 0, Math.PI * 2);
            ctx.arc(28, -23, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // МНОЖИТЕЛЬ С НЕОНОВЫМ СВЕЧЕНИЕМ
            ctx.save();
            ctx.translate(this.x, this.currentY + 34 * this.scale);
            
            ctx.shadowColor = this.bg;
            ctx.shadowBlur = 12;
            ctx.fillStyle = this.bg;
            ctx.beginPath();
            ctx.roundRect(-24, -10, 48, 20, 6);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('x' + this.mult, 0, 1);

            ctx.restore();
        }

        isHit(px, py) {
            const dx = this.x - px;
            const dy = this.currentY - py;
            return Math.sqrt(dx * dx + dy * dy) < 38 * this.scale;
        }
    }

    for (let i = 0; i < 5; i++) {
        chickens.push(new Chicken(i));
    }

    // --- НОЧНОЙ ФОН, ЛУНА И ДОЖДЬ ---
    function drawBackground() {
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;

        // Ночное небо
        const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.65);
        skyGrad.addColorStop(0, '#040814');
        skyGrad.addColorStop(1, '#0e182e');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, h);

        // ЛУНА И ЕЕ СВЕЧЕНИЕ
        const moonX = w * 0.2;
        const moonY = h * 0.2;
        const moonGlow = ctx.createRadialGradient(moonX, moonY, 15, moonX, moonY, 120);
        moonGlow.addColorStop(0, 'rgba(235, 243, 255, 0.9)');
        moonGlow.addColorStop(0.2, 'rgba(180, 210, 255, 0.4)');
        moonGlow.addColorStop(1, 'rgba(180, 210, 255, 0)');
        ctx.fillStyle = moonGlow;
        ctx.beginPath();
        ctx.arc(moonX, moonY, 120, 0, Math.PI * 2);
        ctx.fill();

        // Лунный диск
        ctx.fillStyle = '#f5f6fa';
        ctx.beginPath();
        ctx.arc(moonX, moonY, 28, 0, Math.PI * 2);
        ctx.fill();

        // Кратеры
        ctx.fillStyle = '#dcdde1';
        ctx.beginPath();
        ctx.arc(moonX - 8, moonY - 6, 6, 0, Math.PI * 2);
        ctx.arc(moonX + 10, moonY + 4, 8, 0, Math.PI * 2);
        ctx.arc(moonX - 2, moonY + 12, 4, 0, Math.PI * 2);
        ctx.fill();

        // Горы
        ctx.fillStyle = '#162238';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.65);
        ctx.lineTo(w * 0.25, h * 0.42);
        ctx.lineTo(w * 0.5, h * 0.65);
        ctx.lineTo(w * 0.78, h * 0.46);
        ctx.lineTo(w, h * 0.65);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.fill();

        // Ночное поле
        ctx.fillStyle = '#0a1a14';
        ctx.fillRect(0, h * 0.62, w, h * 0.38);

        // Ветряк
        drawWindmill(w * 0.88, h * 0.52);
    }

    function drawWindmill(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = '#1e272e';
        ctx.fillRect(-6, 0, 12, 45);
        
        windmillAngle += 0.015;
        ctx.rotate(windmillAngle);
        ctx.fillStyle = '#718093';
        for (let i = 0; i < 4; i++) {
            ctx.rotate(Math.PI / 2);
            ctx.fillRect(-2, 0, 4, 28);
        }
        ctx.restore();
    }

    function drawRain() {
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;

        ctx.strokeStyle = '#a4b0be';
        ctx.lineWidth = 1.2;

        for (let drop of rainDrops) {
            drop.x += 2; // Диагональ
            drop.y += drop.speed;

            if (drop.y > h) {
                // Создать всплеск на земле
                splashes.push({ x: drop.x, y: h - Math.random() * 30, r: 1, alpha: 0.8 });
                drop.y = -20;
                drop.x = Math.random() * (w + 200) - 100;
            }

            ctx.save();
            ctx.globalAlpha = drop.alpha;
            ctx.beginPath();
            ctx.moveTo(drop.x, drop.y);
            ctx.lineTo(drop.x - 4, drop.y + drop.length);
            ctx.stroke();
            ctx.restore();
        }

        // Рендер всплесков
        for (let i = splashes.length - 1; i >= 0; i--) {
            let s = splashes[i];
            s.r += 0.8;
            s.alpha -= 0.06;
            if (s.alpha <= 0) splashes.splice(i, 1);
            else {
                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.strokeStyle = '#dcdde1';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.ellipse(s.x, s.y, s.r * 2, s.r * 0.5, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }
    }

    // --- РЕАЛИСТИЧНЫЙ СНАЙПЕРСКИЙ ПРИЦЕЛ С ОПТИКОЙ ---
    function drawSniperScope(x, y) {
        if (x < 0 || y < 0) return;

        ctx.save();
        ctx.translate(x, y);

        // Наведение на курицу (Lock-On Check)
        let isLocked = false;
        for (let chicken of chickens) {
            if (chicken.alive && chicken.isHit(x, y)) {
                isLocked = true;
                break;
            }
        }

        const color = isLocked ? '#ff3b30' : '#00f2fe';

        // Внешнее кольцо оптики
        ctx.strokeStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = isLocked ? 16 : 8;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(0, 0, 28, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, 0, 34, 0, Math.PI * 2);
        ctx.stroke();

        // Деления Mil-Dot
        ctx.beginPath();
        // Горизонталь
        ctx.moveTo(-45, 0); ctx.lineTo(-10, 0);
        ctx.moveTo(10, 0); ctx.lineTo(45, 0);
        // Вертикаль
        ctx.moveTo(0, -45); ctx.lineTo(0, -10);
        ctx.moveTo(0, 10); ctx.lineTo(0, 45);
        ctx.stroke();

        // Точки на делениях
        ctx.fillStyle = color;
        for (let offset of [-30, -20, 20, 30]) {
            ctx.beginPath();
            ctx.arc(offset, 0, 1.5, 0, Math.PI * 2);
            ctx.arc(0, offset, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        // Точка в центре
        ctx.beginPath();
        ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function createFeatherExplosion(x, y) {
        for (let i = 0; i < 24; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                size: Math.random() * 8 + 4,
                color: Math.random() > 0.3 ? '#00f2fe' : '#d63031',
                life: 1.0,
                rot: Math.random() * Math.PI * 2
            });
        }
    }

    function updateEffects() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.25;
            p.life -= 0.035;

            if (p.life <= 0) particles.splice(i, 1);
            else {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size, p.size * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
            let f = muzzleFlashes[i];
            f.life -= 0.2;
            if (f.life <= 0) muzzleFlashes.splice(i, 1);
            else {
                ctx.save();
                ctx.globalAlpha = f.life;
                ctx.fillStyle = '#fffa65';
                ctx.shadowColor = '#ff3b30';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y += ft.vy;
            ft.alpha -= 0.02;

            if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            else {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = '900 24px sans-serif';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 6;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }
        }
    }

    function updateAmmoUI() {
        ammoBox.innerHTML = '';
        for (let i = 0; i < maxAmmo; i++) {
            const b = document.createElement('div');
            b.className = 'bullet' + (i >= currentAmmo ? ' spent' : '');
            ammoBox.appendChild(b);
        }
    }
    updateAmmoUI();

    function initRound() {
        if (balance < currentBet) {
            showOverlay('НЕДОСТАТОЧНО СРЕДСТВ');
            return;
        }

        sound.init();
        balance -= currentBet;
        roundWin = 0;
        totalMult = 1.0;
        currentAmmo = maxAmmo;

        balanceEl.innerText = `$${balance.toFixed(2)}`;
        winEl.innerText = `$0.00`;
        updateAmmoUI();

        gameState = 'playing';
        btnStart.style.display = 'none';
        btnCashout.style.display = 'block';
        showOverlay('ОГОНЬ!');
    }

    function cashout() {
        if (gameState !== 'playing') return;

        gameState = 'idle';
        btnStart.style.display = 'block';
        btnCashout.style.display = 'none';

        if (roundWin > 0) {
            balance += roundWin;
            balanceEl.innerText = `$${balance.toFixed(2)}`;
            sound.playWin();
            showOverlay(`ВЫИГРЫШ: $${roundWin.toFixed(2)}`);
            addHistoryTag(roundWin / currentBet, true);
        }
    }

    function endRoundLoss() {
        gameState = 'idle';
        btnStart.style.display = 'block';
        btnCashout.style.display = 'none';

        if (roundWin > 0) {
            balance += roundWin;
            balanceEl.innerText = `$${balance.toFixed(2)}`;
            sound.playWin();
            showOverlay(`КУШ ЗАБРАН: $${roundWin.toFixed(2)}`);
            addHistoryTag(roundWin / currentBet, true);
        } else {
            showOverlay('ПРОМАХ!');
            addHistoryTag(0, false);
        }
    }

    function showOverlay(msg) {
        overlayMsg.innerText = msg;
        overlayMsg.classList.add('show');
        setTimeout(() => overlayMsg.classList.remove('show'), 1200);
    }

    function addHistoryTag(mult, isWin) {
        const tag = document.createElement('div');
        tag.className = `history-tag ${isWin ? 'win' : 'loss'}`;
        tag.innerText = isWin ? `x${mult.toFixed(1)}` : '0.0x';
        historyBar.prepend(tag);
        if (historyBar.children.length > 6) historyBar.removeChild(historyBar.lastChild);
    }

    // --- ВЫСТРЕЛ ---
    function handleShoot(clientX, clientY) {
        if (gameState !== 'playing') return;

        const rect = canvas.getBoundingClientRect();
        const mx = clientX - rect.left;
        const my = clientY - rect.top;

        if (currentAmmo <= 0) return;

        currentAmmo--;
        updateAmmoUI();
        sound.playShot();
        screenShake = 9;

        muzzleFlashes.push({ x: mx, y: my, radius: 32, life: 1.0 });

        let hit = false;
        for (let chicken of chickens) {
            if (chicken.alive && chicken.isHit(mx, my)) {
                chicken.alive = false;
                hit = true;
                sound.playHit();
                screenShake = 15;
                createFeatherExplosion(chicken.x, chicken.currentY);

                totalMult *= chicken.mult;
                roundWin = currentBet * totalMult;

                winEl.innerText = `$${roundWin.toFixed(2)}`;
                floatingTexts.push({ text: `+$${(currentBet * chicken.mult).toFixed(1)} (x${chicken.mult})`, x: chicken.x, y: chicken.currentY, vy: -2, alpha: 1, color: '#00f2fe' });

                setTimeout(() => chicken.reset(false), 500);
                break;
            }
        }

        if (currentAmmo <= 0) {
            setTimeout(endRoundLoss, 500);
        }
    }

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
    });

    canvas.addEventListener('mouseleave', () => { mouseX = -100; mouseY = -100; });

    canvas.addEventListener('click', (e) => handleShoot(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
            mouseX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            mouseY = e.touches[0].clientY - canvas.getBoundingClientRect().top;
            handleShoot(e.touches[0].clientX, e.touches[0].clientY);
        }
    });

    // --- ИГРОВОЙ ЦИКЛ ---
    function gameLoop() {
        ctx.save();

        if (screenShake > 0) {
            const shakeX = (Math.random() - 0.5) * screenShake;
            const shakeY = (Math.random() - 0.5) * screenShake;
            ctx.translate(shakeX, shakeY);
            screenShake *= 0.85;
            if (screenShake < 0.5) screenShake = 0;
        }

        ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);

        drawBackground();

        for (let chicken of chickens) {
            chicken.update();
            chicken.draw(ctx);
        }

        drawRain();
        updateEffects();
        drawSniperScope(mouseX, mouseY);

        ctx.restore();
        requestAnimationFrame(gameLoop);
    }

    document.getElementById('btn-play-game').addEventListener('click', () => {
        mainMenu.classList.add('hidden');
        gameState = 'idle';
    });

    btnStart.addEventListener('click', initRound);
    btnCashout.addEventListener('click', cashout);

    betInput.addEventListener('change', () => {
        let val = parseFloat(betInput.value);
        if (isNaN(val) || val < 1) val = 1;
        if (val > balance) val = balance;
        currentBet = val;
        betInput.value = currentBet;
    });

    document.getElementById('btn-min').addEventListener('click', () => { currentBet = 1; betInput.value = 1; });
    document.getElementById('btn-max').addEventListener('click', () => { currentBet = Math.floor(balance); betInput.value = 1; });
    document.getElementById('btn-x2').addEventListener('click', () => { currentBet = Math.min(Math.floor(balance), currentBet * 2); betInput.value = currentBet; });

    document.querySelectorAll('.risk-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.risk-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            selectedRisk = e.target.dataset.risk;
        });
    });

    requestAnimationFrame(gameLoop);
</script>
</body>
