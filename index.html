<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё портфолио</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease-out;
        }

        .badge {
            display: inline-block;
            background: rgba(56, 139, 253, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(56, 139, 253, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #8b949e;
            margin-bottom: 28px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 13px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.15s, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #238636;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #2ea043;
        }

        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #363b42;
        }

        .btn-secondary:hover {
            background-color: #30363d;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">Онлайн • GitHub Pages</div>
        <h1>Добро пожаловать!</h1>
        <p>Это мой личный сайт-визитка. Здесь скоро появятся мои проекты, ссылки и обновления.</p>
        
        <div class="links">
            <a href="https://github.com" target="_blank" class="btn btn-primary">Мой профиль GitHub</a>
            <a href="https://t.me" target="_blank" class="btn btn-secondary">Связаться в Telegram</a>
        </div>
    </div>

</body>
</html>
