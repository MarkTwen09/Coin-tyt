<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER // Protocol Stress Lab 2026</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js for 3D Cyber Globe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-dark: #03050a;
            --panel-glass: rgba(10, 15, 29, 0.65);
            --panel-border: rgba(56, 189, 248, 0.18);
            --panel-border-active: rgba(56, 189, 248, 0.5);
            --neon-cyan: #00f0ff;
            --neon-blue: #3b82f6;
            --neon-purple: #8b5cf6;
            --neon-red: #ff2a6d;
            --neon-green: #05ffa1;
            --text-main: #f3f4f6;
            --text-muted: #64748b;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.04) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.04) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* 3D Canvas Background Container */
        #globe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Ambient HUD Scanlines */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 99;
            pointer-events: none;
            opacity: 0.2;
        }

        /* Header Navigation */
        header {
            position: relative;
            z-index: 10;
            height: 64px;
            border-bottom: 1px solid var(--panel-border);
            background: rgba(5, 8, 18, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-mono);
            font-weight: 800;
            letter-spacing: 1.5px;
            font-size: 16px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-family: var(--font-mono);
            background: rgba(5, 255, 161, 0.08);
            border: 1px solid rgba(5, 255, 161, 0.25);
            color: var(--neon-green);
            padding: 6px 14px;
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(5, 255, 161, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        /* Dashboard Main Layout */
        .dashboard {
            position: relative;
            z-index: 10;
            flex: 1;
            display: grid;
            grid-template-columns: 360px 1fr 380px;
            gap: 20px;
            padding: 24px;
            max-width: 1920px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1380px) {
            .dashboard { grid-template-columns: 340px 1fr; }
            .right-panel { grid-column: span 2; }
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .right-panel { grid-column: span 1; }
        }

        /* Glassmorphic Panel Cards */
        .panel {
            background: var(--panel-glass);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .panel:hover {
            border-color: var(--panel-border-active);
            box-shadow: 0 20px 50px rgba(0, 240, 255, 0.08);
        }

        .panel-header {
            padding: 18px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.015);
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-body {
            padding: 22px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Controls & Form Inputs */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            width: 18px;
            height: 18px;
            transition: color 0.3s;
        }

        input[type="text"], select {
            width: 100%;
            background: rgba(6, 11, 25, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 13px 14px 13px 44px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        select { appearance: none; cursor: pointer; }

        input[type="text"]:focus, select:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
            background: rgba(6, 11, 25, 0.9);
        }

        input[type="text"]:focus + i, select:focus + i {
            color: var(--neon-cyan);
        }

        /* Services Grid Selection */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 170px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .service-chip {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.25s ease;
        }

        .service-chip:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .service-chip.active {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .service-chip input { display: none; }

        /* Action Buttons */
        .btn-action {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-start {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
            color: #000;
            box-shadow: 0 4px 25px rgba(0, 240, 255, 0.35);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 240, 255, 0.55);
        }

        .btn-stop {
            background: linear-gradient(135deg, var(--neon-red), #b91c1c);
            color: #fff;
            box-shadow: 0 4px 25px rgba(255, 42, 109, 0.35);
            display: none;
        }

        .btn-stop:hover {
            box-shadow: 0 8px 30px rgba(255, 42, 109, 0.55);
        }

        /* Metric Indicator Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-value {
            font-family: var(--font-mono);
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .metric-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Visual Charts Canvas */
        .chart-box {
            width: 100%;
            height: 170px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        canvas.chart-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Terminal Logs Output */
        .terminal {
            background: rgba(2, 5, 14, 0.9);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 12px;
            height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .terminal-line {
            display: flex;
            gap: 10px;
            line-height: 1.4;
            word-break: break-all;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-4px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .terminal-time { color: var(--text-muted); flex-shrink: 0; }

        .terminal-tag {
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
            height: fit-content;
        }

        .tag-info { background: rgba(0, 240, 255, 0.15); color: var(--neon-cyan); }
        .tag-success { background: rgba(5, 255, 161, 0.15); color: var(--neon-green); }
        .tag-warn { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .tag-error { background: rgba(255, 42, 109, 0.15); color: var(--neon-red); }

        .terminal-msg { color: #cbd5e1; }

        /* Sound Switch Toggle */
        .sound-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .sound-toggle:hover { color: var(--text-main); }

        /* Custom Progress Bar */
        .progress-bar-outer {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
            border-radius: 3px;
            transition: width 0.2s ease;
            box-shadow: 0 0 12px var(--neon-cyan);
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Background Canvas -->
    <div id="globe-container"></div>

    <header>
        <div class="brand">
            <div class="brand-icon">
                <i data-lucide="shield-check" style="width: 20px; height: 20px; color: #000;"></i>
            </div>
            <span>AETHER <span style="color: var(--neon-cyan); font-weight: 300;">LAB 2026</span></span>
        </div>

        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="sound-toggle" onclick="toggleAudio()" id="soundBtn">
                <i data-lucide="volume-2" style="width: 16px; height: 16px;"></i>
                <span id="soundLabel">Звук: ВКЛ</span>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span id="systemStatus">ЯДРО АКТИВНО</span>
            </div>
        </div>
    </header>

    <div class="dashboard">
        
        <!-- Left Panel: Stress Controls -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i data-lucide="sliders" style="width: 16px; height: 16px; color: var(--neon-cyan);"></i>
                    Конфигурация Атаки
                </div>
            </div>
            <div class="panel-body">
                
                <div class="form-group">
                    <label>Целевой Номер</label>
                    <div class="input-wrapper">
                        <input type="text" id="targetPhone" placeholder="+7 (999) 000-00-00" value="+7 (900) 123-45-67">
                        <i data-lucide="phone"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Скорость (Запросов/сек)</label>
                    <div class="input-wrapper">
                        <select id="attackSpeed">
                            <option value="10">10 req/sec (Стандарт)</option>
                            <option value="25" selected>25 req/sec (Интенсив)</option>
                            <option value="50">50 req/sec (Высокая)</option>
                            <option value="100">100 req/sec (OVERCLOCK)</option>
                        </select>
                        <i data-lucide="zap"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Лимит Пакетов</label>
                    <div class="input-wrapper">
                        <select id="packetLimit">
                            <option value="100">100 пакетов</option>
                            <option value="250" selected>250 пакетов</option>
                            <option value="500">500 пакетов</option>
                            <option value="2000">2000 пакетов</option>
                        </select>
                        <i data-lucide="layers"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Шлюзы Сервисов</label>
                    <div class="services-grid" id="servicesGrid">
                        <!-- JS Injected -->
                    </div>
                </div>

                <div style="margin-top: auto; padding-top: 10px;">
                    <button class="btn-action btn-start" id="startBtn" onclick="startStressTest()">
                        <i data-lucide="play" style="width: 18px; height: 18px;"></i>
                        ЗАПУСТИТЬ ТЕСТ
                    </button>
                    <button class="btn-action btn-stop" id="stopBtn" onclick="stopStressTest()">
                        <i data-lucide="square" style="width: 18px; height: 18px;"></i>
                        ОСТАНОВИТЬ
                    </button>
                </div>

            </div>
        </div>

        <!-- Center Panel: Realtime Telemetry -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i data-lucide="activity" style="width: 16px; height: 16px; color: var(--neon-cyan);"></i>
                    Телеметрия Сервера
                </div>
            </div>
            <div class="panel-body">
                
                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-label">Всего</span>
                        <span class="metric-value" id="sentCount" style="color: var(--neon-cyan);">0</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Успех 200</span>
                        <span class="metric-value" id="successCount" style="color: var(--neon-green);">0</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Ошибки</span>
                        <span class="metric-value" id="errorCount" style="color: var(--neon-red);">0</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Ping</span>
                        <span class="metric-value" id="pingVal" style="color: #f59e0b;">12 ms</span>
                    </div>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label>Прогресс Итерации</label>
                        <span id="progressPercent" style="font-family: var(--font-mono); font-size: 12px; color: var(--neon-cyan);">0%</span>
                    </div>
                    <div class="progress-bar-outer">
                        <div class="progress-bar-inner" id="progressBar"></div>
                    </div>
                </div>

                <div>
                    <label style="margin-bottom: 8px; display: block;">Пропускная Способность (RPS)</label>
                    <div class="chart-box">
                        <canvas id="rpsCanvas" class="chart-canvas"></canvas>
                    </div>
                </div>

                <div>
                    <label style="margin-bottom: 8px; display: block;">Задержка Сети (Latency - ms)</label>
                    <div class="chart-box" style="height: 120px;">
                        <canvas id="pingCanvas" class="chart-canvas"></canvas>
                    </div>
                </div>

            </div>
        </div>

        <!-- Right Panel: Live Cyber Terminal -->
        <div class="panel right-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i data-lucide="terminal" style="width: 16px; height: 16px; color: var(--neon-cyan);"></i>
                    Системный Лог
                </div>
                <i data-lucide="trash-2" style="width: 14px; height: 14px; color: var(--text-muted); cursor: pointer;" onclick="clearTerminal()"></i>
            </div>
            <div class="panel-body" style="padding: 12px;">
                <div class="terminal" id="terminalLog">
                    <div class="terminal-line">
                        <span class="terminal-time">00:00:00</span>
                        <span class="terminal-tag tag-info">SYS</span>
                        <span class="terminal-msg">Модуль готов к работе. Задайте параметры теста.</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        // ----------------------------------------------------
        // Web Audio Synth FX Engine
        // ----------------------------------------------------
        class AudioSynth {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playBeep(freq = 800, duration = 0.04, type = 'sine', gainVal = 0.04) {
                if (!this.enabled) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }

            playSuccess() { this.playBeep(1400, 0.03, 'sine', 0.02); }
            playError() { this.playBeep(240, 0.07, 'sawtooth', 0.03); }
            playStart() {
                this.playBeep(500, 0.08, 'triangle', 0.05);
                setTimeout(() => this.playBeep(900, 0.12, 'sine', 0.05), 60);
            }
        }

        const audio = new AudioSynth();
        function toggleAudio() {
            audio.enabled = !audio.enabled;
            document.getElementById('soundLabel').innerText = audio.enabled ? 'Звук: ВКЛ' : 'Звук: ВЫКЛ';
        }

        // ----------------------------------------------------
        // 3D WebGL Globe Background (Three.js)
        // ----------------------------------------------------
        let scene, camera, renderer, globeGroup;

        function init3D() {
            const container = document.getElementById('globe-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 220;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            globeGroup = new THREE.Group();

            // Sphere Wireframe
            const geo = new THREE.IcosahedronGeometry(80, 4);
            const mat = new THREE.MeshBasicMaterial({
                color: 0x00f0ff,
                wireframe: true,
                transparent: true,
                opacity: 0.12
            });
            const globe = new THREE.Mesh(geo, mat);
            globeGroup.add(globe);

            // Particles
            const particlesGeo = new THREE.BufferGeometry();
            const count = 300;
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count*3; i++) {
                pos[i] = (Math.random() - 0.5) * 260;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const particlesMat = new THREE.PointsMaterial({
                size: 2,
                color: 0x3b82f6,
                transparent: true,
                opacity: 0.4
            });
            const particles = new THREE.Points(particlesGeo, particlesMat);
            globeGroup.add(particles);

            scene.add(globeGroup);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (globeGroup) {
                globeGroup.rotation.y += isTesting ? 0.008 : 0.002;
                globeGroup.rotation.x += 0.001;
            }
            renderer.render(scene, camera);
        }

        // ----------------------------------------------------
        // Services Grid & App Logic
        // ----------------------------------------------------
        const serviceProviders = [
            'Telegram OAuth', 'WhatsApp Business', 'VK ID Auth', 'Tinkoff Pay',
            'SberPass', 'Yandex Cloud', 'Ozon Express', 'WB Direct',
            'Avito Gate', 'Uber Security', 'Delivery Auth', 'MVideo SMS'
        ];

        const servicesContainer = document.getElementById('servicesGrid');
        serviceProviders.forEach(svc => {
            const label = document.createElement('label');
            label.className = 'service-chip active';
            label.innerHTML = `
                <input type="checkbox" checked value="${svc}" onchange="this.parentElement.classList.toggle('active', this.checked)">
                <span>${svc}</span>
            `;
            servicesContainer.appendChild(label);
        });

        // App States
        let isTesting = false;
        let testTimer = null;
        let sent = 0, success = 0, errors = 0;
        let targetTotal = 250;

        // Charts Setup
        const rpsCanvas = document.getElementById('rpsCanvas');
        const rpsCtx = rpsCanvas.getContext('2d');
        const pingCanvas = document.getElementById('pingCanvas');
        const pingCtx = pingCanvas.getContext('2d');

        let rpsHistory = new Array(30).fill(0);
        let pingHistory = new Array(30).fill(12);

        function resizeCharts() {
            rpsCanvas.width = rpsCanvas.parentElement.clientWidth;
            rpsCanvas.height = rpsCanvas.parentElement.clientHeight;
            pingCanvas.width = pingCanvas.parentElement.clientWidth;
            pingCanvas.height = pingCanvas.parentElement.clientHeight;
        }

        function renderAreaChart(ctx, canvas, data, color, maxVal) {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            // Grid Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for(let y = 0; y < h; y += 20) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            }

            // Wave
            ctx.beginPath();
            const step = w / (data.length - 1);
            ctx.moveTo(0, h);

            for (let i = 0; i < data.length; i++) {
                const val = (data[i] / maxVal) * (h - 15);
                const x = i * step;
                const y = h - val;
                if (i === 0) ctx.lineTo(x, y);
                else {
                    const prevX = (i - 1) * step;
                    const prevY = h - (data[i - 1] / maxVal) * (h - 15);
                    const cx = (prevX + x) / 2;
                    ctx.bezierCurveTo(cx, prevY, cx, y, x, y);
                }
            }
            ctx.lineTo(w, h);
            ctx.closePath();

            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, color.replace('1)', '0.3)'));
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fill();

            // Line
            ctx.beginPath();
            for (let i = 0; i < data.length; i++) {
                const val = (data[i] / maxVal) * (h - 15);
                const x = i * step;
                const y = h - val;
                if (i === 0) ctx.moveTo(x, y);
                else {
                    const prevX = (i - 1) * step;
                    const prevY = h - (data[i - 1] / maxVal) * (h - 15);
                    const cx = (prevX + x) / 2;
                    ctx.bezierCurveTo(cx, prevY, cx, y, x, y);
                }
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function log(msg, type = 'info') {
            const terminal = document.getElementById('terminalLog');
            const line = document.createElement('div');
            line.className = 'terminal-line';
            const time = new Date().toLocaleTimeString();

            let tagClass = 'tag-info', tagText = 'INFO';
            if (type === 'success') { tagClass = 'tag-success'; tagText = '200 OK'; }
            if (type === 'warn') { tagClass = 'tag-warn'; tagText = 'WARN'; }
            if (type === 'error') { tagClass = 'tag-error'; tagText = '429 LIMIT'; }

            line.innerHTML = `
                <span class="terminal-time">${time}</span>
                <span class="terminal-tag ${tagClass}">${tagText}</span>
                <span class="terminal-msg">${msg}</span>
            `;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('terminalLog').innerHTML = '';
        }

        function startStressTest() {
            const phone = document.getElementById('targetPhone').value.trim();
            if (!phone) {
                log('Ошибка: Введите номер телефона', 'error');
                audio.playError();
                return;
            }

            const activeServices = Array.from(document.querySelectorAll('#servicesGrid input:checked')).map(e => e.value);
            if (activeServices.length === 0) {
                log('Ошибка: Выберите сервисы для отправки', 'error');
                audio.playError();
                return;
            }

            isTesting = true;
            sent = 0; success = 0; errors = 0;
            targetTotal = parseInt(document.getElementById('packetLimit').value);
            const speed = parseInt(document.getElementById('attackSpeed').value);

            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';
            document.getElementById('systemStatus').innerText = 'ТЕСТИРОВАНИЕ...';
            document.getElementById('systemStatus').style.color = 'var(--neon-cyan)';

            audio.playStart();
            log(`Сессия открыта. Объект: ${phone}`, 'info');
            log(`Активных прокси-узлов: ${activeServices.length}. Скорость: ${speed} req/s`, 'info');

            const intervalMs = Math.max(15, Math.floor(1000 / speed));

            testTimer = setInterval(() => {
                if (!isTesting) return;

                sent++;
                const isErr = Math.random() < 0.10;

                if (isErr) {
                    errors++;
                    audio.playError();
                    const svc = activeServices[Math.floor(Math.random() * activeServices.length)];
                    log(`[${svc}] Таймаут или превышен лимит (Rate Limit)`, 'error');
                } else {
                    success++;
                    audio.playSuccess();
                    const svc = activeServices[Math.floor(Math.random() * activeServices.length)];
                    log(`[${svc}] Пакет успешно доставлен (HTTP 200)`, 'success');
                }

                // Update Telemetry
                document.getElementById('sentCount').innerText = sent;
                document.getElementById('successCount').innerText = success;
                document.getElementById('errorCount').innerText = errors;

                const currentPing = Math.floor(10 + Math.random() * 25 + (isErr ? 40 : 0));
                document.getElementById('pingVal').innerText = currentPing + ' ms';

                // Progress Bar
                const pct = Math.min(100, Math.round((sent / targetTotal) * 100));
                document.getElementById('progressBar').style.width = pct + '%';
                document.getElementById('progressPercent').innerText = pct + '%';

                // Realtime Charts
                rpsHistory.shift(); rpsHistory.push(speed + (Math.random() * 10 - 5));
                pingHistory.shift(); pingHistory.push(currentPing);

                renderAreaChart(rpsCtx, rpsCanvas, rpsHistory, 'rgba(0, 240, 255, 1)', 120);
                renderAreaChart(pingCtx, pingCanvas, pingHistory, 'rgba(245, 158, 11, 1)', 100);

                if (sent >= targetTotal) stopStressTest(true);

            }, intervalMs);
        }

        function stopStressTest(completed = false) {
            isTesting = false;
            if (testTimer) clearInterval(testTimer);

            document.getElementById('startBtn').style.display = 'flex';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('systemStatus').innerText = 'ЯДРО АКТИВНО';
            document.getElementById('systemStatus').style.color = 'var(--neon-green)';

            rpsHistory.fill(0);
            renderAreaChart(rpsCtx, rpsCanvas, rpsHistory, 'rgba(0, 240, 255, 1)', 120);

            if (completed) {
                log(`Симуляция завершена. Успешно: ${success}/${sent} (${Math.round((success/sent)*100)}%)`, 'info');
                audio.playStart();
            } else {
                log('Тестирование прервано пользователем', 'warn');
                audio.playError();
            }
        }

        // Init App on Load
        window.addEventListener('load', () => {
            init3D();
            animate3D();
            resizeCharts();
            renderAreaChart(rpsCtx, rpsCanvas, rpsHistory, 'rgba(0, 240, 255, 1)', 120);
            renderAreaChart(pingCtx, pingCanvas, pingHistory, 'rgba(245, 158, 11, 1)', 100);
        });

        window.addEventListener('resize', resizeCharts);
    </script>
</body>
</html>
