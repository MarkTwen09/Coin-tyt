<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER // Gateway Stress Testing Platform</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #07090e;
            --surface: rgba(18, 22, 34, 0.65);
            --surface-subtle: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(129, 140, 248, 0.3);
            
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #f43f5e;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            
            --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(99, 102, 241, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(168, 85, 247, 0.08), transparent);
            background-attachment: fixed;
        }

        /* Top Navigation Header */
        header {
            height: 64px;
            border-bottom: 1px solid var(--border);
            background: rgba(7, 9, 14, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: -0.01em;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: var(--accent-gradient);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-family: var(--font-mono);
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 5px 14px;
            border-radius: 20px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        /* Main Grid */
        .container {
            flex: 1;
            display: grid;
            grid-template-columns: 380px 1fr 420px;
            gap: 20px;
            padding: 24px 32px;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1400px) {
            .container { grid-template-columns: 360px 1fr; }
            .right-panel { grid-column: span 2; }
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .right-panel { grid-column: span 1; }
        }

        /* Glass Panel Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.36);
            transition: border-color 0.25s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
        }

        .card-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.01);
        }

        .card-body {
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            flex: 1;
        }

        /* Forms & Inputs */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-tertiary);
            width: 16px;
            height: 16px;
            transition: color 0.2s;
        }

        input[type="text"], select {
            width: 100%;
            background: rgba(10, 13, 22, 0.7);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px 12px 42px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        select { appearance: none; cursor: pointer; }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: rgba(10, 13, 22, 0.95);
        }

        input[type="text"]:focus + i, select:focus + i {
            color: var(--accent);
        }

        /* Services Choice Boxes */
        .services-actions {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: var(--accent);
            cursor: pointer;
        }

        .services-actions span:hover { text-decoration: underline; }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 170px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .service-chip {
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .service-chip:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .service-chip.active {
            background: rgba(99, 102, 241, 0.12);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .service-chip input { display: none; }

        /* Action Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.02em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 24px var(--accent-glow);
        }

        .btn-danger {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: var(--danger);
            display: none;
        }

        .btn-danger:hover {
            background: rgba(244, 63, 94, 0.22);
        }

        /* Telemetry Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .metric-card {
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-value {
            font-family: var(--font-mono);
            font-size: 18px;
            font-weight: 700;
        }

        .metric-label {
            font-size: 10px;
            color: var(--text-tertiary);
            text-transform: uppercase;
        }

        /* Progress Line */
        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gradient);
            border-radius: 3px;
            transition: width 0.2s ease;
        }

        /* Charts Box */
        .chart-box {
            width: 100%;
            height: 150px;
            background: rgba(8, 10, 18, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        canvas { width: 100%; height: 100%; display: block; }

        /* Terminal Console */
        .terminal {
            background: rgba(5, 7, 12, 0.9);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 11px;
            height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-row {
            display: flex;
            gap: 10px;
            line-height: 1.4;
            word-break: break-all;
        }

        .log-time { color: var(--text-tertiary); flex-shrink: 0; }
        .log-badge {
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            flex-shrink: 0;
            height: fit-content;
        }

        .bg-success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .bg-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .bg-danger { background: rgba(244, 63, 94, 0.15); color: var(--danger); }
        .bg-info { background: rgba(99, 102, 241, 0.15); color: #818cf8; }

        .log-msg { color: #cbd5e1; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon">
                <i data-lucide="shield-alert" style="width: 18px; height: 18px; color: #fff;"></i>
            </div>
            <span>AETHER <span style="color: var(--text-tertiary); font-weight: 400;">// Stress Test v5.2</span></span>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span id="sysStatusText">Ядро готово</span>
        </div>
    </header>

    <div class="container">
        
        <!-- Controls Column -->
        <div class="card">
            <div class="card-header">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="sliders" style="width: 15px; height: 15px; color: var(--accent);"></i> Параметры тестов
                </span>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>Целевой номер</label>
                    <div class="input-wrapper">
                        <input type="text" id="phoneInput" value="+7 (900) 123-45-67">
                        <i data-lucide="phone"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Интенсивность</label>
                    <div class="input-wrapper">
                        <select id="rateSelect">
                            <option value="5">Низкая (5 req/s - Stealth)</option>
                            <option value="12" selected>Средняя (12 req/s - Adaptive)</option>
                            <option value="25">Высокая (25 req/s - Burst)</option>
                        </select>
                        <i data-lucide="zap"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Лимит пакетов</label>
                    <div class="input-wrapper">
                        <select id="limitSelect">
                            <option value="60">60 пакетов</option>
                            <option value="150" selected>150 пакетов</option>
                            <option value="300">300 пакетов</option>
                        </select>
                        <i data-lucide="layers"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        Шлюзы маршрутизации
                        <div class="services-actions">
                            <span onclick="selectAllGateways(true)">Все</span>
                            <span onclick="selectAllGateways(false)">Сбросить</span>
                        </div>
                    </label>
                    <div class="services-grid" id="gatewaysGrid"></div>
                </div>

                <div style="margin-top: auto; padding-top: 10px;">
                    <button class="btn btn-primary" id="startBtn" onclick="startSimulation()">
                        <i data-lucide="play" style="width: 16px; height: 16px;"></i> Запустить эмуляцию
                    </button>
                    <button class="btn btn-danger" id="stopBtn" onclick="stopSimulation()">
                        <i data-lucide="square" style="width: 16px; height: 16px;"></i> Остановить
                    </button>
                </div>
            </div>
        </div>

        <!-- Telemetry & Analytics Column -->
        <div class="card">
            <div class="card-header">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="activity" style="width: 15px; height: 15px; color: var(--accent);"></i> Мониторинг сети
                </span>
                <span id="proxyInfo" style="font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary);">IP: Standby</span>
            </div>
            <div class="card-body">
                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-label">Запросов</span>
                        <span class="metric-value" id="mSent">0</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Успех 200</span>
                        <span class="metric-value" id="mSuccess" style="color: var(--success);">0</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Ошибки 429</span>
                        <span class="metric-value" id="mErrors" style="color: var(--danger);">0</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Ping</span>
                        <span class="metric-value" id="mPing" style="color: var(--warning);">0 ms</span>
                    </div>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-tertiary);">
                        <span>Прогресс выполнения</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressBar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Пропускная способность (RPS)</label>
                    <div class="chart-box">
                        <canvas id="rpsCanvas"></canvas>
                    </div>
                </div>

                <div class="form-group">
                    <label>Задержка откликов (Latency - ms)</label>
                    <div class="chart-box" style="height: 110px;">
                        <canvas id="pingCanvas"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Live Terminal Column -->
        <div class="card right-panel">
            <div class="card-header">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="terminal" style="width: 15px; height: 15px; color: var(--accent);"></i> Консоль
                </span>
                <i data-lucide="trash-2" style="width: 14px; height: 14px; cursor: pointer; color: var(--text-tertiary);" onclick="clearLogs()"></i>
            </div>
            <div class="card-body" style="padding: 12px;">
                <div class="terminal" id="terminal">
                    <div class="log-row">
                        <span class="log-time">00:00:00</span>
                        <span class="log-badge bg-info">INIT</span>
                        <span class="log-msg">Модуль инициализирован. Задайте параметры целевой сессии.</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        const gatewaysList = [
            'Telegram API Hub', 'WhatsApp Auth', 'VK ID Security', 'Tinkoff Secure',
            'SberID Auth', 'Yandex Passport', 'Ozon Express', 'WB Direct API',
            'Avito Gate', 'Uber Security', 'Delivery Auth', 'X5 ID Gateway'
        ];

        const proxyPool = [
            '185.220.101.5 (NL)', '45.142.122.8 (DE)', '194.67.210.4 (RU)',
            '91.240.118.2 (SG)', '176.119.10.15 (KZ)', '212.109.19.7 (FR)'
        ];

        // Render Service Checkboxes
        const grid = document.getElementById('gatewaysGrid');
        gatewaysList.forEach(gw => {
            const label = document.createElement('label');
            label.className = 'service-chip active';
            label.innerHTML = `
                <input type="checkbox" checked value="${gw}" onchange="this.parentElement.classList.toggle('active', this.checked)">
                <span>${gw}</span>
            `;
            grid.appendChild(label);
        });

        function selectAllGateways(state) {
            document.querySelectorAll('#gatewaysGrid label').forEach(label => {
                const cb = label.querySelector('input');
                cb.checked = state;
                label.classList.toggle('active', state);
            });
        }

        let isRunning = false;
        let timer = null;
        let sent = 0, success = 0, errors = 0, targetTotal = 150;
        
        let rpsHistory = new Array(30).fill(0);
        let pingHistory = new Array(30).fill(15);

        const rpsCanvas = document.getElementById('rpsCanvas');
        const rpsCtx = rpsCanvas.getContext('2d');
        const pingCanvas = document.getElementById('pingCanvas');
        const pingCtx = pingCanvas.getContext('2d');

        function resizeCanvas() {
            rpsCanvas.width = rpsCanvas.parentElement.clientWidth;
            rpsCanvas.height = rpsCanvas.parentElement.clientHeight;
            pingCanvas.width = pingCanvas.parentElement.clientWidth;
            pingCanvas.height = pingCanvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawWaveChart(ctx, canvas, data, colorHex, maxVal) {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            // Background Grid Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for(let y = 0; y < h; y += 20) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            }

            // Fill Area
            ctx.beginPath();
            const step = w / (data.length - 1);
            ctx.moveTo(0, h);
            for(let i = 0; i < data.length; i++) {
                const val = (data[i] / maxVal) * (h - 15);
                const x = i * step;
                const y = h - val;
                if(i === 0) ctx.lineTo(x, y);
                else {
                    const px = (i - 1) * step;
                    const py = h - (data[i - 1] / maxVal) * (h - 15);
                    const cx = (px + x) / 2;
                    ctx.bezierCurveTo(cx, py, cx, y, x, y);
                }
            }
            ctx.lineTo(w, h);
            ctx.closePath();

            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, colorHex + '33');
            grad.addColorStop(1, colorHex + '00');
            ctx.fillStyle = grad;
            ctx.fill();

            // Line
            ctx.beginPath();
            for(let i = 0; i < data.length; i++) {
                const val = (data[i] / maxVal) * (h - 15);
                const x = i * step;
                const y = h - val;
                if(i === 0) ctx.moveTo(x, y);
                else {
                    const px = (i - 1) * step;
                    const py = h - (data[i - 1] / maxVal) * (h - 15);
                    const cx = (px + x) / 2;
                    ctx.bezierCurveTo(cx, py, cx, y, x, y);
                }
            }
            ctx.strokeStyle = colorHex;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function log(msg, type = 'info') {
            const term = document.getElementById('terminal');
            const row = document.createElement('div');
            row.className = 'log-row';
            const time = new Date().toLocaleTimeString();

            let badgeClass = 'bg-info', badgeText = 'INFO';
            if(type === 'success') { badgeClass = 'bg-success'; badgeText = '200 OK'; }
            if(type === 'warn') { badgeClass = 'bg-warning'; badgeText = '429 LIMIT'; }
            if(type === 'error') { badgeClass = 'bg-danger'; badgeText = '504 TIMEOUT'; }

            row.innerHTML = `
                <span class="log-time">${time}</span>
                <span class="log-badge ${badgeClass}">${badgeText}</span>
                <span class="log-msg">${msg}</span>
            `;
            term.appendChild(row);
            term.scrollTop = term.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('terminal').innerHTML = '';
        }

        function getSelectedGateways() {
            const selected = [];
            document.querySelectorAll('#gatewaysGrid input[type="checkbox"]:checked').forEach(cb => {
                selected.push(cb.value);
            });
            return selected;
        }

        function startSimulation() {
            const phone = document.getElementById('phoneInput').value.trim();
            if(!phone) { alert('Пожалуйста, введите целевой номер телефона!'); return; }

            const activeGateways = getSelectedGateways();
            if(activeGateways.length === 0) { 
                alert('Выберите хотя бы один шлюз из списка!'); 
                return; 
            }

            isRunning = true;
            sent = 0; success = 0; errors = 0;
            targetTotal = parseInt(document.getElementById('limitSelect').value);
            const speed = parseInt(document.getElementById('rateSelect').value);

            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';
            document.getElementById('sysStatusText').innerText = 'Эмуляция активности...';

            log(`Сессия открыта для ${phone}. Выбрано активных узлов: ${activeGateways.length}`, 'info');

            const intervalMs = Math.floor(1000 / speed);

            timer = setInterval(() => {
                if(!isRunning) return;

                sent++;

                // Realism Engine: As attack progresses, target WAF protection triggers more blocks
                const progressRatio = sent / targetTotal;
                const failureThreshold = 0.50 + (progressRatio * 0.35); // 50% fail early, up to 85% fail later
                
                const rand = Math.random();
                const gw = activeGateways[Math.floor(Math.random() * activeGateways.length)];
                const currentProxy = proxyPool[Math.floor(Math.random() * proxyPool.length)];
                
                document.getElementById('proxyInfo').innerText = `IP: ${currentProxy}`;

                const currentPing = Math.floor(12 + Math.random() * 20 + (progressRatio * 80));
                document.getElementById('mPing').innerText = `${currentPing} ms`;

                if(rand > failureThreshold) {
                    success++;
                    log(`[${gw}] Авторизационный пакет принят [200 OK]`, 'success');
                } else if(rand > 0.15) {
                    errors++;
                    log(`[${gw}] Ограничение частоты запросов [429 Rate Limit]`, 'warn');
                } else {
                    errors++;
                    log(`[${gw}] Сброс соединения экраном Cloudflare / WAF`, 'error');
                }

                document.getElementById('mSent').innerText = sent;
                document.getElementById('mSuccess').innerText = success;
                document.getElementById('mErrors').innerText = errors;

                const pct = Math.min(100, Math.round((sent / targetTotal) * 100));
                document.getElementById('progressBar').style.width = pct + '%';
                document.getElementById('progressText').innerText = pct + '%';

                rpsHistory.shift(); rpsHistory.push(speed + (Math.random() * 4 - 2));
                pingHistory.shift(); pingHistory.push(currentPing);

                drawWaveChart(rpsCtx, rpsCanvas, rpsHistory, '#6366f1', 30);
                drawWaveChart(pingCtx, pingCanvas, pingHistory, '#f59e0b', 120);

                if(sent >= targetTotal) {
                    stopSimulation(true);
                }
            }, intervalMs);
        }

        function stopSimulation(completed = false) {
            isRunning = false;
            if(timer) clearInterval(timer);

            document.getElementById('startBtn').style.display = 'flex';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('sysStatusText').innerText = 'Ядро готово';
            document.getElementById('proxyInfo').innerText = 'IP: Standby';

            rpsHistory.fill(0);
            drawWaveChart(rpsCtx, rpsCanvas, rpsHistory, '#6366f1', 30);

            if(completed) {
                log(`Эмуляция завершена. Доставлено: ${success}/${sent} (${Math.round((success/sent)*100)}%)`, 'info');
            } else {
                log('Эмуляция остановлена пользователем.', 'warn');
            }
        }

        // Init blank charts
        drawWaveChart(rpsCtx, rpsCanvas, rpsHistory, '#6366f1', 30);
        drawWaveChart(pingCtx, pingCanvas, pingHistory, '#f59e0b', 120);
    </script>
</body>
</html>
